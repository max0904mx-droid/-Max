<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>照片版 2048</title>
<style>
  :root{
    --bg: #2b2620;
    --board-bg: #3d362c;
    --cell-empty: #4a4238;
    --accent: #e8b04b;
    --text-light: #f6efe3;
    --text-dark: #2b2620;
    --radius: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    font-family: "PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
    color: var(--text-light);
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .menu-btn{
    width:44px; height:44px;
    border-radius: 10px;
    background: var(--board-bg);
    border: none;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:4px;
    cursor:pointer;
  }
  .menu-btn span{
    display:block; width:20px; height:2px; background: var(--text-light); border-radius:2px;
  }
  h1{
    font-size: 22px;
    margin:0;
    letter-spacing: 1px;
  }
  .scores{
    display:flex; gap:8px;
  }
  .score-box{
    background: var(--board-bg);
    border-radius: 10px;
    padding: 6px 12px;
    text-align:center;
    min-width: 64px;
  }
  .score-box .label{ font-size:11px; opacity:.65; }
  .score-box .value{ font-size:18px; font-weight:700; }

  .toolbar{
    display:flex; gap:10px; margin-bottom: 14px;
  }
  .btn{
    flex:1;
    background: var(--accent);
    color: var(--text-dark);
    border:none;
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn.secondary{
    background: var(--board-bg);
    color: var(--text-light);
  }
  .btn:disabled{
    opacity: .4;
    cursor:not-allowed;
  }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 1/1;
    background: var(--board-bg);
    border-radius: var(--radius);
    padding: 10px;
  }
  .board-bg-grid{
    position:absolute;
    inset:10px;
    display:grid;
    grid-template-columns: repeat(4,1fr);
    grid-template-rows: repeat(4,1fr);
    gap: 10px;
  }
  .cell-bg{
    background: var(--cell-empty);
    border-radius: 8px;
  }
  .tiles-layer{
    position:absolute;
    inset:10px;
  }
  .tile{
    position:absolute;
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#fff;
    overflow:hidden;
    transition: left .12s ease, top .12s ease, transform .12s ease;
  }
  .tile .photo-bg{
    position:absolute;
    inset:0;
    background-size: cover;
    background-position: center;
    filter: blur(6px) brightness(.6);
    transform: scale(1.1);
  }
  .tile .photo-bg.fallback{
    background: linear-gradient(135deg,#6b6053,#4a4238);
    filter:none;
  }
  .tile .num{
    position:relative;
    z-index:2;
    text-shadow: 0 2px 6px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.6);
    font-size: 26px;
  }
  .tile.pop{
    animation: pop .18s ease;
  }
  @keyframes pop{
    0%{ transform: scale(.7); }
    70%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }

  .hint{
    text-align:center;
    font-size: 12px;
    opacity:.6;
    margin-top: 12px;
  }

  /* Overlay - milestone */
  .overlay{
    position:fixed; inset:0;
    background: rgba(20,17,12,.92);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index: 50;
    padding: 24px;
    text-align:center;
  }
  .overlay.show{ display:flex; }
  .overlay h2{
    font-size: 26px;
    margin-bottom: 10px;
  }
  .overlay .reward-text{
    font-size: 22px;
    color: var(--accent);
    font-weight:800;
    margin-bottom: 26px;
  }
  .overlay .photo-preview{
    width: 140px; height:140px;
    border-radius: 14px;
    background-size: cover;
    background-position:center;
    margin-bottom: 22px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .overlay .btn{
    flex: none;
    width: auto;
    max-width: none !important;
    padding: 16px 56px;
    font-size: 20px;
    white-space: nowrap;
  }

  /* Side menu */
  .side-menu{
    position: fixed;
    top:0; left:0;
    width: 280px;
    max-width: 82vw;
    height:100%;
    background: var(--board-bg);
    transform: translateX(-100%);
    transition: transform .25s ease;
    z-index: 60;
    padding: 20px;
    overflow-y:auto;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .side-menu.show{ transform: translateX(0); }
  #leaderboardPanel{ left:auto; right:0; transform: translateX(100%); }
  #leaderboardPanel.show{ transform: translateX(0); }
  .side-menu h3{
    margin-top:0;
  }
  .reward-list{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .reward-list li{
    background: var(--cell-empty);
    border-radius:8px;
    padding: 10px 12px;
    font-size: 14px;
    display:flex; justify-content:space-between;
    align-items:center;
  }
  .reward-list li .val{
    font-weight:700; color: var(--accent);
  }
  .reward-list .empty{
    opacity:.6; font-size:13px; text-align:center; padding:20px 0;
  }
  .scrim{
    position:fixed; inset:0;
    background: rgba(0,0,0,.5);
    display:none;
    z-index: 55;
  }
  .scrim.show{ display:block; }
  .close-menu{
    background:none;
    border:none;
    color: var(--text-light);
    font-size: 20px;
    position:absolute;
    top:14px; right:16px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="獎勵清單"><span></span><span></span><span></span></button>
    <h1>照片版 2048</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="scores">
        <div class="score-box"><div class="label">分數</div><div class="value" id="score">0</div></div>
        <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
      </div>
      <button class="menu-btn" id="leaderboardBtn" aria-label="排行榜" style="font-size:20px;">🏆</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn secondary" id="undoBtn">↩ 撤銷（剩 <span id="undoCount">1</span>）</button>
    <button class="btn" id="newGameBtn">新遊戲</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board-bg-grid" id="bgGrid"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
  </div>

  <div class="hint">方向鍵 / 滑動操作　．　合成數字解鎖獎勵</div>
</div>

<div class="scrim" id="scrim"></div>
<div class="side-menu" id="sideMenu">
  <button class="close-menu" id="closeMenu">✕</button>
  <h3>已獲得獎勵</h3>
  <ul class="reward-list" id="rewardList"></ul>
</div>

<div class="side-menu" id="leaderboardPanel">
  <button class="close-menu" id="closeLeaderboard">✕</button>
  <h3>🏆 排行榜</h3>
  <ol class="reward-list" id="leaderboardList" style="padding-left:0;"></ol>
</div>

<div class="overlay" id="overlay">
  <div class="photo-preview" id="overlayPhoto"></div>
  <h2>恭喜！</h2>
  <div class="reward-text" id="overlayReward">獲得：捶背一次</div>
  <button class="btn" id="continueBtn" style="max-width:200px;">繼續</button>
</div>

<div class="overlay" id="gameOverOverlay">
  <h2>遊戲結束</h2>
  <div class="reward-text" id="gameOverScore">分數：0</div>
  <button class="btn" id="recordScoreBtn" style="max-width:200px;">記錄成績</button>
</div>

<div class="overlay" id="nameEntryOverlay">
  <h2>輸入你的名字</h2>
  <input id="nameInput" type="text" maxlength="12" placeholder="你的名字"
    style="width:80%; max-width:280px; padding:14px 16px; font-size:18px; border-radius:10px; border:none; text-align:center; margin-bottom:22px; background:var(--cell-empty); color:var(--text-light);">
  <button class="btn" id="saveScoreBtn" style="max-width:200px;">儲存並重新開始</button>
  <button class="btn secondary" id="skipSaveBtn" style="max-width:200px; margin-top:12px;">不儲存，重新開始</button>
</div>

<script>
(function(){
  const SIZE = 4;
  const REWARDS = {
    8: "稱讚爸爸很帥 😎",
    16: "幫爸爸抓抓頭 😊",
    32: "幫爸爸倒一杯水 🥤",
    64: "幫爸爸捶背 5 分鐘 💆",
    128: "洗一次碗 🍽️",
    256: "倒一次垃圾 🗑️",
    512: "手作書籤 📖",
    1024: "手作杯墊 ☕",
    2048: "🎁 獲得神秘大禮",
    4096: "打開杯墊看看",
    8192: "書籤裡面有一張支票，你寫什麼，我就做什麼，想不到吧！"
  };

  let grid, score, best, undoLeft, prevState, sessionAchieved, loveShown;
  const boardWrap = document.getElementById('boardWrap');
  const bgGrid = document.getElementById('bgGrid');
  const tilesLayer = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const undoBtn = document.getElementById('undoBtn');
  const undoCountEl = document.getElementById('undoCount');
  const newGameBtn = document.getElementById('newGameBtn');
  const overlay = document.getElementById('overlay');
  const overlayReward = document.getElementById('overlayReward');
  const overlayPhoto = document.getElementById('overlayPhoto');
  const continueBtn = document.getElementById('continueBtn');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const gameOverScore = document.getElementById('gameOverScore');
  const recordScoreBtn = document.getElementById('recordScoreBtn');
  const nameEntryOverlay = document.getElementById('nameEntryOverlay');
  const nameInput = document.getElementById('nameInput');
  const saveScoreBtn = document.getElementById('saveScoreBtn');
  const skipSaveBtn = document.getElementById('skipSaveBtn');
  const menuBtn = document.getElementById('menuBtn');
  const closeMenu = document.getElementById('closeMenu');
  const sideMenu = document.getElementById('sideMenu');
  const scrim = document.getElementById('scrim');
  const rewardList = document.getElementById('rewardList');
  const leaderboardBtn = document.getElementById('leaderboardBtn');
  const closeLeaderboard = document.getElementById('closeLeaderboard');
  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const leaderboardList = document.getElementById('leaderboardList');

  for(let i=0;i<16;i++){
    const c = document.createElement('div');
    c.className='cell-bg';
    bgGrid.appendChild(c);
  }

  function loadBest(){
    return parseInt(localStorage.getItem('photo2048_best')||'0',10);
  }
  function saveBest(v){
    localStorage.setItem('photo2048_best', String(v));
  }

  function newGame(){
    grid = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score = 0;
    undoLeft = 1;
    prevState = null;
    sessionAchieved = [];
    loveShown = false;
    addRandomTile();
    addRandomTile();
    updateUndoUI();
    render();
    updateScore();
    renderRewardList();
  }

  function simulateMove(g, direction){
    let workGrid = cloneGrid(g);
    let rotations = {left:0, down:1, right:2, up:3}[direction];
    for(let i=0;i<rotations;i++) workGrid = rotateGridCW(workGrid);
    let totalGained = 0;
    let anyMoved = false;
    const newGrid = [];
    for(let r=0;r<SIZE;r++){
      const before = workGrid[r].slice();
      const {row, gained} = slideRowLeft(workGrid[r]);
      newGrid.push(row);
      totalGained += gained;
      if(!arraysEqual(before,row)) anyMoved = true;
    }
    let resultGrid = newGrid;
    let backRotations = (4 - rotations) % 4;
    for(let i=0;i<backRotations;i++) resultGrid = rotateGridCW(resultGrid);
    return { grid: resultGrid, gained: totalGained, anyMoved };
  }

  function countAdjacentPairs(g){
    let count = 0;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(g[r][c]===0) continue;
        if(c<SIZE-1 && g[r][c]===g[r][c+1]) count++;
        if(r<SIZE-1 && g[r][c]===g[r+1][c]) count++;
      }
    }
    return count;
  }

  function addRandomTile(){
    const empties=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empties.push([r,c]);
    if(empties.length===0) return;

    // 數字比例回到經典版：90% 是 2、10% 是 4
    const val = Math.random() < 0.9 ? 2 : 4;

    // 惡意加強（全盤評估版）：針對每個候選空格，模擬放進去之後，
    // 玩家「四個方向裡最好的一步」能拿到多少分、盤面上還剩多少組相鄰可合成的數字。
    // 分數越低（玩家能拿到的最大分數越少、盤面越亂），對玩家越不利，優先選這種格子。
    let candidates = [];
    for(const [r,c] of empties){
      const tempGrid = cloneGrid(grid);
      tempGrid[r][c] = val;

      let bestGain = 0;
      for(const dir of ['left','right','up','down']){
        const sim = simulateMove(tempGrid, dir);
        if(sim.anyMoved && sim.gained > bestGain) bestGain = sim.gained;
      }
      const pairs = countAdjacentPairs(tempGrid);
      candidates.push({ r, c, bestGain, pairs });
    }

    // 先比「玩家下一步最多能拿多少分」（越少越好，也就是對玩家越不利）
    // 分數相同時，再比「盤面上剩多少組可合成的相鄰數字」（越少越好）
    candidates.sort((a,b) => (a.bestGain - b.bestGain) || (a.pairs - b.pairs));
    const lowestGain = candidates[0].bestGain;
    const lowestPairs = candidates.filter(c => c.bestGain === lowestGain)[0].pairs;
    const tied = candidates.filter(c => c.bestGain === lowestGain && c.pairs === lowestPairs);
    const pick = tied[Math.floor(Math.random()*tied.length)];

    grid[pick.r][pick.c] = val;
  }

  function cloneGrid(g){ return g.map(row=>row.slice()); }

  function saveForUndo(){
    prevState = { grid: cloneGrid(grid), score };
  }

  function updateUndoUI(){
    undoCountEl.textContent = undoLeft;
    undoBtn.disabled = undoLeft<=0 || !prevState;
  }

  function updateScore(){
    scoreEl.textContent = score;
    best = Math.max(loadBest(), score);
    saveBest(best);
    bestEl.textContent = best;
  }

  // ---- movement logic ----
  function slideRowLeft(row){
    let arr = row.filter(v=>v!==0);
    let gained = 0;
    let merged = [];
    for(let i=0;i<arr.length-1;i++){
      if(arr[i] === arr[i+1]){
        arr[i]*=2;
        gained += arr[i];
        merged.push(arr[i]);
        arr.splice(i+1,1);
      }
    }
    while(arr.length<SIZE) arr.push(0);
    return {row:arr, gained, merged};
  }

  function rotateGridCW(g){
    const n=SIZE;
    const res = Array.from({length:n},()=>Array(n).fill(0));
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) res[c][n-1-r] = g[r][c];
    return res;
  }

  function move(direction){
    // direction: 'left','right','up','down'
    let workGrid = cloneGrid(grid);
    let rotations = {left:0, down:1, right:2, up:3}[direction];
    for(let i=0;i<rotations;i++) workGrid = rotateGridCW(workGrid);

    let totalGained = 0;
    let anyMoved = false;
    let mergedValues = [];
    const newGrid = [];
    for(let r=0;r<SIZE;r++){
      const before = workGrid[r].slice();
      const {row, gained, merged} = slideRowLeft(workGrid[r]);
      newGrid.push(row);
      totalGained += gained;
      mergedValues = mergedValues.concat(merged);
      if(!arraysEqual(before,row)) anyMoved = true;
    }
    let resultGrid = newGrid;
    // rotate back
    let backRotations = (4 - rotations) % 4;
    for(let i=0;i<backRotations;i++) resultGrid = rotateGridCW(resultGrid);

    if(!anyMoved){
      checkGameOver();
      return;
    }

    saveForUndo();
    grid = resultGrid;
    score += totalGained;
    addRandomTile();
    updateUndoUI();
    render();
    updateScore();
    checkMilestones(mergedValues);
    checkScoreMilestone();
    checkGameOver();
  }

  function arraysEqual(a,b){
    for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }

  function undo(){
    if(!prevState || undoLeft<=0) return;
    grid = cloneGrid(prevState.grid);
    score = prevState.score;
    prevState = null;
    undoLeft -= 1;
    updateUndoUI();
    render();
    updateScore();
    checkGameOver();
  }

  function isGameOver(){
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0) return false;
        if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return false;
        if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return false;
      }
    }
    return true;
  }

  // ---- 排行榜（本機儲存） ----
  const LEADERBOARD_KEY = 'photo2048_leaderboard';
  const LEADERBOARD_MAX = 10;

  function loadLeaderboard(){
    try{
      return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');
    }catch(e){ return []; }
  }
  function saveLeaderboardList(list){
    try{
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list));
    }catch(e){
      alert('排行榜儲存失敗，可能是瀏覽器的隱私/無痕模式限制了儲存功能。');
    }
  }
  function addLeaderboardEntry(name, sc){
    const list = loadLeaderboard();
    const finalName = name || '匿名';
    let finalScore = sc;
    if(finalName === '林宥辰') finalScore += 885201314;
    list.push({ name: finalName, score: finalScore, date: new Date().toLocaleDateString('zh-TW') });
    list.sort((a,b) => b.score - a.score);
    const trimmed = list.slice(0, LEADERBOARD_MAX);
    saveLeaderboardList(trimmed);
  }
  function renderLeaderboardList(){
    const list = loadLeaderboard();
    leaderboardList.innerHTML = '';
    if(list.length===0){
      const li = document.createElement('div');
      li.className = 'empty';
      li.textContent = '還沒有任何紀錄，快來挑戰第一名！';
      leaderboardList.appendChild(li);
      return;
    }
    list.forEach((entry, i)=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="val">#${i+1} ${entry.name}</span><span>${entry.score} 分（${entry.date}）</span>`;
      leaderboardList.appendChild(li);
    });
  }

  function checkGameOver(){
    // Only end the game if there's truly no way out — if the player still
    // has an undo available, let them use it instead of forcing game over.
    if(isGameOver() && undoLeft<=0){
      gameOverScore.textContent = '分數：' + score;
      gameOverOverlay.classList.add('show');
    }
  }

  const LAST_NAME_KEY = 'photo2048_lastname';
  let pendingNewGameAfterLeaderboard = false;

  recordScoreBtn.addEventListener('click', ()=>{
    gameOverOverlay.classList.remove('show');
    nameInput.value = localStorage.getItem(LAST_NAME_KEY) || '';
    nameEntryOverlay.classList.add('show');
    setTimeout(()=>{ nameInput.focus(); nameInput.select(); }, 50);
  });

  function finishSaveFlow(save){
    nameEntryOverlay.classList.remove('show');
    if(save){
      const name = nameInput.value.trim();
      addLeaderboardEntry(name, score);
      if(name) localStorage.setItem(LAST_NAME_KEY, name);
      // 存檔後直接打開排行榜，讓玩家馬上看到自己被記錄進去了
      pendingNewGameAfterLeaderboard = true;
      renderLeaderboardList();
      leaderboardPanel.classList.add('show');
      scrim.classList.add('show');
    } else {
      newGame();
    }
  }
  saveScoreBtn.addEventListener('click', ()=> finishSaveFlow(true));
  skipSaveBtn.addEventListener('click', ()=> finishSaveFlow(false));
  nameInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') finishSaveFlow(true);
  });

  // ---- milestone rewards ----
  let milestoneQueue = [];
  function checkMilestones(mergedValues){
    const uniqueVals = [...new Set(mergedValues)];
    uniqueVals.sort((a,b)=>a-b);
    for(const v of uniqueVals){
      // 8以上的每個數值都算一個成就，不管有沒有特別設定文字/照片
      if(v>=8 && sessionAchieved.indexOf(v) === -1){
        sessionAchieved.push(v);
        milestoneQueue.push(v);
      }
    }
    renderRewardList();
    if(milestoneQueue.length>0 && !overlay.classList.contains('show')){
      showNextMilestone();
    }
  }

  const SCORE_LOVE_THRESHOLD = 52088;
  function checkScoreMilestone(){
    if(score >= SCORE_LOVE_THRESHOLD && !loveShown){
      loveShown = true;
      milestoneQueue.push('LOVE');
      if(!overlay.classList.contains('show')){
        showNextMilestone();
      }
    }
  }

  function rewardTextFor(v){
    return REWARDS[v] || `🎉 達成 ${v} 成就！`;
  }

  function showNextMilestone(){
    if(milestoneQueue.length===0) return;
    const v = milestoneQueue.shift();
    if(v === 'LOVE'){
      overlayReward.textContent = "我愛你爸爸";
      overlayPhoto.className = 'photo-preview fallback';
      overlayPhoto.style.backgroundImage = '';
      overlay.classList.add('show');
      return;
    }
    overlayReward.textContent = "獲得：" + rewardTextFor(v);
    setTileBackground(overlayPhoto, v);
    overlay.classList.add('show');
  }

  continueBtn.addEventListener('click', ()=>{
    overlay.classList.remove('show');
    setTimeout(()=>{
      if(milestoneQueue.length>0) showNextMilestone();
    }, 150);
  });

  function renderRewardList(){
    rewardList.innerHTML='';
    if(sessionAchieved.length===0){
      const li = document.createElement('div');
      li.className='empty';
      li.textContent='這一局還沒有獲得任何獎勵，繼續玩下去吧！';
      rewardList.appendChild(li);
      return;
    }
    const sorted = sessionAchieved.slice().sort((a,b)=>a-b);
    for(const v of sorted){
      const li = document.createElement('li');
      li.innerHTML = `<span class="val">${v}</span><span>${rewardTextFor(v)}</span>`;
      rewardList.appendChild(li);
    }
  }

  // ---- image handling ----
  function setTileBackground(el, value){
    el.className = el.className.replace('fallback','').trim();
    const uri = PHOTOS[value];
    if(!uri){
      el.classList.add('fallback');
      el.style.backgroundImage = '';
    } else {
      el.style.backgroundImage = `url("${uri}")`;
    }
  }

  // ---- rendering ----
  function render(){
    tilesLayer.innerHTML='';
    const wrapRect = boardWrap.getBoundingClientRect();
    const innerSize = wrapRect.width - 20; // padding 10 each side
    const gap = 10;
    const cellSize = (innerSize - gap*(SIZE-1)) / SIZE;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const val = grid[r][c];
        if(val===0) continue;
        const tile = document.createElement('div');
        tile.className='tile pop';
        tile.style.width = cellSize+'px';
        tile.style.height = cellSize+'px';
        tile.style.left = (c*(cellSize+gap))+'px';
        tile.style.top = (r*(cellSize+gap))+'px';

        const photo = document.createElement('div');
        photo.className='photo-bg';
        setTileBackground(photo, val);
        tile.appendChild(photo);

        const num = document.createElement('div');
        num.className='num';
        num.textContent = val;
        if(cellSize < 70) num.style.fontSize = '18px';
        tile.appendChild(num);

        tilesLayer.appendChild(tile);
      }
    }
  }

  // ---- input handling ----
  document.addEventListener('keydown', (e)=>{
    if((overlay.classList.contains('show') || gameOverOverlay.classList.contains('show') || nameEntryOverlay.classList.contains('show'))) return;
    const map = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let touchStartX=0, touchStartY=0, touchActive=false;
  boardWrap.addEventListener('touchstart', (e)=>{
    if((overlay.classList.contains('show') || gameOverOverlay.classList.contains('show') || nameEntryOverlay.classList.contains('show'))) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchActive = true;
  }, {passive:true});

  boardWrap.addEventListener('touchend', (e)=>{
    if(!touchActive || (overlay.classList.contains('show') || gameOverOverlay.classList.contains('show') || nameEntryOverlay.classList.contains('show'))) return;
    touchActive = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if(Math.max(absX,absY) < threshold) return;
    if(absX > absY){
      move(dx>0 ? 'right' : 'left');
    } else {
      move(dy>0 ? 'down' : 'up');
    }
  }, {passive:true});

  undoBtn.addEventListener('click', undo);
  newGameBtn.addEventListener('click', ()=>{
    if(confirm('確定要開始新遊戲嗎？目前進度將會重置。')) newGame();
  });

  menuBtn.addEventListener('click', ()=>{
    sideMenu.classList.add('show');
    scrim.classList.add('show');
  });
  leaderboardBtn.addEventListener('click', ()=>{
    renderLeaderboardList();
    leaderboardPanel.classList.add('show');
    scrim.classList.add('show');
  });
  function closeMenuFn(){
    sideMenu.classList.remove('show');
    leaderboardPanel.classList.remove('show');
    scrim.classList.remove('show');
    if(pendingNewGameAfterLeaderboard){
      pendingNewGameAfterLeaderboard = false;
      newGame();
    }
  }
  closeMenu.addEventListener('click', closeMenuFn);
  closeLeaderboard.addEventListener('click', closeMenuFn);
  scrim.addEventListener('click', closeMenuFn);

  window.addEventListener('resize', render);

  // ---- init ----
  best = loadBest();
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
