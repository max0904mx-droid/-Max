<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>遊戲大廳</title>
<style>
  :root { --bg: #171b26; --panel: #252c3d; --text: #eef1f6; --muted: #98a3b8; --gold: #f6d365; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  body { overflow-x: hidden; -webkit-user-select: none; user-select: none; }
  #hub { min-height: 100%; padding: 22px 16px 40px; background:
      radial-gradient(900px 500px at 15% -10%, rgba(79, 140, 255, .18), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(246, 211, 101, .12), transparent 55%), var(--bg); }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 30px; margin: 6px 0 4px; letter-spacing: .12em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  button.snd { background: var(--panel); color: var(--text); border: 1px solid #44506a; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; touch-action: manipulation; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .card { position: relative; border-radius: 18px; padding: 18px 16px 16px; background: var(--panel); border: 2px solid transparent;
    cursor: pointer; overflow: hidden; touch-action: manipulation; transition: transform .15s ease, border-color .2s; }
  .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, var(--c1), var(--c2)); opacity: .22; }
  .card:active { transform: scale(.97); }
  .card.ready:hover { border-color: var(--c1); }
  .card .ico { position: relative; font-size: 46px; line-height: 1.1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .card .nm { position: relative; font-size: 22px; font-weight: 800; margin: 8px 0 2px; letter-spacing: .06em; }
  .card .ds { position: relative; font-size: 13px; color: #c8d0e2; line-height: 1.5; min-height: 40px; }
  .card .tag { position: relative; display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,.14); }
  .card.ready .tag { background: linear-gradient(135deg, #d4a017, var(--gold)); color: #2b1d00; }
  .card.soon { cursor: default; filter: saturate(.35); opacity: .75; }
  .card.soon:active { transform: none; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
  #stage { position: fixed; inset: 0; z-index: 100; background: #1f2430; display: none; }
  #stage.show { display: block; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1f2430; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(20,24,36,.95); border: 1px solid #44506a; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="hub">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>🎮 遊戲大廳</h1>
        <div class="sub">選一款遊戲開始玩</div>
      </div>
      <button class="snd" id="sndBtn" type="button">🔊 音效：開</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">進入遊戲後按「🏠 主選單」回到該遊戲的小選單，在小選單再按「回大主選單」就會回到這裡</div>
  </div>
</div>
<div id="stage"></div>
<div id="toast"></div>

Wrap { position: relative; width: var(--bs); height: var(--bs); }\n  #boardWrap.shake { animation: shake .55s ease; }\n  @keyframes shake {\n    0%, 100% { transform: translateX(0); }\n    15% { transform: translateX(-9px); } 30% { transform: translateX(9px); }\n    45% { transform: translateX(-7px); } 60% { transform: translateX(7px); }\n    75% { transform: translateX(-3px); } 90% { transform: translateX(3px); }\n  }\n  #board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 3px solid #3b2f22; border-radius: 4px; overflow: hidden; }\n  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }\n  .sq.l { background: var(--light); }\n  .sq.d { background: var(--dark); }\n  .sq.last::before { content: \"\"; position: absolute; inset: 0; background: var(--last); }\n  .sq.sel::before { content: \"\"; position: absolute; inset: 0; background: var(--sel); opacity: .75; }\n  .sq.chk::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(circle, var(--check) 20%, transparent 75%); animation: pulse 0.9s ease-in-out infinite; }\n  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }\n  .sq.hint::after { content: \"\"; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--move); }\n  .sq.hintcap::after { content: \"\"; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid var(--cap); background: transparent; }\n  .pc { position: relative; z-index: 2; font-size: calc(var(--bs) * 0.092); line-height: 1; pointer-events: none; }\n  .pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 0 1px 3px rgba(0,0,0,.6); }\n  .pc.b { color: #111; text-shadow: 0 0 1px rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.4); }\n  .pc.drop { animation: drop .22s ease-out; }\n  @keyframes drop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }\n  .coord { po ndex:70;background:var(--bg);display:none;flex-direction:column;align-items:center;gap:8px;padding:10px;overflow-y:auto}\n#rv.show{display:flex}\n#rv .wrap{width:min(96vw,calc(100vh - 400px));min-width:250px;order:0}\n#rvtop{width:min(96vw,560px);display:flex;align-items:center;justify-content:space-between;font-size:18px}\n#rvtop button,#rvctl button{font:inherit;font-size:16px;padding:9px 14px;border-radius:10px;border:2px solid #333;background:#111;color:var(--ink)}\n#rvsum{font-size:14px;color:var(--dim);text-align:center;min-height:20px}\n#rvinfo{width:min(96vw,560px);min-height:76px;font-size:15px;line-height:1.5;text-align:center}\n#rvinfo b{font-size:17px}\n#rvdots{width:min(96vw,560px);display:flex;flex-wrap:wrap;gap:4px;justify-content:center}\n#rvdots i{width:11px;height:11px;border-radius:50%;background:#333;display:block}\n#rvdots i.good{background:#4fb36a}#rvdots i.mistake{background:#e8923a}#rvdots i.blunder{background:#e0463c}#rvdots i.cur{outline:2px solid #fff;outline-offset:1px}\n#rvctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}\n.c.gh{outline:3px dashed #7fd1ff;outline-offset:-3px}\n.s.gs{background:repeating-linear-gradient(45deg,#7fd1ff 0 4px,transparent 4px 8px)}\n.s.w.lw{background:var(--lc)}\n.pawn.last{box-shadow:0 0 0 4px #fff}\n.tg{color:#4fb36a}.tm{color:#e8923a}.tb{color:#e0463c}\n#menu{overflow-y:auto}\n#mv4{width:min(92vw,360px)}#mv4 .list{max-height:62vh;overflow-y:auto;margin-bottom:12px}\n#mv4 .mb{display:flex;justify-content:space-between;align-items:center;width:100%;min-width:0;margin:5px 0;padding:14px 20px}\n#mv4 .mb span{font-weight:800}\n#mv4 .rw{color:#4fb36a}#mv4 .rl{color:#e0463c}#mv4 .rd{color:var(--dim)}\n.panel.undoable{opacity:.85}\n.panel .who{min-width:0;white-space:normal;font-size:15px}\n.panel button{padding:9px 10px;font-size:15px}\n.audio{display:flex;gap:10px;justify-content:center;margin-top:26px}\n.audio button{font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;border:2px solid #333;background:#111;color:var(--ink)}\n.audio button.off{color:var(--dim);border-color:#222}\n<\/style>\n<\/head>\n<body>\n<div class=\"panel top\" id=\"pn0\" style=\"--pc:var(--yellow)\">\n  <span class=\"who\"><i><\/i>黃（往下）<small id=\"tag0\"><\/small>隔板 <b id=\"w0\"><\/b><\/span>\n  <button data-p=\"0\" data-m=\"move\">走一步<\/button><button data-p=\"0\" data-m=\"wall\">放隔板<\/button><button data-p=\"0\" data-m=\"undo\">回覆<\/button>\n<\/div>\n<div class=\"row\"><div id=\"msg\"><\/div><button id=\"bmenu\">選單<\/button><button id=\"br\">重新開始<\/button><\/div>\n<div class=\"wrap\"><div id=\"board\"><\/div><\/div>\n<div class=\"panel\" id=\"pn1\" style=\"--pc:var(--green)\">\n  <span class=\"who\"><i><\/i>綠（往上）<small id=\"tag1\"><\/small>隔板 <b id=\"w1\"><\/b><\/span>\n  <button data-p=\"1\" data-m=\"move\">走一步<\/button><button data-p=\"1\" data-m=\"wall\">放隔板<\/button><button data-p=\"1\" data-m=\"undo\">回覆<\/button>\n<\/div>\n<div id=\"intro\"><\/div>\n<div id=\"win\"><div id=\"wball\"><\/div><div id=\"wtext\"><\/div><button id=\"again\">再玩一次<\/button><button id=\"rvbtn\">複盤<\/button><button id=\"tomenu\">回選單<\/button><\/div>\n<div id=\"rv\"><div id=\"rvtop\"><b>複盤<\/b><button id=\"rvclose\">關閉<\/button><\/div><div id=\"rvsum\"><\/div><div class=\"wrap\"><div id=\"rboard\"><\/div><\/div><div id=\"rvinfo\"><\/div><div id=\"rvdots\"><\/div><div id=\"rvctl\"><button data-a=\"first\">⏮<\/button><button data-a=\"prev\">◀<\/button><button data-a=\"next\">▶<\/button><button data-a=\"last\">⏭<\/button><button data-a=\"play\">自動播放<\/button><button data-a=\"bad\">下一個失誤<\/button><\/div><\/div>\n<div id=\"dice\"><div id=\"dtitle\"><\/div><div id=\"dhint\"><\/div><div id=\"die\"><\/div><div id=\"dres\"><\/div><\/div>\n<div id=\"menu\"><h1>隔板競速<\/h1><div id=\"mv1\"><button class=\"mb\" data-go=\"pvp\">雙人對戰<small>同一台 iPad 面對面<\/small><\/button><br><br><button class=\"mb\" data-go=\"ai\">人機對戰<small>挑戰電腦<\/small><\/button><br><br><button class=\"mb\" data-go=\"stats\">戰績<small>勝敗、連勝、最少步數<\/small><\/button><br><br><button class=\"mb\" data-go=\"games\">複盤<small>重看最近 10 局<\/small><\/button><div class=\"audio\"><button id=\"asfx\"><\/button><button id=\"amus\"><\/button><\/div><button class=\"mb back\" id=\"mhome\" style=\"display:none;margin-top:18px\">🌐 回大主選單<\/button><\/div><div id=\"mv3\" style=\"display:none\"><\/div><div id=\"mv4\" style=\"display:none\"><\/div><div id=\"mv2\" style=\"display:none\"><button class=\"mb\" data-lv=\"easy\">簡單<small>電腦多半亂走<\/small><\/button><button class=\"mb\" data-lv=\"medium\">中等<small>走最短路，會擋你<\/small><\/button><button class=\"mb\" data-lv=\"hard\">困難<small>會預想對手的回應<\/small><\/button><button class=\"mb\" data-lv=\"demon\">惡魔<small>看得最深，很難贏<\/small><\/button><button class=\"mb back\" data-go=\"back\">返回<\/button><\/div><\/div>\n<script>\nconst N=9, NAME=['黃','綠'], COL=['var(--yellow)','var(--green)'];\nlet st;\nlet cfg={mode:'pvp',level:'easy'};\nconst LV={easy:'簡單',medium:'中等',hard:'困難',demon:'惡魔'};\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nfunction newState(){\n  const x={p:[{r:0,c:4,w:10,goal:8},{r:8,c:4,w:10,goal:0}],turn:0,mode:'move',H:new Set(),V:new Set(),over:false,draw:false,warn:false,seen:{},note:'',shown:false,count:[0,0],hist:[],undo:[1,1],tok:0,locked:true,ai:null,thinking:false};\n  return x;\n}\nfunction resetOverlays(){\n  document.getElementById('win').classList.remove('show','in');\n  document.getElementById('dice').classList.remove('show');\n  document.getElementById('intro').className='out';\n}\nfunction showMenu(){\n  st=newState();resetOverlays();\n  view(1);\n  document.getElementById('menu').classList.add('show');\n  render();\n}\nfunction init(){startMatch(null);}\nfunction startMatch(c){\n  if(c)cfg=c;\n  st=newState();st.seen[posKey()]=1;\n  resetOverlays();\n  document.getElementById('menu').classList.remove('show');\n  render();\n  sequence(st);\n}\nconst FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};\nfunction face(v){\n  const d=document.getElementById('die');d.innerHTML='';\n  for(let i=0;i<9;i++){const x=document.createElement('span');if(FACES[v].includes(i))x.className='on';d.appendChild(x);}\n}\nasync function rollDie(title,hint,res){\n  const dice=document.getElementById('dice'),die=document.getElementById('die');\n  document.getElementById('dtitle').textContent=title;\n  document.getElementById('dhint').textContent=hint;\n  document.getElementById('dres').textContent='';\n  dice.classList.add('show');die.classList.add('rolling');\n  const iv=setInterval(()=>{face(1+((Math.random()*6)|0));sfx('dice');},80);\n  await wait(1100);\n  clearInterval(iv);die.classList.remove('rolling');\n  const v=1+((Math.random()*6)|0);face(v);sfx('diceEnd');\n  document.getElementById('dres').textContent=res(v);\n  await wait(1300);\n  return v;\n}\nasync function sequence(S){\n  if(cfg.mode==='ai'){\n    const v=await rollDie('擲骰決定你的顏色','單數：你執黃方　雙數：你執綠方',v=>v%2?'你執黃方':'你執綠方');\n    if(S!==st)return;\n    S.ai={side:v%2?1:0,level:cfg.level};\n    render();\n  }\n  const f=await rollDie('擲骰決定先手','單數：黃方先　雙數：綠方先',v=>(v%2?'黃':'綠')+'方先手');\n  if(S!==st)return;\n  S.turn=f%2?0:1;\n  document.getElementById('dice').classList.remove('show');\n  showIntro();\n  await wait(2500);\n  if(S!==st)return;\n  S.locked=false;\n  render();\n}\nfunction canStep(r,c,dr,dc,H,V){\n  const nr=r+dr,nc=c+dc;\n  if(nr<0||nr>=N||nc<0||nc>=N)return false;\n  if(dr===1)return !H.has(r+','+c);\n  if(dr===-1)return !H.has((r-1)+','+c);\n  if(dc===1)return !V.has(r+','+c);\n  return !V.has(r+','+(c-1));\n}\nconst D=[[1,0],[-1,0],[0,1],[0,-1]];\nfunction hasPath(p,H,V){\n  const seen=new Set([p.r+','+p.c]),q=[[p.r,p.c]];\n  while(q.length){\n    const [r,c]=q.shift();\n    if(r===p.goal)return true;\n    for(const [dr,dc] of D){\n      if(!canStep(r,c,dr,dc,H,V))continue;\n      const k=(r+dr)+','+(c+dc);\n      if(!seen.has(k)){seen.add(k);q.push([r+dr,c+dc]);}\n    }\n  }\n  return false;\n}\nfunction wallOK(type,r,c){\n  const own=type==='H'?st.H:st.V;\n  if(own.has(r+','+c))return false;\n  const H=new Set(st.H),V=new Set(st.V);\n  (type==='H'?H:V).add(r+','+c);\n  if(!st.p.every(p=>hasPath(p,H,V)))return false;\n  // 不能把任何一方困到沒有棋子可以走（對方的球也算擋住）\n  return rawMoves(st.p[0],st.p[1],H,V).length>0&&rawMoves(st.p[1],st.p[0],H,V).length>0;\n}\nfunction rawMoves(me,op,H,V){\n  const out=[];\n  for(const [dr,dc] of D){\n    if(canStep(me.r,me.c,dr,dc,H,V)&&!(op.r===me.r+dr&&op.c===me.c+dc))out.push([me.r+dr,me.c+dc]);\n  }\n  return out;\n}\n// 走過去之後，如果會讓對方沒有任何一步可走，這一步就不能走\nfunction movesFor(i){return genMoves(st,i);}\nfunction moves(){return movesFor(st.turn);}\nfunction canAct(i){\n  if(movesFor(i).length>0)return true;\n  if(st.p[i].w<=0)return false;\n  return !!anyWall();\n}\nfunction anyWall(){\n  for(let r=0;r<N-1;r++)for(let c=0;c<N;c++)if(wallOK('H',r,c))return{t:'w',type:'H',r,c};\n  for(let r=0;r<N;r++)for(let c=0;c<N-1;c++)if(wallOK('V',r,c))return{t:'w',type:'V',r,c};\n  return null;\n}\n// 每次行動（走一步或放隔板）結束後都呼叫：檢查勝負，否則換人\nfunction posKey(){return st.p.map(p=>p.r+','+p.c).join('|');}\nfunction endTurn(action,moved){\n  st.count[st.turn]++;\n  sfx(moved?'move':'wall',st.turn);\n  const me=st.p[st.turn];\n  if(me.r===me.goal){st.over=true;st.note=NAME[st.turn]+'方獲勝！';return;}\n  st.warn=false;\n  if(moved){\n    const k=posKey(),n=(st.seen[k]||0)+1;\n    st.seen[k]=n;\n    if(n>=5){st.over=true;st.draw=true;st.note='平局！相同位置重複了 5 次';return;}\n    if(n===4){st.warn=true;setTimeout(()=>sfx('warn'),170);}\n  }\n  const prev=st.turn;\n  st.turn=1-st.turn;\n  st.mode='move';\n  st.note=NAME[prev]+'方'+action+'，輪到'+NAME[st.turn]+'方'+(st.warn?'（相同位置第 4 次，再重複一次就平局！）':'');\n  if(!canAct(st.turn)){\n    const stuck=st.turn;\n    st.turn=1-st.turn;\n    if(!canAct(st.turn)){st.over=true;st.draw=true;st.note='平局！雙方都無法行動';return;}\n    st.note=NAME[stuck]+'方無路可走，跳過回合，仍是'+NAME[st.turn]+'方';\n  }\n}\nfunction render(){\n  const b=document.getElementById('board');\n  const hum=!st.locked&&!(st.ai&&st.ai.side===st.turn);\n  const wallMode=hum&&!st.over&&st.mode==='wall'&&st.p[st.turn].w>0;\n  b.className=wallMode?'wall':'';\n  b.innerHTML='';\n  const mv=(hum&&!st.over&&st.mode==='move')?moves():[];\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n    const d=document.createElement('div');\n    d.className='c';d.style.gridRow=2*r+1;d.style.gridColumn=2*c+1;\n    if(mv.some(m=>m[0]===r&&m[1]===c)){\n      d.classList.add('ok');\n      d.onclick=()=>{st.hist.push({side:st.turn,t:'m',r,c});st.p[st.turn].r=r;st.p[st.turn].c=c;endTurn('走了一步',true);render();};\n    }\n    st.p.forEach((p,i)=>{if(p.r===r&&p.c===c){const x=document.createElement('div');x.className='pawn';x.dataset.i=i;x.style.background=COL[i];d.appendChild(x);}});\n    b.appendChild(d);\n  }\n  const addSlot=(type,r,c)=>{\n    const s=document.createElement('div');\n    s.className='s';\n    if(type==='H'){s.style.gridRow=2*r+2;s.style.gridColumn=2*c+1;}\n    else{s.style.gridRow=2*r+1;s.style.gridColumn=2*c+2;}\n    if((type==='H'?st.H:st.V).has(r+','+c))s.classList.add('w');\n    else if(wallMode&&wallOK(type,r,c)){\n      s.classList.add('ok');\n      s.onclick=()=>{\n        st.hist.push({side:st.turn,t:'w',type,r,c});\n        (type==='H'?st.H:st.V).add(r+','+c);\n        st.p[st.turn].w--;\n        endTurn('放了隔板');\n        render();\n      };\n    }\n    b.appendChild(s);\n  };\n  for(let r=0;r<N-1;r++)for(let c=0;c<N;c++)addSlot('H',r,c);\n  for(let r=0;r<N;r++)for(let c=0;c<N-1;c++)addSlot('V',r,c);\n  for(let i=0;i<2;i++){\n    document.getElementById('w'+i).textContent=st.p[i].w;\n    const active=st.turn===i&&!st.over;\n    const pe=document.getElementById('pn'+i);\n    pe.className='panel'+(i===0&&!st.ai?' top':'')+(active?' on':'')+(canUndo(i)?' undoable':'');\n    pe.style.order=(st.ai?(st.ai.side===i?0:3):(i===0?0:3));\n    document.getElementById('tag'+i).textContent=st.ai?(st.ai.side===i?'（電腦·'+LV[st.ai.level]+'）':'（你）'):'';\n    document.querySelectorAll('button[data-p=\"'+i+'\"]').forEach(btn=>{\n      const m=btn.dataset.m;\n      if(m==='undo'){\n        btn.style.display=(st.ai&&st.ai.side===i)?'none':'';\n        btn.textContent='回覆（'+st.undo[i]+'）';\n        btn.disabled=!canUndo(i);btn.className='';\n        return;\n      }\n      btn.disabled=!active||!hum||(m==='wall'&&st.p[i].w===0);\n      btn.className=(active&&hum&&st.mode===m)?'sel':'';\n    });\n  }\n  let t=st.note;\n  if(st.locked&&!st.over)t='準備開戰…';\n  else if(!st.over&&!hum)t='電腦思考中…';\n  else if(!st.over){\n    const hint=st.mode==='move'?'點亮點移動':'點格子之間的縫隙放隔板';\n    t=(t?t+'：':'輪到'+NAME[st.turn]+'方：')+hint;\n  }\n  const me=document.getElementById('msg');\n  me.textContent=t;me.style.color=st.warn?'#ffb14a':'';\n  if(st.over&&!st.shown){st.shown=true;recordResult();showWin(st.draw?'draw':st.turn);}\n  maybeAI();\n}\nfunction showIntro(){\n  const el=document.getElementById('intro');\n  el.className='';\n  el.innerHTML='<div class=\"ib y\"><\/div><div class=\"ib g\"><\/div><div class=\"boom\"><\/div><div class=\"fight\">開戰！<\/div>';\n  sfx('charge');setTimeout(()=>sfx('boom'),900);setTimeout(()=>sfx('fight'),1000);\n  clearTimeout(showIntro.t);\n  showIntro.t=setTimeout(()=>el.classList.add('out'),2400);\n}\nfunction showWin(i){\n  const w=document.getElementById('win'),ball=document.getElementById('wball');\n  const draw=i==='draw';\n  setTimeout(()=>sfx(draw?'draw':(st.ai&&i===st.ai.side?'lose':'win')),350);\n  w.style.setProperty('--wc',draw?'#e6e6e6':COL[i]);\n  ball.style.background=draw?'linear-gradient(90deg,var(--yellow) 50%,var(--green) 50%)':'';\n  document.getElementById('wtext').textContent=draw?'平局！':(st.ai?(i===st.ai.side?'電腦獲勝！':'你獲勝！'):NAME[i]+'方獲勝！');\n  w.classList.add('show');\n  void w.offsetWidth;\n  w.classList.add('in');\n  const pawn=draw?null:document.querySelector('.pawn[data-i=\"'+i+'\"]');\n  if(pawn&&ball.animate){\n    const a=pawn.getBoundingClientRect(),b=ball.getBoundingClientRect();\n    const dx=a.left+a.width/2-(b.left+b.width/2),dy=a.top+a.height/2-(b.top+b.height/2);\n    ball.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+a.width/b.width+')'},{transform:'translate(0,0) scale(1)'}],\n      {duration:900,easing:'cubic-bezier(.2,.9,.3,1.2)'});\n  }else if(draw&&ball.animate){\n    ball.animate([{transform:'scale(.2) rotate(-180deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1}],{duration:800,easing:'cubic-bezier(.2,.9,.3,1.2)'});\n  }\n}\n\n\n// ================= 戰績（存在這台裝置的瀏覽器）=================\nconst SKEY='wallrace.stats.v1';\nfunction loadStats(){\n  let d=null;\n  try{d=JSON.parse(localStorage.getItem(SKEY));}catch(e){}\n  d=d||{};\n  d.ai=d.ai||{};\n  for(const k of Object.keys(LV))d.ai[k]=Object.assign({w:0,l:0,d:0,cur:0,best:0,min:null},d.ai[k]);\n  d.pvp=Object.assign({y:0,g:0,d:0,min:null},d.pvp);\n  return d;\n}\nfunction saveStats(d){try{localStorage.setItem(SKEY,JSON.stringify(d));}catch(e){}}\nfunction recordResult(){\n  const d=loadStats(),winner=st.turn,n=st.count[winner];\n  if(cfg.mode==='ai'&&st.ai){\n    const e=d.ai[st.ai.level],human=1-st.ai.side;\n    if(st.draw)e.d++;\n    else if(winner===human){e.w++;e.cur++;e.best=Math.max(e.best,e.cur);e.min=e.min===null?n:Math.min(e.min,n);}\n    else{e.l++;e.cur=0;}\n  }else{\n    const e=d.pvp;\n    if(st.draw)e.d++;\n    else{if(winner===0)e.y++;else e.g++;e.min=e.min===null?n:Math.min(e.min,n);}\n  }\n  saveStats(d);\n  saveGame();\n}\nconst GKEY='wallrace.games.v1',GMAX=10;\nfunction loadGames(){try{const g=JSON.parse(localStorage.getItem(GKEY));return Array.isArray(g)?g:[];}catch(e){return[];}}\nfunction saveGame(){\n  if(!st.hist.length)return;\n  const g=loadGames();\n  g.unshift({ts:Date.now(),mode:cfg.mode==='ai'&&st.ai?'ai':'pvp',level:st.ai?st.ai.level:null,aiSide:st.ai?st.ai.side:null,winner:st.turn,draw:!!st.draw,hist:st.hist});\n  try{localStorage.setItem(GKEY,JSON.stringify(g.slice(0,GMAX)));}catch(e){}\n}\nfunction buildGames(){\n  const g=loadGames(),v=document.getElementById('mv4');\n  let h='<h2 style=\"font-size:20px;margin:0 0 12px\">複盤<\/h2><div class=\"list\">';\n  if(!g.length)h+='<div style=\"color:var(--dim);padding:20px\">還沒有紀錄，下完一局就會出現在這裡<\/div>';\n  g.forEach((x,i)=>{\n    const d=new Date(x.ts);\n    let t,c;\n    if(x.draw){t=x.mode==='ai'?'平':'平局';c='rd';}\n    else if(x.mode==='ai'){const win=x.winner===1-x.aiSide;t=win?'勝':'負';c=win?'rw':'rl';}\n    else{t=x.winner===0?'黃勝':'綠勝';c='rd';}\n    h+='<button class=\"mb\" data-i=\"'+i+'\">'+(d.getMonth()+1)+'月'+d.getDate()+'日<span class=\"'+c+'\">'+t+'<\/span><\/button>';\n  });\n  h+='<\/div><button class=\"mb back\" data-go=\"back\">返回<\/button>';\n  v.innerHTML=h;\n  v.querySelectorAll('button').forEach(b=>{\n    b.onclick=()=>{\n      if(b.dataset.go==='back'){view(1);return;}\n      const x=g[+b.dataset.i];\n      openReview({hist:x.hist,ai:x.mode==='ai'?{side:x.aiSide,level:x.level}:null});\n    };\n  });\n}\nfunction view(n){\n  for(let i=1;i<=4;i++)document.getElementById('mv'+i).style.display=i===n?'':'none';\n}\nfunction buildStats(){\n  const d=loadStats(),f=v=>v===null?'－':v;\n  let h='<h2>人機對戰<\/h2><table><tr><th>難度<\/th><th>勝<\/th><th>敗<\/th><th>平<\/th><th>連勝 最高（目前）<\/th><th>最少步數獲勝<\/th><\/tr>';\n  for(const k of Object.keys(LV)){const e=d.ai[k];h+='<tr><td>'+LV[k]+'<\/td><td>'+e.w+'<\/td><td>'+e.l+'<\/td><td>'+e.d+'<\/td><td>'+e.best+'（'+e.cur+'）<\/td><td>'+f(e.min)+'<\/td><\/tr>';}\n  h+='<\/table><h2>雙人對戰<\/h2><table><tr><th>黃勝<\/th><th>綠勝<\/th><th>平局<\/th><th>最少步數獲勝<\/th><\/tr><tr><td>'+d.pvp.y+'<\/td><td>'+d.pvp.g+'<\/td><td>'+d.pvp.d+'<\/td><td>'+f(d.pvp.min)+'<\/td><\/tr><\/table>';\n  h+='<div style=\"font-size:13px;color:var(--dim);margin-bottom:12px\">步數＝獲勝那一方走的回合數（走一步或放隔板都算一回合）<br>平局不會中斷連勝；戰績只存在這台裝置的瀏覽器<\/div>';\n  h+='<button class=\"mb back\" data-go=\"back\">返回<\/button>';\n  const v=document.getElementById('mv3');v.innerHTML=h;\n  v.querySelectorAll('button').forEach(b=>{b.onclick=()=>view(1);});\n}\n\n\n// ================= 回覆（悔棋）=================\nfunction canUndo(i){\n  if(st.over||st.locked||!st.hist.length||st.undo[i]<=0)return false;\n  if(st.ai){return st.ai.side!==i&&st.hist.some(a=>a.side===i);}\n  return st.hist[st.hist.length-1].side===i;\n}\nfunction doUndo(i){\n  if(!canUndo(i))return;\n  const h=st.hist;\n  if(st.ai){while(h.length&&h[h.length-1].side!==i)h.pop();h.pop();}\n  else h.pop();\n  st.undo[i]--;\n  const S=replayState(h,h.length);\n  for(let k=0;k<2;k++){st.p[k].r=S.p[k].r;st.p[k].c=S.p[k].c;st.p[k].w=S.p[k].w;}\n  st.H=S.H;st.V=S.V;\n  const P=[{r:0,c:4},{r:8,c:4}],key=()=>P.map(p=>p.r+','+p.c).join('|');\n  st.seen={};st.seen[key()]=1;st.count=[0,0];\n  h.forEach(a=>{st.count[a.side]++;if(a.t==='m'){P[a.side].r=a.r;P[a.side].c=a.c;st.seen[key()]=(st.seen[key()]||0)+1;}});\n  st.turn=i;st.mode='move';st.warn=false;st.thinking=false;st.tok++;\n  st.note=(st.ai?'你':NAME[i]+'方')+'使用了回覆';\n  sfx('undo');\n  render();\n}\n// ================= 複盤 =================\nlet RV=null;\nconst AD=4,AK=8;\nfunction replayState(hist,k){\n  const S={p:[{r:0,c:4,w:10,goal:8},{r:8,c:4,w:10,goal:0}],H:new Set(),V:new Set()};\n  for(let i=0;i<k;i++){\n    const a=hist[i],me=S.p[a.side];\n    if(a.t==='m'){me.r=a.r;me.c=a.c;}\n    else{(a.type==='H'?S.H:S.V).add(a.r+','+a.c);me.w--;}\n  }\n  return S;\n}\nconst sameAct=(x,a)=>x.t===a.t&&x.r===a.r&&x.c===a.c&&(x.type||'')===(a.type||'');\nfunction analyzePly(hist,i){\n  const S=replayState(hist,i),a=hist[i],side=a.side,me=S.p[side];\n  const list=genActions(S,side,AK);\n  if(!list.some(x=>sameAct(x,a)))list.push(a);\n  const vals=list.map(x=>{\n    const undo=applyAct(S,side,x);\n    const v=(x.t==='m'&&me.r===me.goal)?1000:-search(S,1-side,AD-1,-Infinity,Infinity,AK);\n    undo();return v;\n  });\n  let bi=0;vals.forEach((v,j)=>{if(v>vals[bi])bi=j;});\n  const pi=list.findIndex(x=>sameAct(x,a)),vb=vals[bi],vp=vals[pi];\n  let second=-Infinity;vals.forEach((v,j)=>{if(j!==bi&&v>second)second=v;});\n  let loss=vb-vp;if(vb>=900&&vp>=900)loss=0;\n  let label='ok';\n  if(loss>=4)label='blunder';else if(loss>=2)label='mistake';\n  else if(loss<=0.2&&(vp>=900||second<=vb-2))label='good';\n  return {label,loss,vb,vp,best:sameAct(list[bi],a)?null:list[bi]};\n}\nfunction describe(S,a){\n  if(a.t==='m'){\n    const me=S.p[a.side!==undefined?a.side:0];\n    return a.r>me.r?'往下走一步':a.r<me.r?'往上走一步':a.c>me.c?'往右走一步':'往左走一步';\n  }\n  return a.type==='H'?'在第'+(a.c+1)+'欄、第'+(a.r+1)+'與'+(a.r+2)+'列之間放隔板'\n                     :'在第'+(a.r+1)+'列、第'+(a.c+1)+'與'+(a.c+2)+'欄之間放隔板';\n}\nfunction whoR(side){\n  const c=side===0?'黃':'綠';\n  if(RV.ai)return (side===RV.ai.side?'電腦':'你')+'（'+c+'）';\n  return c+'方';\n}\nfunction openReview(src){\n  src=src||{hist:st.hist,ai:st.ai};\n  if(!src.hist.length)return;\n  RV={hist:src.hist.slice(),ai:src.ai,k:0,res:new Array(st.hist.length).fill(null),done:0,timer:null,gen:{}};\n  const me=RV;\n  document.getElementById('rv').classList.add('show');\n  document.getElementById('rvsum').textContent='電腦分析中… 0/'+me.hist.length;\n  drawReview();\n  const step=()=>{\n    if(RV!==me)return;\n    if(me.done>=me.hist.length){summarize();drawReview();return;}\n    me.res[me.done]=analyzePly(me.hist,me.done);me.done++;\n    document.getElementById('rvsum').textContent='電腦分析中… '+me.done+'/'+me.hist.length;\n    if(me.done%4===0)drawReview();\n    setTimeout(step,0);\n  };\n  setTimeout(step,30);\n}\nfunction summarize(){\n  const cnt=[{good:0,mistake:0,blunder:0},{good:0,mistake:0,blunder:0}];\n  RV.res.forEach((r,i)=>{if(r&&cnt[RV.hist[i].side][r.label]!==undefined)cnt[RV.hist[i].side][r.label]++;});\n  document.getElementById('rvsum').textContent=[0,1].map(i=>whoR(i)+'：好棋 '+cnt[i].good+'、失誤 '+cnt[i].mistake+'、大失誤 '+cnt[i].blunder).join('　');\n}\nconst LBL={good:['好棋','tg'],mistake:['失誤','tm'],blunder:['大失誤','tb'],ok:['普通','']};\nfunction drawReview(){\n  const k=RV.k,S=replayState(RV.hist,k),a=k>0?RV.hist[k-1]:null,r=k>0?RV.res[k-1]:null;\n  const before=k>0?replayState(RV.hist,k-1):null;\n  const ghost=r&&r.best?Object.assign({side:a.side},r.best):null;\n  const b=document.getElementById('rboard');b.innerHTML='';\n  for(let y=0;y<N;y++)for(let x=0;x<N;x++){\n    const d=document.createElement('div');d.className='c';d.style.gridRow=2*y+1;d.style.gridColumn=2*x+1;\n    if(ghost&&ghost.t==='m'&&ghost.r===y&&ghost.c===x)d.classList.add('gh');\n    S.p.forEach((p,i)=>{if(p.r===y&&p.c===x){const e=document.createElement('div');e.className='pawn'+(a&&a.t==='m'&&a.side===i?' last':'');e.style.background=COL[i];d.appendChild(e);}});\n    b.appendChild(d);\n  }\n  const slot=(type,y,x)=>{\n    const e=document.createElement('div');e.className='s';\n    if(type==='H'){e.style.gridRow=2*y+2;e.style.gridColumn=2*x+1;}else{e.style.gridRow=2*y+1;e.style.gridColumn=2*x+2;}\n    if((type==='H'?S.H:S.V).has(y+','+x)){\n      e.classList.add('w');\n      if(a&&a.t==='w'&&a.type===type&&a.r===y&&a.c===x){e.classList.add('lw');e.style.setProperty('--lc',COL[a.side]);}\n    }\n    if(ghost&&ghost.t==='w'&&ghost.type===type&&ghost.r===y&&ghost.c===x)e.classList.add('gs');\n    b.appendChild(e);\n  };\n  for(let y=0;y<N-1;y++)for(let x=0;x<N;x++)slot('H',y,x);\n  for(let y=0;y<N;y++)for(let x=0;x<N-1;x++)slot('V',y,x);\n  // info\n  let h;\n  if(k===0)h='<b>開局<\/b><br>用下方按鈕一步一步看這一局';\n  else{\n    h='<b>第 '+k+' 手　'+whoR(a.side)+'<\/b>　'+(a.t==='m'?'走了一步':'放了隔板')+(k===RV.hist.length?'　（最後一手）':'');\n    if(r){\n      const l=LBL[r.label];\n      h+='<br><span class=\"'+l[1]+'\"><b>'+l[0]+'<\/b><\/span>';\n      if(r.best){\n        const why=(r.vb>=900&&r.vp<900)?'錯過了致勝的走法':(r.vp<=-900?'走了這步之後，電腦預測對手可以強制獲勝':'約讓出 '+r.loss.toFixed(1)+' 步優勢');\n        h+='　'+why+'<br>電腦建議：'+describe(before,Object.assign({side:a.side},r.best))+'（虛線）';\n      }\n    }else h+='<br>分析中…';\n  }\n  document.getElementById('rvinfo').innerHTML=h;\n  const dots=document.getElementById('rvdots');dots.innerHTML='';\n  RV.hist.forEach((_,i)=>{\n    const e=document.createElement('i'),rr=RV.res[i];\n    e.className=(rr&&rr.label!=='ok'?rr.label:'')+(i+1===k?' cur':'');\n    e.onclick=()=>{RV.k=i+1;reviewSound();drawReview();};\n    dots.appendChild(e);\n  });\n}\nfunction reviewSound(){\n  const r=RV&&RV.k>0?RV.res[RV.k-1]:null;\n  if(!r)return;\n  if(r.label==='good')sfx('good');else if(r.label==='mistake'||r.label==='blunder')sfx('bad');\n}\nfunction reviewStop(){\n  if(RV&&RV.timer){clearInterval(RV.timer);RV.timer=null;}\n  const pb=document.querySelector('#rvctl button[data-a=\"play\"]');if(pb)pb.textContent='自動播放';\n}\nfunction reviewAct(act){\n  if(!RV)return;\n  const n=RV.hist.length;\n  if(act==='first'){reviewStop();RV.k=0;}\n  else if(act==='prev'){reviewStop();RV.k=Math.max(0,RV.k-1);}\n  else if(act==='next'){reviewStop();RV.k=Math.min(n,RV.k+1);}\n  else if(act==='last'){reviewStop();RV.k=n;}\n  else if(act==='bad'){\n    reviewStop();\n    const isBad=i=>RV.res[i]&&(RV.res[i].label==='mistake'||RV.res[i].label==='blunder');\n    let j=-1;\n    for(let i=RV.k;i<n;i++)if(isBad(i)){j=i;break;}\n    if(j<0)for(let i=0;i<RV.k;i++)if(isBad(i)){j=i;break;}\n    if(j<0){document.getElementById('rvinfo').innerHTML=RV.done<n?'分析還沒完成，稍等一下':'<b>沒有失誤<\/b><br>這一局雙方都沒有明顯的失誤';return;}\n    RV.k=j+1;\n  }else if(act==='play'){\n    if(RV.timer){reviewStop();return;}\n    if(RV.k>=n)RV.k=0;\n    document.querySelector('#rvctl button[data-a=\"play\"]').textContent='暫停';\n    RV.timer=setInterval(()=>{if(RV.k>=n){reviewStop();return;}RV.k++;reviewSound();drawReview();},1000);\n  }\n  if(act!=='play')reviewSound();\n  drawReview();\n}\ndocument.querySelectorAll('#rvctl button').forEach(b=>{b.onclick=()=>reviewAct(b.dataset.a);});\ndocument.getElementById('rvclose').onclick=()=>{reviewStop();RV=null;document.getElementById('rv').classList.remove('show');};\ndocument.getElementById('rvbtn').onclick=()=>openReview();\n// ================= 電腦對手 =================\nfunction dist(p,H,V){\n  const seen=new Uint8Array(81);let lvl=[p.r*9+p.c],d=0;seen[lvl[0]]=1;\n  while(lvl.length){\n    const nx=[];\n    for(const k of lvl){\n      const r=(k/9)|0,c=k%9;\n      if(r===p.goal)return d;\n      for(const [dr,dc] of D){\n        if(!canStep(r,c,dr,dc,H,V))continue;\n        const n=(r+dr)*9+c+dc;\n        if(!seen[n]){seen[n]=1;nx.push(n);}\n      }\n    }\n    lvl=nx;d++;\n  }\n  return Infinity;\n}\nfunction pathEdges(p,H,V){\n  const par=new Int16Array(81).fill(-2),start=p.r*9+p.c;par[start]=-1;\n  const q=[start];let end=-1;\n  for(let i=0;i<q.length&&end<0;i++){\n    const k=q[i],r=(k/9)|0,c=k%9;\n    if(r===p.goal){end=k;break;}\n    for(const [dr,dc] of D){\n      if(!canStep(r,c,dr,dc,H,V))continue;\n      const n=(r+dr)*9+c+dc;\n      if(par[n]===-2){par[n]=k;q.push(n);}\n    }\n  }\n  const out=[];\n  for(let k=end;k>=0&&par[k]>=0;k=par[k]){const f=par[k];out.push([(f/9)|0,f%9,(k/9)|0,k%9]);}\n  return out;\n}\nfunction genMoves(S,i){\n  const me=S.p[i],op=S.p[1-i];\n  return rawMoves(me,op,S.H,S.V).filter(([r,c])=>rawMoves(op,{r,c},S.H,S.V).length>0);\n}\nfunction genWalls(S,side,K){\n  const me=S.p[side],op=S.p[1-side];\n  if(me.w<=0)return[];\n  const base=dist(op,S.H,S.V),out=[],done=new Set();\n  for(const [r1,c1,r2,c2] of pathEdges(op,S.H,S.V)){\n    const type=r1!==r2?'H':'V',r=r1!==r2?Math.min(r1,r2):r1,c=r1!==r2?c1:Math.min(c1,c2);\n    const k=r+','+c,set=type==='H'?S.H:S.V;\n    if(done.has(type+k)||set.has(k))continue;\n    done.add(type+k);\n    set.add(k);\n    const dO=dist(op,S.H,S.V),dM=dist(me,S.H,S.V);\n    const ok=dO<Infinity&&dM<Infinity&&dO>base&&rawMoves(me,op,S.H,S.V).length>0&&rawMoves(op,me,S.H,S.V).length>0;\n    set.delete(k);\n    if(ok)out.push({t:'w',type,r,c,score:dO-dM});\n  }\n  out.sort((x,y)=>y.score-x.score);\n  return out.slice(0,K);\n}\nfunction genActions(S,side,K){\n  const me=S.p[side],mv=genMoves(S,side).map(([r,c])=>({t:'m',r,c}));\n  for(const m of mv){const o=[me.r,me.c];me.r=m.r;me.c=m.c;m.d=dist(me,S.H,S.V);me.r=o[0];me.c=o[1];}\n  mv.sort((a,b)=>a.d-b.d);\n  return mv.concat(genWalls(S,side,K));\n}\nfunction applyAct(S,side,a){\n  const me=S.p[side];\n  if(a.t==='m'){const r=me.r,c=me.c;me.r=a.r;me.c=a.c;return()=>{me.r=r;me.c=c;};}\n  const set=a.type==='H'?S.H:S.V,k=a.r+','+a.c;\n  set.add(k);me.w--;\n  return()=>{set.delete(k);me.w++;};\n}\nfunction evalS(S,side){\n  const me=S.p[side],op=S.p[1-side];\n  return dist(op,S.H,S.V)-dist(me,S.H,S.V)+0.15*(me.w-op.w);\n}\nfunction search(S,side,depth,alpha,beta,K){\n  if(depth===0)return evalS(S,side);\n  const me=S.p[side],acts=genActions(S,side,K);\n  if(!acts.length)return evalS(S,side)-5;\n  let best=-Infinity;\n  for(const a of acts){\n    const undo=applyAct(S,side,a);\n    const v=(a.t==='m'&&me.r===me.goal)?1000+depth:-search(S,1-side,depth-1,-beta,-alpha,K);\n    undo();\n    if(v>best)best=v;\n    if(best>alpha)alpha=best;\n    if(alpha>=beta)break;\n  }\n  return best;\n}\nfunction chooseAction(){\n  const S=st,side=S.ai.side,lv=S.ai.level,me=S.p[side],R=Math.random;\n  const mv=genMoves(S,side);\n  const along=()=>{\n    const a=genActions(S,side,0);\n    return a[0]||genWalls(S,side,1)[0]||anyWall();\n  };\n  if(lv==='easy'){\n    const x=R();\n    if(x<0.12&&me.w>0){\n      for(let t=0;t<40;t++){\n        const type=R()<.5?'H':'V',r=(R()*(type==='H'?8:9))|0,c=(R()*(type==='H'?9:8))|0;\n        if(wallOK(type,r,c))return{t:'w',type,r,c};\n      }\n    }\n    if(x<0.45&&mv.length){const m=mv[(R()*mv.length)|0];return{t:'m',r:m[0],c:m[1]};}\n    return along();\n  }\n  const P={medium:{d:1,K:8,n:.7},hard:{d:2,K:8,n:.2},demon:{d:4,K:8,n:0}}[lv];\n  const acts=genActions(S,side,P.K);\n  if(!acts.length)return anyWall();\n  let best=null,bv=-Infinity;\n  for(const a of acts){\n    const undo=applyAct(S,side,a);\n    let v;\n    if(a.t==='m'&&me.r===me.goal)v=1000;\n    else v=-search(S,1-side,P.d-1+(P.d===1?0:0),-Infinity,P.n?Infinity:-bv+1e-9,P.K);\n    if(a.t==='m'){const n=S.seen[posKey()]||0;if(n>=3)v-=40*(n-2);}\n    undo();\n    v+=(R()-.5)*2*P.n;\n    if(v>bv){bv=v;best=a;}\n  }\n  return best;\n}\nfunction doAI(a){\n  const side=st.ai.side;\n  st.hist.push(a.t==='m'?{side,t:'m',r:a.r,c:a.c}:{side,t:'w',type:a.type,r:a.r,c:a.c});\n  if(a.t==='m'){st.p[side].r=a.r;st.p[side].c=a.c;endTurn('走了一步',true);}\n  else{(a.type==='H'?st.H:st.V).add(a.r+','+a.c);st.p[side].w--;endTurn('放了隔板',false);}\n}\nfunction maybeAI(){\n  if(st.over||st.locked||!st.ai||st.ai.side!==st.turn||st.thinking)return;\n  const S=st;S.thinking=true;const tok=S.tok;\n  setTimeout(()=>{\n    if(S!==st||S.tok!==tok)return;\n    const a=chooseAction();\n    S.thinking=false;\n    if(a)doAI(a);\n    render();\n  },800);\n}\ndocument.querySelectorAll('.panel button').forEach(btn=>{\n  btn.onclick=()=>{\n    const p=+btn.dataset.p;\n    if(btn.dataset.m==='undo'){doUndo(p);return;}\n    if(st.over||st.locked||st.turn!==p||(st.ai&&st.ai.side===p))return;\n    st.mode=btn.dataset.m;render();\n  };\n});\ndocument.getElementById('br').onclick=init;\ndocument.getElementById('again').onclick=init;\ndocument.getElementById('bmenu').onclick=showMenu;\ndocument.getElementById('tomenu').onclick=showMenu;\ndocument.querySelectorAll('#menu button').forEach(b=>{\n  b.onclick=()=>{\n    const g=b.dataset.go,l=b.dataset.lv;\n    if(g==='pvp')startMatch({mode:'pvp'});\n    else if(g==='ai')view(2);\n    else if(g==='back')view(1);\n    else if(g==='stats'){buildStats();view(3);}\n    else if(g==='games'){buildGames();view(4);}\n    else if(l)startMatch({mode:'ai',level:l});\n  };\n});\n// ================= 音效與音樂（全部即時合成，不需要音檔）=================\nconst AUD={ctx:null,sfx:true,music:true,master:true,sg:null,mg:null,timer:null,step:0,next:0,nb:null};\nlet inHub=false;try{inHub=window.parent!==window;}catch(e){}\nif(inHub){try{if(localStorage.getItem('hub_sound')==='0')AUD.master=false;}catch(e){}}\ntry{const a=JSON.parse(localStorage.getItem('wallrace.audio.v1'));if(a){AUD.sfx=a.sfx!==false;AUD.music=a.music!==false;}}catch(e){}\nfunction saveAudio(){try{localStorage.setItem('wallrace.audio.v1',JSON.stringify({sfx:AUD.sfx,music:AUD.music}));}catch(e){}}\nfunction audioInit(){\n  if(AUD. rgin: 4px 0 14px; letter-spacing: .1em; text-align: center; }\n  button.vipOn { background: linear-gradient(135deg, #d4a017, #f6d365) !important; color: #2b1d00 !important; border: 0 !important; }\n  #status .vq { font-size: 13px; font-weight: 600; color: #ffe9a8; line-height: 1.4; }\n  .shk { animation: shk3 .45s ease; }\n  @keyframes shk3 { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }\n  #endOv .word { font-size: 34px; font-weight: 900; letter-spacing: .2em; color: #fff; margin: 2px 0 8px; text-shadow: 0 0 14px rgba(255, 215, 94, .85); }\n  #endOv .word:empty { display: none; }\n  .kickP { position: fixed; display: flex; align-items: center; justify-content: center; z-index: 70; pointer-events: none; line-height: 1; font-weight: 700; }\n  .burstK { position: fixed; display: flex; align-items: center; justify-content: center; z-index: 69; pointer-events: none; animation: burstK .5s ease-out forwards; }\n  @keyframes burstK { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n  <div id=\"main\">\n    <div id=\"boardWrap\">\n      <svg id=\"svg\" viewBox=\"-0.56 -0.52 1.12 1.04\" xmlns=\"http://www.w3.org/2000/svg\"><\/svg>\n      <div id=\"banner\"><div class=\"bn\" id=\"bn\"><div class=\"t\"><\/div><div class=\"s\"><\/div><\/div><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"side\">\n    <h1>♚ 三人西洋棋<\/h1>\n    <div id=\"status\"><\/div>\n    <div class=\"btns\" id=\"gameBtns\">\n      <button id=\"btnUndo\" class=\"sec\" type=\"button\">↩ 悔棋<\/button>\n      <button id=\"btnTurn\" class=\"sec\" type=\"button\">🔄 轉向<\/button>\n      <button id=\"btnAuto\" class=\"sec\" type=\"button\">自動轉向：關<\/button>\n      <button id=\"btnNew\" type=\"button\">🔁 重新一局<\/button>\n      <button id=\"btnMenu\" class=\"sec\" type=\"button\">🏠 主選單<\/button>\n      <button class=\"sec sndBtn\" type=\"button\">🔊 音效：開<\/button>\n    <\/div>\n    <div class=\"btns\" id=\"replayBar\" hidden>\n      <button id=\"rFirst\" class=\"sec\" type=\"button\">⏮<\/button>\n      <button id=\"rPrev\" class=\"sec\" type=\"button\">◀ 上一步<\/button>\n      <button id=\"rNext\" type=\"button\">下一步 ▶<\/button>\n      <button id=\"rLast\" class=\"sec\" type=\"button\">⏭<\/button>\n      <button id=\"rPlay\" class=\"sec\" type=\"button\">▶▶ 自動播放<\/button>\n      <button id=\"rTurn\" class=\"sec\" type=\"button\">🔄 轉向<\/button>\n      <button id=\"rBack\" class=\"sec\" type=\"button\">📼 返回列表<\/button>\n      <button class=\"sec sndBtn\" type=\"button\">🔊 音效：開<\/button>\n    <\/div>\n    <div id=\"log\"><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"menu\">\n  <div class=\"mwrap\">\n    <div class=\"logo\">♔♚♕<\/div>\n    <h2>三人西洋棋<\/h2>\n    <div id=\"mMain\">\n      <button class=\"big\" id=\"mNew\" type=\"button\">🎮 開始新遊戲<\/button>\n      <button class=\"big sec\" id=\"mRec\" type=\"button\">📼 複盤（最近 10 局）<\/button>\n      <button class=\"big sec\" id=\"mRule\" type=\"button\">📖 規則說明<\/button>\n      <button class=\"big sec\" id=\"mVip\" type=\"button\">👑 VIP<\/button>\n      <button class=\"big sec sndBtn\" type=\"button\">🔊 音效：開<\/button>\n      <button class=\"big sec\" id=\"mChess\" type=\"button\" hidden>↩ 回西洋棋選單（二人／三人）<\/button>\n      <button class=\"big sec\" id=\"mHome\" type=\"button\" hidden>🌐 回大主選單<\/button>\n    <\/div>\n    <div id=\"mSetup\" hidden>\n      <div class=\"lab\">對戰方式<\/div>\n      <div class=\"segs\" id=\"segMode\">\n        <button data-v=\"3h\" type=\"button\" class=\"on\">👥 三人輪流<\/button>\n        <button data-v=\"1h\" type=\"button\">🤖 1 人＋2 電腦<\/button>\n        <button data-v=\"2h\" type=\"button\">🤝 2 人＋1 電腦<\/button>\n      <\/div>\n      <div id=\"rowSeat\" hidden>\n        <div class=\"lab\" id=\"seatLab\">你要執<\/div>\n        <div class=\"segs\" id=\"segSeat\">\n          <button data-v=\"0\" type=\"button\" class=\"on\">○ 白（先手）<\/button>\n          <button data-v=\"1\" type=\"button\">● 黑<\/button>\n          <button data-v=\"2\" type=\"button\">♦ 紅<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"rowLevel\" hidden>\n        <div class=\"lab\">電腦難度<\/div>\n        <div class=\"segs\" id=\"segLevel\">\n          <button data-v=\"easy\" type=\"button\">簡單<\/button>\n          <button data-v=\"medium\" type=\"button\" class=\"on\">普通<\/button>\n          <button data-v=\"hard\" type=\"button\">困難<\/button>\n          <button data-v=\"demon\" type=\"button\">😈 惡魔<\/button>\n        <\/div>\n        <div class=\"hint-t\" id=\"levelHint\"><\/div>\n      <\/div>\n      <div class=\"lab\">同一台 iPad 輪流時<\/div>\n      <div class=\"segs\" id=\"segAuto\">\n        <button data-v=\"1\" type=\"button\" class=\"on\">自動轉向（對著當前玩家）<\/button>\n        <button data-v=\"0\" type=\"button\">固定不轉<\/button>\n      <\/div>\n      <div style=\"height:18px\"><\/div>\n      <button class=\"big\" id=\"mStart\" type=\"button\">開始對戰<\/button>\n      <button class=\"big sec\" id=\"mBack1\" type=\"button\">← 返回<\/button>\n    <\/div>\n    <div id=\"mRules\" hidden>\n      <div class=\"rec\" style=\"cursor:default;display:block;line-height:1.7;font-size:14px\">\n        <b>棋盤<\/b>：六角形、96 格。白、黑、紅各佔一個 4×8 的區塊（各 16 子），三個區塊只在中間的「遠邊」相接，兩側是棋盤邊緣。<br>\n        <b>走法<\/b>：棋子和一般西洋棋相同。直線（車、后）可以沿著檔一路穿過中間，走到別人的陣地；斜線（象、后）也能穿過棋盤正中心，到達對角的格子。<br>\n        <b>兵<\/b>：往中心前進，越過中心後轉向對面，走到對面的底線升變。<br>\n        <b>輪流<\/b>：白 → 黑 → 紅。<br>\n        <b>將軍<\/b>：被將軍的人必須解除；但輪到另一位玩家時，他也可以直接吃掉被將軍的國王。<br>\n        <b>淘汰<\/b>：被將殺或國王被吃掉就被淘汰，他的棋子會變成灰色殭屍子留在棋盤上不動（可被吃、也會擋路）。<br>\n        <b>勝利<\/b>：只剩一位玩家就獲勝；連續 150 手沒有吃子或走兵則和棋。<br>\n        <b>簡化<\/b>：沒有易位、沒有過路兵。\n      <\/div>\n      <button class=\"big sec\" id=\"mBack3\" type=\"button\" style=\"margin-top:12px\">← 返回<\/button>\n    <\/div>\n    <div id=\"mVipPw\" hidden>\n      <div class=\"vipTitle\">👑 VIP 通行密碼<\/div>\n      <input class=\"inp\" id=\"pwIn\" type=\"password\" inputmode=\"nume v><\/div><\/div>\n<div class=\"modal\" id=\"mdPromo\"><div class=\"box\"><div style=\"font-size:17px\">兵升變成：<\/div><div class=\"row\" id=\"promoRow\"><\/div><\/div><\/div>\n<div id=\"endOv\"><div class=\"card\"><div class=\"crown\" id=\"eCrown\">👑<\/div><div class=\"big2\" id=\"eBig\"><\/div><div class=\"word\" id=\"eWord\"><\/div><div class=\"sub\" id=\"eSub\"><\/div><div class=\"small\" id=\"eSmall\"><\/div><div class=\"row\"><button id=\"eAgain\" type=\"button\">🔁 再來一局<\/button><button id=\"eRec\" class=\"sec\" type=\"button\">📼 複盤<\/button><button id=\"eMenu\" class=\"sec\" type=\"button\">🏠 主選單<\/button><\/div><\/div><\/div>\n\n<script>\n/* ===== 三人西洋棋引擎 =====\n * 棋盤：3 區 × 4 排 × 8 檔 = 96 格（3-chess.com 六角形）。sq = r*24 + s*8 + fi（r=0 底線，r=3 近中心）。\n * 白 f=0..7、黑 f=8..15、紅 f=16..23 為各自大本營。\n * 三區只在遠邊相接（檔號鏡射），兩側是邊界；詳見 step()。\n * 棋子碼：owner*8 + type；type 1=兵(向內) 2=馬 3=象 4=車 5=后 6=王 7=兵(已過中心，向外)；owner 3=灰色殭屍。\n * 走法：from | to<<7 | promo<<14\n */\nfunction Chess3Engine() {\n  var board = new Int8Array(96);\n  var active = [true, true, true];\n  var kingSq = [4, 12, 20];\n\n  /* ---- 棋盤拓樸（照 3-chess.com 六角形棋盤）----\n   * 每位玩家一塊 8 檔 × 4 排（排 r=0 為底線，r=3 為最靠中心的一排）。\n   * 三塊只在「遠邊」相接：a–d 檔接上一家的 h–e 檔、e–h 檔接下一家的 d–a 檔（檔號鏡射）。\n   * 兩側邊是棋盤邊界。中心是 6 格交會的頂點（每區的 d4、e4）。 */\n  function sqOf(r, s, fi) { return r * 24 + s * 8 + fi; }\n  /* 走一步：回傳 [r,s,fi,dr,df]（新位置與新座標系方向）或 null */\n  function step(r, s, fi, dr, df) {\n    var r2 = r + dr, f2 = fi + df;\n    if (f2 < 0 || f2 > 7 || r2 < 0) return null;\n    if (r2 <= 3) return [r2, s, f2, dr, df];\n    // 越過遠邊\n    if (df !== 0 && ((fi === 3 && df === 1) || (fi === 4 && df === -1))) {\n      // 斜線穿過正中心頂點：到正對面那一格\n      var pos = 2 * s + (fi === 4 ? 1 : 0), np = (pos + 3) % 6;\n      return [3, np >> 1, (np & 1) ? 4 : 3, -1, df];\n    }\n    return [3, f2 >= 4 ? (s + 1) % 3 : (s + 2) % 3, 7 - f2, -1, -df];\n  }\n  function walk(sq, dr, df, maxLen) {\n    var out = [], st = [(sq / 24) | 0, (sq % 24) >> 3, sq & 7, dr, df], n;\n    while (ou ;\n  }\n  .menu-stack{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px; }\n  .overlay .menu-stack .btn{ width:100%; }\n  .editor-list{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:10px; margin: 6px 0 18px; }\n  .editor-row{\n    display:flex; align-items:center; gap:10px;\n    background: var(--board-bg); border-radius:10px; padding:10px; text-align:left;\n  }\n  .editor-row .thumb{\n    width:56px; height:56px; border-radius:8px; flex-shrink:0;\n    background: linear-gradient(135deg,#6b6053,#4a4238) center/cover no-repeat;\n  }\n  .editor-row .val{ font-weight:800; color: var(--accent); min-width:52px; font-size:18px; }\n  .editor-row .grow{ flex:1; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }\n  .overlay .ed-btn{\n    flex:none; width:auto; padding:9px 14px; font-size:14px; border-radius:8px;\n    border:none; font-weight:700; cursor:pointer;\n    background: var(--accent); color: var(--text-dark);\n  }\n  .overlay .ed-btn.ghost{ background: var(--cell-empty); color: var(--text-light); }\n  .editor-row input[type=text]{\n    flex:1; min-width:0; padding:11px 12px; font-size:16px; border-radius:8px; border:none;\n    background: var(--cell-empty); color: var(--text-light);\n  }\n  input{ -webkit-user-select:text; user-select:text; }\n  .editor-hint{ font-size:13px; opacity:.65; max-width:440px; margin:0 0 6px; }\n\n  /* Side menu */\n  .side-menu{\n    position: fixed;\n    top:0; left:0;\n    width: 280px;\n    max-width: 82vw;\n    height:100%;\n    background: var(--board-bg);\n    transform: translateX(-100%);\n    transition: transform .25s ease;\n    z-index: 60;\n    padding: 20px;\n    overflow-y:auto;\n    touch-action: pan-y;\n    -webkit-overflow-scrolling: touch;\n  }\n  .side-menu.show{ transform: translateX(0); }\n  #leaderboardPanel{ left:auto; right:0; transform: translateX(100%); }\n  #leaderboardPanel.show{ transform: translateX(0); }\n  .side-menu h3{\n    margin-top:0;\n  }\n  .reward-list{\n    list-style:none; padding:0; margin:0;\n    display:flex; flex-direction:column; gap:8px;\n  }\n  .reward-list li{\n    background: var(--cell-empty);\n    border-radius:8px;\n    padding: 10px 12px;\n    font-size: 14px;\n    display:flex; justify-content:space-between;\n    align-items:center;\n  }\n  .reward-list li .val{\n    font-weight:700; color: var(--accent);\n  }\n  .reward-list .empty{\n    opacity:.6; font-size:13px; text-align:center; padding:20px 0;\n  }\n  .scrim{\n    position:fixed; inset:0;\n    background: rgba(0,0,0,.5);\n    display:none;\n    z-index: 55;\n  }\n  .scrim.show{ display:block; }\n  .close-menu{\n    background:none;\n    border:none;\n    color: var(--text-light);\n    font-size: 20px;\n    position:absolute;\n    top:14px; right:16px;\n    cursor:pointer;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <header>\n    <button class=\"menu-btn\" id=\"menuBtn\" aria-label=\"獎勵清單\"><span><\/span><span><\/span><span><\/span><\/button>\n    <h1>照片版 2048<\/h1>\n    <div class=\"header-right\">\n      <div class=\"scores\">\n        <div class=\"score-box\"><div class=\"label\">分數<\/div><div class=\"value\" id=\"score\">0<\/div><\/div>\n        <div class=\"score-box\"><div class=\"label\">最高<\/div><div class=\"value\" id=\"best\">0<\/div><\/div>\n      <\/div>\n      <button class=\"menu-btn\" id=\"leaderboardBtn\" aria-label=\"排行榜\" style=\"font-size:20px;\">🏆<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"toolbar\">\n    <button class=\"btn secondary\" id=\"undoBtn\">↩ 撤銷（剩 <span id=\"undoCount\">1<\/span>）<\/button>\n    <button class=\"btn\" id=\"newGameBtn\">新遊戲<\/button>\n    <button class=\"btn secondary\" id=\"openStartMenuBtn\">☰ 選單<\/button>\n  <\/div>\n\n  <div class=\"board-wrap\" id=\"boardWrap\">\n    <div class=\"board-bg-grid\" id=\"bgGrid\"><\/div>\n    <div class=\"tiles-layer\" id=\"tilesLayer\"><\/div>\n  <\/div>\n\n  <div class=\"hint\">方向鍵 / 滑動操作　．　合成數字解鎖獎勵<\/div>\n<\/div>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<div class=\"side-menu\" id=\"sideMenu\">\n  <button class=\"close-menu\" id=\"closeMenu\">✕<\/button>\n  <h3>已獲得獎勵<\/h3>\n  <ul class=\"reward-list\" id=\"rewardList\"><\/ul>\n<\/div>\n\n<div class=\"side-menu\" id=\"leaderboardPanel\">\n  <button class=\"close-menu\" id=\"closeLeaderboard\">✕<\/button>\n  <h3>🏆 排行榜<\/h3>\n  <ol class=\"reward-list\" id=\"leaderboardList\" style=\"padding-left:0;\"><\/ol>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"photo-preview\" id=\"overlayPhoto\"><\/div>\n  <h2>恭喜！<\/h2>\n  <div class=\"reward-text\" id=\"overlayReward\">獲得：捶背一次<\/div>\n  <button class=\"btn\" id=\"continueBtn\" style=\"max-width:200px;\">繼續<\/button>\n<\/div>\n\n<div class=\"overlay\" id=\"gameOverOverlay\">\n  <h2>遊戲結束<\/h2>\n  <div class=\"reward-text\" id=\"gameOverScore\">分數：0<\/div>\n  <button class=\"btn\" id=\"recordScoreBtn\" style=\"max-width:200px;\">記錄成績<\/button>\n<\/div>\n\n<div class=\"overlay\" id=\"nameEntryOverlay\">\n  <h2>輸入你的名字<\/h2>\n  <input id=\"nameInput\" type=\"text\" maxlength=\"12\" placeholder=\"你的名字\"\n    style=\"width:80%; max-width:280px; padding:14px 16px; font-size:18px; border-radius:10px; border:none; text-align:center; margin-bottom:22px; background:var(--cell-empty); color:var(--text-light);\">\n  <button class=\"btn\" id=\"saveScoreBtn\" style=\"max-width:200px;\">儲存並重新開始<\/button>\n  <button class=\"btn secondary\" id=\"skipSaveBtn\" style=\"max-width:200px; margin-top:12px;\">不儲存，重新開始<\/button>\n<\/div>\n\n<div class=\"overlay\" id=\"startMenu\">\n  <h2 style=\"font-size:30px; margin-bottom:22px;\">照片版 2048<\/h2>\n  <div class=\"menu-stack\">\n    <button class=\"btn\" id=\"startGameBtn\">開始遊戲<\/button>\n    <button class=\"btn secondary\" id=\"openPhotoEditorBtn\">更換照片<\/button>\n    <button class=\"btn secondary\" id=\"openRewardEditorBtn\">編輯獎勵文字<\/button>\n    <button class=\"btn secondary\" id=\"menuLeaderBtn\">🏆 排行榜<\/button>\n    <button class=\"btn secondary\" id=\"menuRewardBtn\">🎁 獎勵清單<\/button>\n    <button class=\"btn secondary\" id=\"hubHomeBtn\" style=\"display:none\">🌐 回大主選單<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"overlay scroll\" id=\"photoEditor\">\n  <h2>更換照片<\/h2>\n  <p class=\"editor-hint\">每個數字方塊可以換成自己的照片，會自動縮小後存在這個瀏覽器裡。<\/p>\n  <div class=\"editor-list\" id=\"photoEditorList\"><\/div>\n  <input type=\"file\" id=\"photoFileInput\" accept=\"image/*\" style=\"display:none\">\n  <button class=\"btn\" id=\"closePhotoEditorBtn\">完成<\/button>\n<\/div>\n\n<div class=\"overlay scroll\" id=\"rewardEditor\">\n  <h2>編輯獎勵文字<\/h2>\n  <p class=\"editor-hint\">合成出該數字時會跳出的文字。留空就顯示通用的「達成成就」訊息。<\/p>\n  <div class=\"editor-list\" id=\"rewardEditorList\"><\/div>\n  <button class=\"btn\" id=\"closeRewardEditorBtn\">完成<\/button>\n<\/div>\n\n<script>\n  // ===== 預設照片（空白）=====\n  const PHOTOS = {}; // 預設不內建任何照片，由使用者在開場選單「更換照片」自行加入\n<\/script>\n<script>\n(function(){\n  const SIZE = 4;\n  // 獎勵文字：預設全空白（顯示通用成就訊息），可在開場選單「編輯獎勵文字」自行設定\n  const REWARD_VALUES = [8,16,32,64,128,256,512,1024,2048,4096,8192];\n  const PHOTO_VALUES = [2,4,8,16,32,64,128,256,512,1024,2048,4096];\n  const REWARDS_KEY = 'photo2048_rewards_v1';\n  const PHOTOS_KEY = 'photo2048_photos_v1';\n  function loadJSON(key){\n    try{ const o = JSON.parse(localStorage.getItem(key) || '{}'); return (o && typeof o==='object') ? o : {}; }\n    catch(e){ return {}; }\n  }\n  function saveJSON(key, obj){\n    try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }\n    catch(e){ alert('設定儲存失敗，可能是瀏覽器的隱私/無痕模式限制了儲存功能，或照片太大。'); return false; }\n  }\n  let rewards = loadJSON(REWARDS_KEY);\n  let customPhotos = loadJSON(PHOTOS_KEY);\n\n  let grid, score, best, undoLeft, prevState, sessionAchieved;\n  const boardWrap = document.getElementById('boardWrap');\n  const bgGrid = document.getElementById('bgGrid');\n  const tilesLayer = document.getElementById('tilesLayer');\n  const scoreEl = document.getElementById('score');\n  const bestEl = document.getElementById('best');\n  const undoBtn = document.getElementById('undoBtn');\n  const undoCountEl = document.getElementById('undoCount');\n  const newGameBtn = document.getElementById('newGameBtn');\n  const overlay = document.getElementById('overlay');\n  const overlayReward = document.getElementById('overlayReward');\n  const overlayPhoto = document.getElementById('overlayPhoto');\n  const continueBtn = document.getElementById('continueBtn');\n  const gameOverOverlay = document.getElementById('gameOverOverlay');\n  const gameOverScore = document.getElementById('gameOverScore');\n  const recordScoreBtn = document.getElementById('recordScoreBtn');\n  const nameEntryOverlay = document.getElementById('nameEntryOverlay');\n  const nameInput = document.getElementById('nameInput');\n  const saveScoreBtn = document.getElementById('saveScoreBtn');\n  const skipSaveBtn = document.getElementById('skipSaveBtn');\n  const menuBtn = document.getElementById('menuBtn');\n  const closeMenu = document.getElementById('closeMenu');\n  const sideMenu = document.getElementById('sideMenu');\n  const scrim = document.getElementById('scrim');\n  const rewardList = document.getElementById('rewardList');\n  const leaderboardBtn = document.getElementById('leaderboardBtn');\n  const closeLeaderboard = document.getElementById('closeLeaderboard');\n  const leaderboardPanel = document.getElementById('leaderboardPanel');\n  const leaderboardList = document.getElementById('leaderboardList');\n\n  for(let i=0;i<16;i++){\n    const c = document.createElement('div');\n    c.className='cell-bg';\n    bgGrid.appendChild(c);\n  }\n\n  function loadBest(){\n    return parseInt(localStorage.getItem('photo2048_best')||'0',10);\n  }\n  function saveBest(v){\n    localStorage.setItem('photo2048_best', String(v));\n  }\n\n  function newGame(){\n    grid = Array.from({length:SIZE},()=>Array(SIZE).fill(0));\n    score = 0;\n    undoLeft = 1;\n    prevState = null;\n    sessionAchieved = [];\n    addRandomTile();\n    addRandomTile();\n    updateUndoUI();\n    render();\n    updateScore();\n    renderRewardList();\n  }\n\n  function simulateMove(g, direction){\n    let workGrid = cloneGrid(g);\n    let rotations = {left:0, down:1, right:2, up:3}[direction];\n    for(let i=0;i<rotations;i++) workGrid = rotateGridCW(workGrid);\n    let totalGained = 0;\n    let anyMoved = false;\n    const newGrid = [];\n    for(let r=0;r<SIZE;r++){\n      const before = workGrid[r].slice();\n      const {row, gained} = slideRowLeft(workGrid[r]);\n      newGrid.push(row);\n      totalGained += gained;\n      if(!arraysEqual(before,row)) anyMoved = true;\n    }\n    let resultGrid = newGrid;\n    let backRotations = (4 - rotations) % 4;\n    for(let i=0;i<backRotations;i++) resultGrid = rotateGridCW(resultGrid);\n    return { grid: resultGrid, gained: totalGained, anyMoved };\n  }\n\n  function countAdjacentPairs(g){\n    let count = 0;\n    for(let r=0;r<SIZE;r++){\n      for(let c=0;c<SIZE;c++){\n        if(g[r][c]===0) continue;\n        if(c<SIZE-1 && g[r][c]===g[r][c+1]) count++;\n        if(r<SIZE-1 && g[r][c]===g[r+1][c]) count++;\n      }\n    }\n    return count;\n  }\n\n  function addRandomTile(){\n    const empties=[];\n    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empties.push([r,c]);\n    if(empties.length===0) return;\n\n    // 數字比例回到經典版：90% 是 2、10% 是 4\n    const val = Math.random() < 0.9 ? 2 : 4;\n\n    // 惡意加強（全盤評估版）：針對每個候選空格，模擬放進去之後，\n    // 玩家「四個方向裡最好的一步」能拿到多少分、盤面上還剩多少組相鄰可合成的數字。\n    // 分數越低（玩家能拿到的最大分數越少、盤面越亂），對玩家越不利，優先選這種格子。\n    let candidates = [];\n    for(const [r,c] of empties){\n      const tempGrid = cloneGrid(grid);\n      tempGrid[r][c] = val;\n\n      let bestGain = 0;\n      for(const dir of ['left','right','up','down']){\n        const sim = simulateMove(tempGrid, dir);\n        if(sim.anyMoved && sim.gained > bestGain) bestGain = sim.gained;\n      }\n      const pairs = countAdjacentPairs(tempGrid);\n      candidates.push({ r, c, bestGain, pairs });\n    }\n\n    // 先比「玩家下一步最多能拿多少分」（越少越好，也就是對玩家越不利）\n    // 分數相同時，再比「盤面上剩多少組可合成的相鄰數字」（越少越好）\n    candidates.sort((a,b) => (a.bestGain - b.bestGain) || (a.pairs - b.pairs));\n    const lowestGain = candidates[0].bestGain;\n    const lowestPairs = candidates.filter(c => c.bestGain === lowestGain)[0].pairs;\n    const tied = candidates.filter(c => c.bestGain === lowestGain && c.pairs === lowestPairs);\n    const pick = tied[Math.floor(Math.random()*tied.length)];\n\n    grid[pick.r][pick.c] = val;\n  }\n\n  function cloneGrid(g){ return g.map(row=>row.slice()); }\n\n  function saveForUndo(){\n    prevState = { grid: cloneGrid(grid), score };\n  }\n\n  function updateUndoUI(){\n    undoCountEl.textContent = undoLeft;\n    undoBtn.disabled = undoLeft<=0 || !prevState;\n  }\n\n  function updateScore(){\n    scoreEl.textContent = score;\n    best = Math.max(loadBest(), score);\n    saveBest(best);\n    bestEl.textContent = best;\n  }\n\n  // ---- movement logic ----\n  function slideRowLeft(row){\n    let arr = row.filter(v=>v!==0);\n    let gained = 0;\n    let merged = [];\n    for(let i=0;i<arr.length-1;i++){\n      if(arr[i] === arr[i+1]){\n        arr[i]*=2;\n        gained += arr[i];\n        merged.push(arr[i]);\n        arr.splice(i+1,1);\n      }\n    }\n    while(arr.length<SIZE) arr.push(0);\n    return {row:arr, gained, merged};\n  }\n\n  function rotateGridCW(g){\n    const n=SIZE;\n    const res = Array.from({length:n},()=>Array(n).fill(0));\n    for(let r=0;r<n;r++) for(let c=0;c<n;c++) res[c][n-1-r] = g[r][c];\n    return res;\n  }\n\n  function move(direction){\n    // direction: 'left','right','up','down'\n    let workGrid = cloneGrid(grid);\n    let rotations = {left:0, down:1, right:2, up:3}[direction];\n    for(let i=0;i<rotations;i++) workGrid = rotateGridCW(workGrid);\n\n    let totalGained = 0;\n    let anyMoved = false;\n    let mergedValues = [];\n    const newGrid = [];\n    for(let r=0;r<SIZE;r++){\n      const before = workGrid[r].slice();\n      const {row, gained, merged} = slideRowLeft(workGrid[r]);\n      newGrid.push(row);\n      totalGained += gained;\n      mergedValues = mergedValues.concat(merged);\n      if(!arraysEqual(before,row)) anyMoved = true;\n    }\n    let resultGrid = newGrid;\n    // rotate back\n    let backRotations = (4 - rotations) % 4;\n    for(let i=0;i<backRotations;i++) resultGrid = rotateGridCW(resultGrid);\n\n    if(!anyMoved){\n      checkGameOver();\n      return;\n    }\n\n    saveForUndo();\n    grid = resultGrid;\n    score += totalGained;\n    addRandomTile();\n    updateUndoUI();\n    render();\n    updateScore();\n    checkMilestones(mergedValues);\n    checkGameOver();\n  }\n\n  function arraysEqual(a,b){\n    for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;\n    return true;\n  }\n\n  function undo(){\n    if(!prevState || undoLeft<=0) return;\n    grid = cloneGrid(prevState.grid);\n    score = prevState.score;\n    prevState = null;\n    undoLeft -= 1;\n    updateUndoUI();\n    render();\n    updateScore();\n    checkGameOver();\n  }\n\n  function isGameOver(){\n    for(let r=0;r<SIZE;r++){\n      for(let c=0;c<SIZE;c++){\n        if(grid[r][c]===0) return false;\n        if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return false;\n        if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return false;\n      }\n    }\n    return true;\n  }\n\n  // ---- 排行榜（本機儲存） ----\n  const LEADERBOARD_KEY = 'photo2048_leaderboard';\n  const LEADERBOARD_MAX = 10;\n\n  function loadLeaderboard(){\n    try{\n      return JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || '[]');\n    }catch(e){ return []; }\n  }\n  function saveLeaderboardList(list){\n    try{\n      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list));\n    }catch(e){\n      alert('排行榜儲存失敗，可能是瀏覽器的隱私/無痕模式限制了儲存功能。');\n    }\n  }\n  function addLeaderboardEntry(name, sc){\n    const list = loadLeaderboard();\n    const finalName = name || '匿名';\n    list.push({ name: finalName, score: sc, date: new Date().toLocaleDateString('zh-TW') });\n    list.sort((a,b) => b.score - a.score);\n    const trimmed = list.slice(0, LEADERBOARD_MAX);\n    saveLeaderboardList(trimmed);\n  }\n  function renderLeaderboardList(){\n    const list = loadLeaderboard();\n    leaderboardList.innerHTML = '';\n    if(list.length===0){\n      const li = document.createElement('div');\n      li.className = 'empty';\n      li.textContent = '還沒有任何紀錄，快來挑戰第一名！';\n      leaderboardList.appendChild(li);\n      return;\n    }\n    list.forEach((entry, i)=>{\n      const li = document.createElement('li');\n      li.innerHTML = `<span class=\"val\">#${i+1} ${entry.name}<\/span><span>${entry.score} 分（${entry.date}）<\/span>`;\n      leaderboardList.appendChild(li);\n    });\n  }\n\n  function checkGameOver(){\n    // Only end the game if there's truly no way out — if the player still\n    // has an undo available, let them use it instead of forcing game over.\n    if(isGameOver() && undoLeft<=0){\n      gameOverScore.textContent = '分數：' + score;\n      gameOverOverlay.classList.add('show');\n    }\n  }\n\n  const LAST_NAME_KEY = 'photo2048_lastname';\n  let pendingNewGameAfterLeaderboard = false;\n\n  recordScoreBtn.addEventListener('click', ()=>{\n    gameOverOverlay.classList.remove('show');\n    nameInput.value = localStorage.getItem(LAST_NAME_KEY) || '';\n    nameEntryOverlay.classList.add('show');\n    setTimeout(()=>{ nameInput.focus(); nameInput.select(); }, 50);\n  });\n\n  function finishSaveFlow(save){\n    nameEntryOverlay.classList.remove('show');\n    if(save){\n      const name = nameInput.value.trim();\n      addLeaderboardEntry(name, score);\n      if(name) localStorage.setItem(LAST_NAME_KEY, name);\n      // 存檔後直接打開排行榜，讓玩家馬上看到自己被記錄進去了\n      pendingNewGameAfterLeaderboard = true;\n      renderLeaderboardList();\n      leaderboardPanel.classList.add('show');\n      scrim.classList.add('show');\n    } else {\n      newGame();\n    }\n  }\n  saveScoreBtn.addEventListener('click', ()=> finishSaveFlow(true));\n  skipSaveBtn.addEventListener('click', ()=> finishSaveFlow(false));\n  nameInput.addEventListener('keydown', (e)=>{\n    if(e.key === 'Enter') finishSaveFlow(true);\n  });\n\n  // ---- milestone rewards ----\n  let milestoneQueue = [];\n  function checkMilestones(mergedValues){\n    const uniqueVals = [...new Set(mergedValues)];\n    uniqueVals.sort((a,b)=>a-b);\n    for(const v of uniqueVals){\n      // 8以上的每個數值都算一個成就，不管有沒有特別設定文字/照片\n      if(v>=8 && sessionAchieved.indexOf(v) === -1){\n        sessionAchieved.push(v);\n        milestoneQueue.push(v);\n      }\n    }\n    renderRewardList();\n    if(milestoneQueue.length>0 && !overlay.classList.contains('show')){\n      showNextMilestone();\n    }\n  }\n\n  function rewardTextFor(v){\n    const t = (rewards[v] || '').trim();\n    return t || `🎉 達成 ${v} 成就！`;\n  }\n\n  function showNextMilestone(){\n    if(milestoneQueue.length===0) return;\n    const v = milestoneQueue.shift();\n    overlayReward.textContent = \"獲得：\" + rewardTextFor(v);\n    setTileBackground(overlayPhoto, v);\n    overlay.classList.add('show');\n  }\n\n  continueBtn.addEventListener('click', ()=>{\n    overlay.classList.remove('show');\n    setTimeout(()=>{\n      if(milestoneQueue.length>0) showNextMilestone();\n    }, 150);\n  });\n\n  function renderRewardList(){\n    rewardList.innerHTML='';\n    if(sessionAchieved.length===0){\n      const li = document.createElement('div');\n      li.className='empty';\n      li.textContent='這一局還沒有獲得任何獎勵，繼續玩下去吧！';\n      rewardList.appendChild(li);\n      return;\n    }\n    const sorted = sessionAchieved.slice().sort((a,b)=>a-b);\n    for(const v of sorted){\n      const li = document.createElement('li');\n      li.innerHTML = `<span class=\"val\">${v}<\/span><span>${rewardTextFor(v)}<\/span>`;\n      rewardList.appendChild(li);\n    }\n  }\n\n  // ---- image handling ----\n  // 沒有照片時的底色（照片換上去之後就會被照片取代）\n  const TILE_COLORS = {\n    2:'#7a6f60', 4:'#8a7556', 8:'#b8723a', 16:'#c2602f', 32:'#c24a35', 64:'#c2331f',\n    128:'#b89a3a', 256:'#b3912a', 512:'#a8861a', 1024:'#9c7a10', 2048:'#8f6e00', 4096:'#5b4a8f'\n  };\n  function setTileBackground(el, value){\n    el.className = el.className.replace('fallback','').trim();\n    const uri = customPhotos[value] || PHOTOS[value];\n    if(!uri){\n      el.classList.add('fallback');\n      el.style.backgroundImage = 'none';\n      el.style.backgroundColor = TILE_COLORS[value] || '#3f3a8f';\n    } else {\n      el.style.backgroundColor = '';\n      el.style.backgroundImage = `url(\"${uri}\")`;\n    }\n  }\n\n  // ---- rendering ----\n  function render(){\n    tilesLayer.innerHTML='';\n    const wrapRect = boardWrap.getBoundingClientRect();\n    const innerSize = wrapRect.width - 20; // padding 10 each side\n    const gap = 10;\n    const cellSize = (innerSize - gap*(SIZE-1)) / SIZE;\n\n    for(let r=0;r<SIZE;r++){\n      for(let c=0;c<SIZE;c++){\n        const val = grid[r][c];\n        if(val===0) continue;\n        const tile = document.createElement('div');\n        tile.className='tile pop';\n        tile.style.width = cellSize+'px';\n        tile.style.height = cellSize+'px';\n        tile.style.left = (c*(cellSize+gap))+'px';\n        tile.style.top = (r*(cellSize+gap))+'px';\n\n        const photo = document.createElement('div');\n        photo.className='photo-bg';\n        setTileBackground(photo, val);\n        tile.appendChild(photo);\n\n        const num = document.createElement('div');\n        num.className='num';\n        num.textContent = val;\n        if(cellSize < 70) num.style.fontSize = '18px';\n        tile.appendChild(num);\n\n        tilesLayer.appendChild(tile);\n      }\n    }\n  }\n\n  function blockingOverlayOpen(){\n    return ['overlay','gameOverOverlay','nameEntryOverlay','startMenu','photoEditor','rewardEditor']\n      .some(id => document.getElementById(id).classList.contains('show'));\n  }\n\n  // ---- input handling ----\n  // 取消 iOS Safari 的「連點兩下放大」手勢，但如果目前已經是放大狀態，\n  // 就放行讓使用者可以用雙擊縮小回去\n  document.addEventListener('dblclick', (e)=> e.preventDefault());\n  let lastTouchEndTime = 0;\n  document.addEventListener('touchend', (e)=>{\n    const now = Date.now();\n    const isZoomedIn = window.visualViewport && window.visualViewport.scale > 1.01;\n    if(now - lastTouchEndTime <= 300 && !isZoomedIn){\n      e.preventDefault();\n    }\n    lastTouchEndTime = now;\n  }, { passive:false });\n\n  // 擋掉雙指撥開縮放（pinch zoom）手勢\n  document.addEventListener('gesturestart', (e)=> e.preventDefault());\n  document.addEventListener('gesturechange', (e)=> e.preventDefault());\n  document.addEventListener('gestureend', (e)=> e.preventDefault());\n\n  document.addEventListener('keydown', (e)=>{\n    if(blockingOverlayOpen()) return;\n    const map = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down'};\n    if(map[e.key]){\n      e.preventDefault();\n      move(map[e.key]);\n    }\n  });\n\n  let touchStartX=0, touchStartY=0, touchActive=false;\n  boardWrap.addEventListener('touchstart', (e)=>{\n    if(blockingOverlayOpen()) return;\n    const t = e.changedTouches[0];\n    touchStartX = t.clientX; touchStartY = t.clientY;\n    touchActive = true;\n  }, {passive:true});\n\n  boardWrap.addEventListener('touchend', (e)=>{\n    if(!touchActive || blockingOverlayOpen()) return;\n    touchActive = false;\n    const t = e.changedTouches[0];\n    const dx = t.clientX - touchStartX;\n    const dy = t.clientY - touchStartY;\n    const absX = Math.abs(dx), absY = Math.abs(dy);\n    const threshold = 24;\n    if(Math.max(absX,absY) < threshold) return;\n    if(absX > absY){\n      move(dx>0 ? 'right' : 'left');\n    } else {\n      move(dy>0 ? 'down' : 'up');\n    }\n  }, {passive:true});\n\n  undoBtn.addEventListener('click', undo);\n  newGameBtn.addEventListener('click', ()=>{\n    if(confirm('確定要開始新遊戲嗎？目前進度將會重置。')) newGame();\n  });\n\n  menuBtn.addEventListener('click', ()=>{\n    sideMenu.classList.add('show');\n    scrim.classList.add('show');\n  });\n  leaderboardBtn.addEventListener('click', ()=>{\n    renderLeaderboardList();\n    leaderboardPanel.classList.add('show');\n    scrim.classList.add('show');\n  });\n  function closeMenuFn(){\n    sideMenu.classList.remove('show');\n    leaderboardPanel.classList.remove('show');\n    scrim.classList.remove('show');\n    if(pendingNewGameAfterLeaderboard){\n      pendingNewGameAfterLeaderboard = false;\n      newGame();\n    }\n  }\n  closeMenu.addEventListener('click', closeMenuFn);\n  closeLeaderboard.addEventListener('click', closeMenuFn);\n  scrim.addEventListener('click', closeMenuFn);\n\n  window.addEventListener('resize', render);\n\n  // ---- 開場選單 / 照片與獎勵設定 ----\n  const startMenu = document.getElementById('startMenu');\n  const startGameBtn = document.getElementById('startGameBtn');\n  const photoEditor = document.getElementById('photoEditor');\n  const photoEditorList = document.getElementById('photoEditorList');\n  const photoFileInput = document.getElementById('photoFileInput');\n  const rewardEditor = document.getElementById('rewardEditor');\n  const rewardEditorList = document.getElementById('rewardEditorList');\n\n  function openStartMenu(){\n    closeMenuFn();\n    startMenu.classList.add('show');\n  }\n  startGameBtn.addEventListener('click', ()=>{\n    startMenu.classList.remove('show');\n    startGameBtn.textContent = '繼續遊戲';\n  });\n  document.getElementById('openStartMenuBtn').addEventListener('click', openStartMenu);\n\n  // 照片編輯\n  let photoTarget = null;\n  function renderPhotoEditor(){\n    photoEditorList.innerHTML = '';\n    PHOTO_VALUES.forEach(v=>{\n      const row = document.createElement('div');\n      row.className = 'editor-row';\n      const thumb = document.createElement('div');\n      thumb.className = 'thumb';\n      const uri = customPhotos[v] || PHOTOS[v];\n      if(uri) thumb.style.backgroundImage = `url(\"${uri}\")`;\n      else { thumb.style.backgroundImage = 'none'; thumb.style.backgroundColor = TILE_COLORS[v] || '#3f3a8f'; }\n      const val = document.createElement('div');\n      val.className = 'val';\n      val.textContent = v;\n      const grow = document.createElement('div');\n      grow.className = 'grow';\n      const change = document.createElement('button');\n      change.className = 'ed-btn';\n      change.textContent = '更換';\n      change.addEventListener('click', ()=>{ photoTarget = v; photoFileInput.value = ''; photoFileInput.click(); });\n      grow.appendChild(change);\n      if(customPhotos[v]){\n        const reset = document.createElement('button');\n        reset.className = 'ed-btn ghost';\n        reset.textContent = '還原';\n        reset.addEventListener('click', ()=>{\n          delete customPhotos[v];\n          saveJSON(PHOTOS_KEY, customPhotos);\n          renderPhotoEditor();\n          render();\n        });\n        grow.appendChild(reset);\n      }\n      row.appendChild(thumb); row.appendChild(val); row.appendChild(grow);\n      photoEditorList.appendChild(row);\n    });\n  }\n\n  function shrinkImageFile(file, maxDim, quality){\n    return new Promise((resolve, reject)=>{\n      const reader = new FileReader();\n      reader.onerror = reject;\n      reader.onload = ()=>{\n        const img = new Image();\n        img.onerror = reject;\n        img.onload = ()=>{\n          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));\n          const canvas = document.createElement('canvas');\n          canvas.width = Math.round(img.width * scale);\n          canvas.height = Math.round(img.height * scale);\n          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n          resolve(canvas.toDataURL('image/jpeg', quality));\n        };\n        img.src = reader.result;\n      };\n      reader.readAsDataURL(file);\n    });\n  }\n\n  photoFileInput.addEventListener('change', async ()=>{\n    const file = photoFileInput.files && photoFileInput.files[0];\n    if(!file || photoTarget===null) return;\n    try{\n      const dataUrl = await shrinkImageFile(file, 600, 0.72);\n      customPhotos[photoTarget] = dataUrl;\n      if(!saveJSON(PHOTOS_KEY, customPhotos)){\n        delete customPhotos[photoTarget];\n      }\n    }catch(e){\n      alert('這張照片無法讀取，請換一張試試（建議使用 JPG 或 PNG）。');\n    }\n    photoTarget = null;\n    renderPhotoEditor();\n    render();\n  });\n\n  document.getElementById('openPhotoEditorBtn').addEventListener('click', ()=>{\n    renderPhotoEditor();\n    startMenu.classList.remove('show');\n    photoEditor.classList.add('show');\n    photoEditor.scrollTop = 0;\n  });\n  document.getElementById('closePhotoEditorBtn').addEventListener('click', ()=>{\n    photoEditor.classList.remove('show');\n    startMenu.classList.add('show');\n  });\n\n  // 獎勵文字編輯（輸入即存）\n  function renderRewardEditor(){\n    rewardEditorList.innerHTML = '';\n    REWARD_VALUES.forEach(v=>{\n      const row = document.createElement('div');\n      row.className = 'editor-row';\n      const val = document.createElement('div');\n      val.className = 'val';\n      val.textContent = v;\n      const input = document.createElement('input');\n      input.type = 'text';\n      input.maxLength = 60;\n      input.placeholder = `🎉 達成 ${v} 成就！`;\n      input.value = rewards[v] || '';\n      input.addEventListener('input', ()=>{\n        const t = input.value.trim();\n        if(t) rewards[v] = t; else delete rewards[v];\n        saveJSON(REWARDS_KEY, rewards);\n        renderRewardList();\n      });\n      row.appendChild(val); row.appendChild(input);\n      rewardEditorList.appendChild(row);\n    });\n  }\n  document.getElementById('openRewardEditorBtn').addEventListener('click', ()=>{\n    renderRewardEditor();\n    startMenu.classList.remove('show');\n    rewardEditor.classList.add('show');\n    rewardEditor.scrollTop = 0;\n  });\n  document.getElementById('closeRewardEditorBtn').addEventListener('click', ()=>{\n    rewardEditor.classList.remove('show');\n    startMenu.classList.add('show');\n  });\n\n  // ---- 大廳串接 ----\n  document.getElementById('menuLeaderBtn').addEventListener('click', ()=> leaderboardBtn.click());\n  document.getElementById('menuRewardBtn').addEventListener('click', ()=> menuBtn.click());\n  let inHub = false;\n  try{ inHub = window.parent !== window; }catch(e){}\n  if(inHub){\n    const hb = document.getElementById('hubHomeBtn');\n    hb.style.display = '';\n    hb.addEventListener('click', ()=>{ try{ window.parent.postMessage({hub:'home'}, '*'); }catch(e){} });\n  }\n\n  // ---- init ----\n  best = loadBest();\n  bestEl.textContent = best;\n  newGame();\n  startMenu.classList.add('show');\n})();\n<\/script>\n<\/body>\n<\/html>\n", "checkers": "<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>跳棋<\/title>\n<style>\n  :root {\n    --bg: #1f2430; --panel: #2a3040; --text: #eef1f6; --muted: #9aa4b8; --accent: #4f8cff;\n    --light: #f0d9b5; --dark: #b58863;\n    --c0: #f7f4ee; --c1: #1b1b1f; --c2: #d9382f;\n    --bs: 360px;\n  }\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }\n  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, \"PingFang TC\", \"Noto Sans TC\", \"Microsoft JhengHei\", sans-serif; overscroll-behavior: none; }\n  body { min-height: 100vh; min-height: 100dvh; }\n  #app { display: flex; flex-direction: column; align-items: center; padding: 8px 10px 14px; gap: 6px; }\n  #app.land { flex-direction: row; justify-content: center; align-items: flex-start; gap: 18px; padding-top: 10px; }\n  #main { width: var(--bs); }\n  #side { display: flex; flex-direction: column; align-items: center; width: var(--bs); }\n  #app.land #side { width: 340px; }\n  h1 { font-size: 20px; margin: 4px 0 6px; letter-spacing: .12em; }\n  #status { font-size: 17px; font-weight: 600; padding: 8
