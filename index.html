<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>像素對決 FPS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated}
.hud{position:fixed;pointer-events:none;display:none}
body.playing .hud{display:block}
#dmg{left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 35%,rgba(255,0,0,.75) 100%);opacity:0}
#fl{left:0;top:0;right:0;bottom:0;background:#fff;opacity:0}
#scope{left:0;top:0;right:0;bottom:0;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 36vmin,#000 36.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000}
#scope:before{left:0;right:0;top:50%;height:2px;margin-top:-1px}
#scope:after{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
#cross{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}
#cross:after{top:10px;left:0;height:2px;width:22px}
#hitm{left:50%;top:50%;font-size:30px;font-weight:bold;transform:translate(-50%,-50%);opacity:0;color:#fff;text-shadow:0 0 4px #000}
#score{left:50%;top:10px;transform:translateX(-50%);font-size:20px;font-weight:bold;background:rgba(0,0,0,.45);padding:6px 16px;border-radius:8px;text-align:center;white-space:nowrap}
#score small{display:block;font-size:11px;font-weight:normal;opacity:.7}
#radar{left:12px;top:12px;border:2px solid #8aa0c0;border-radius:6px;image-rendering:pixelated}
#hp{left:16px;bottom:16px;width:170px}
#hpbar{height:16px;background:rgba(0,0,0,.55);border:2px solid #fff;border-radius:4px;overflow:hidden}
#hpfill{height:100%;width:100%;background:#4cd964}
#hptxt{font-size:22px;font-weight:bold;text-shadow:0 0 4px #000}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:flex-end;gap:10px;z-index:9}
body.playing #bar{display:flex}
#ammoBox{min-width:96px;text-align:left;text-shadow:0 0 4px #000;pointer-events:none}
#amMag{font-size:40px;font-weight:bold;line-height:1;display:inline-block}
#amRes{font-size:18px;opacity:.85;display:inline-block;margin-left:4px}
#wName{font-size:14px;font-weight:bold;margin-top:2px;opacity:.95;white-space:nowrap}
#slots{display:flex;gap:6px}
.slot{width:88px;height:62px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(18,22,40,.6);padding:4px 6px;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.slot.on{border-color:#ffb347;background:rgba(60,45,20,.75);box-shadow:0 0 8px rgba(255,179,71,.6)}
.slot b{position:absolute;left:6px;top:3px;font-size:12px;opacity:.8}
.slot span{font-size:13px;font-weight:bold;line-height:1.15}
.slot i{font-style:normal;font-size:11px;opacity:.8}
#msg{left:0;right:0;top:24%;text-align:center;font-size:30px;font-weight:bold;text-shadow:0 2px 6px #000;opacity:0}
#pauseBtn{display:none;position:fixed;right:12px;top:12px;width:46px;height:46px;border-radius:10px;border:2px solid #fff;background:rgba(0,0,0,.45);color:#fff;font-size:20px;z-index:10;pointer-events:auto}
body.playing #pauseBtn{display:block}
#touchUI{display:none}
body.touch.playing #touchUI{display:block}
.tbtn{position:fixed;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;z-index:9}
#fireBtn{right:30px;bottom:30px;width:104px;height:104px;font-size:20px;background:rgba(230,70,50,.45)}
#reloadBtn{right:152px;bottom:42px;width:68px;height:68px;font-size:14px}
#aimBtn{right:50px;bottom:150px;width:68px;height:68px;font-size:14px}
#joyBase{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);display:none;pointer-events:none;z-index:8}
#joyKnob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,8,20,.86);display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px;z-index:20}
.ov .inner{margin:auto;text-align:center}
.ov h1{font-size:46px;margin:0 0 6px;letter-spacing:4px;color:#ffb347;text-shadow:3px 3px 0 #8a2b10}
.ov h2{font-size:32px;margin:0 0 4px;color:#ffb347;text-shadow:2px 2px 0 #8a2b10}
.ov p{margin:4px 0 12px;opacity:.9}
.btn{font-size:20px;font-weight:bold;color:#fff;background:#e67e22;border:3px solid #fff;border-radius:6px;padding:10px 30px;margin:6px;box-shadow:0 4px 0 #8a4a10}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a10}
.opt{font-size:15px;color:#fff;background:#2c3a55;border:2px solid #6c7fa6;border-radius:6px;padding:7px 14px;margin:3px}
.opt.on{background:#3d8bff;border-color:#fff}
#ovHelp{max-width:560px;font-size:13px;line-height:1.7;opacity:.75;margin:12px auto 0}
.row{margin:4px 0}
#loGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:980px;margin:0 auto 8px}
.lcol{width:218px;background:rgba(30,40,70,.7);border:2px solid #44557d;border-radius:10px;padding:8px}
.lcol h3{margin:0 0 6px;font-size:16px;color:#ffd08a}
.wopt{display:block;width:100%;text-align:left;color:#fff;background:#2c3a55;border:2px solid #52638c;border-radius:8px;padding:7px 9px;margin:5px 0;font-size:15px}
.wopt small{display:block;font-size:11px;opacity:.75;margin-top:2px;font-weight:normal}
.wopt b{font-size:15px}
.wopt.on{background:#e67e22;border-color:#fff}
@media (max-width:760px){.slot{width:64px;height:54px}.slot span{font-size:11px}#amMag{font-size:30px}#ammoBox{min-width:70px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="dmg" class="hud"></div>
<div id="fl" class="hud"></div>
<div id="scope" class="hud"></div>
<div id="cross" class="hud"></div>
<div id="hitm" class="hud">✕</div>
<canvas id="radar" class="hud" width="140" height="100"></canvas>
<div id="score" class="hud">你 <span id="sMe">0</span> : <span id="sBot">0</span> 對手<small>先擊倒 5 次獲勝</small></div>
<div id="hp" class="hud"><div id="hpbar"><div id="hpfill"></div></div><div id="hptxt">100</div></div>
<div id="msg" class="hud"></div>
<div id="bar">
  <div id="ammoBox"><span id="amMag">30</span><span id="amRes">/ 90</span><div id="wName">突擊步槍</div></div>
  <div id="slots"></div>
</div>
<button id="pauseBtn">⏸</button>
<div id="touchUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="fireBtn" class="tbtn">射擊</div>
  <div id="reloadBtn" class="tbtn">換彈</div>
  <div id="aimBtn" class="tbtn">瞄準</div>
</div>

<div id="overlay" class="ov"><div class="inner">
  <h1 id="ovTitle">像素對決</h1>
  <p id="ovSub"></p>
  <div id="opts">
    <div class="row">對手難度：
      <button class="opt" data-d="easy">簡單</button><button class="opt on" data-d="normal">普通</button><button class="opt" data-d="hard">困難</button>
    </div>
    <div class="row">畫面：
      <button class="opt on" data-p="3">粗像素</button><button class="opt" data-p="2">細像素</button>
    </div>
  </div>
  <div>
    <button class="btn" id="btnStart">開始遊戲</button>
    <button class="btn" id="btnRestart" style="display:none">重新開始</button>
  </div>
  <div id="ovHelp">
    鍵盤滑鼠：WASD 移動、滑鼠瞄準、左鍵或空白鍵射擊、右鍵瞄準、R 換彈、1~4 或滾輪換武器、Q 切回上一把、Shift 加速、方向鍵轉視角、Esc 暫停<br>
    觸控：左半邊搖桿移動、右半邊滑動轉視角、按鈕射擊/換彈/瞄準、點下方欄位換武器<br>
    綠色十字是補給箱（補血＋補彈藥）。第 4 格投擲物：手榴彈爆炸傷害、閃光彈致盲、煙霧彈遮擋對手視線
  </div>
</div></div>

<div id="loadoutOv" class="ov" style="display:none"><div class="inner">
  <h2>選擇裝備</h2>
  <p id="loSub"></p>
  <div id="loGrid"></div>
  <button class="btn" id="btnGo">出戰</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- 地圖：長方形競技場（180 度旋轉對稱），'1' 牆、'a' 拱門（可通行，上方有橫樑） ---------- */
var GW=28,GH=20,CELL=4,WALLH=4.2,LINTEL=2.8,GOAL=5;
var MAP=[];
(function(){
  var g=[],x,z;
  for(z=0;z<GH;z++){g.push([]);for(x=0;x<GW;x++)g[z].push((x===0||z===0||x===GW-1||z===GH-1)?'1':'0');}
  function put(px,pz,w,h,c){for(var j=pz;j<pz+h;j++)for(var i=px;i<px+w;i++)if(i>0&&j>0&&i<GW-1&&j<GH-1)g[j][i]=c;}
  var blocks=[[4,3,3,1],[4,4,1,2],[9,2,1,4],[13,3,3,1],[3,8,2,2],[7,7,3,1],[6,8,1,2],[17,5,1,3],[19,2,2,2],[22,5,3,1],[23,3,1,2],[19,8,3,1],[12,8,4,4],[11,6,2,1],[1,6,2,1]];
  var arches=[[12,9,4,2],[20,8,1,1],[5,3,1,1]];
  blocks.forEach(function(b){put(b[0],b[1],b[2],b[3],'1');put(GW-b[0]-b[2],GH-b[1]-b[3],b[2],b[3],'1');});
  arches.forEach(function(b){put(b[0],b[1],b[2],b[3],'a');put(GW-b[0]-b[2],GH-b[1]-b[3],b[2],b[3],'a');});
  for(z=0;z<GH;z++)MAP.push(g[z].join(''));
})();

/* ---------- 武器資料 ---------- */
var SLOT_NAMES=['主武器','副武器','近戰','投擲物'];
var W={
  ar:{slot:0,name:'突擊步槍',desc:'連射穩定，全能型',dmg:24,head:2,rate:.095,auto:true,mag:30,res:90,reload:1.7,spread:.012},
  smg:{slot:0,name:'衝鋒槍',desc:'射速最快，近中距離',dmg:15,head:1.8,rate:.06,auto:true,mag:35,res:105,reload:1.5,spread:.022},
  shotgun:{slot:0,name:'散彈槍',desc:'近距離爆發力強',dmg:12,pellets:8,head:1.5,rate:.9,auto:false,mag:6,res:24,reload:2.3,spread:.065,falloff:true},
  sniper:{slot:0,name:'狙擊槍',desc:'一槍重傷，可開鏡',dmg:85,head:2,rate:1.25,auto:false,mag:5,res:15,reload:2.6,spread:.004,zoom:3.2},
  pistol:{slot:1,name:'手槍',desc:'穩定準確',dmg:20,head:2,rate:.2,auto:false,mag:15,res:60,reload:1.2,spread:.01},
  revolver:{slot:1,name:'左輪手槍',desc:'威力大，射速慢',dmg:55,head:2,rate:.6,auto:false,mag:6,res:30,reload:2.1,spread:.006},
  mpistol:{slot:1,name:'衝鋒手槍',desc:'可連射的小槍',dmg:11,head:1.8,rate:.07,auto:true,mag:20,res:80,reload:1.3,spread:.03},
  knife:{slot:2,type:'melee',name:'小刀',desc:'傷害中等，揮得快',dmg:55,rate:.5,range:2.8},
  knuckle:{slot:2,type:'melee',name:'拳套',desc:'出拳最快，傷害低',dmg:28,rate:.28,range:2.4},
  axe:{slot:2,type:'melee',name:'斧頭',desc:'一擊重傷，揮得慢',dmg:85,rate:1.0,range:3.0},
  frag:{slot:3,type:'throw',name:'手榴彈',desc:'爆炸傷害，會彈跳',count:2,fuse:2.2,color:0x3b6b2e},
  flash:{slot:3,type:'throw',name:'閃光彈',desc:'讓看到的人致盲',count:2,fuse:1.5,color:0xeeeeee},
  smoke:{slot:3,type:'throw',name:'煙霧彈',desc:'遮擋視線約 9 秒',count:2,fuse:1.2,color:0x7a8794}
};
Object.keys(W).forEach(function(k){if(!W[k].type)W[k].type='gun';});

var DIFF={
  easy:{react:.9,acc:.32,dmg:8,speed:4.6,interval:.75},
  normal:{react:.55,acc:.5,dmg:10,speed:5.6,interval:.5},
  hard:{react:.3,acc:.68,dmg:12,speed:6.6,interval:.38}
};
var diffKey='normal',PIX=3;
var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(isTouch)document.body.classList.add('touch');

function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rnd(a,b){return a+Math.random()*(b-a);}
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function solid(cx,cz){if(cx<0||cz<0||cx>=GW||cz>=GH)return true;return MAP[cz].charAt(cx)==='1';}
function archCell(cx,cz){if(cx<0||cz<0||cx>=GW||cz>=GH)return false;return MAP[cz].charAt(cx)==='a';}
function solidAt(x,z){return solid(Math.floor(x/CELL),Math.floor(z/CELL));}
function solid3(x,y,z){var cx=Math.floor(x/CELL),cz=Math.floor(z/CELL);return solid(cx,cz)||(y>LINTEL&&archCell(cx,cz));}
function cellCenter(cx,cz){return {x:(cx+.5)*CELL,z:(cz+.5)*CELL};}
function cellOf(x,z){return [Math.floor(x/CELL),Math.floor(z/CELL)];}
function canStand(x,z,r){return !solidAt(x-r,z-r)&&!solidAt(x+r,z-r)&&!solidAt(x-r,z+r)&&!solidAt(x+r,z+r);}
function moveEntity(e,dx,dz,r){if(canStand(e.x+dx,e.z,r))e.x+=dx;if(canStand(e.x,e.z+dz,r))e.z+=dz;}
function wallDist(ox,oz,dx,dz,maxD){for(var d=0;d<maxD;d+=.1){if(solidAt(ox+dx*d,oz+dz*d))return d;}return maxD;}
function los(ax,az,bx,bz){var dx=bx-ax,dz=bz-az,d=Math.sqrt(dx*dx+dz*dz);if(d<.01)return true;return wallDist(ax,az,dx/d,dz/d,d)>=d-.05;}
function bfs(sx,sz,tx,tz){
  var key=function(x,z){return z*GW+x;};
  var prev={},q=[[sx,sz]],dirs=[[1,0],[-1,0],[0,1],[0,-1]],k,j,c;
  prev[key(sx,sz)]=-1;
  for(k=0;k<q.length;k++){
    c=q[k];
    if(c[0]===tx&&c[1]===tz)break;
    for(j=0;j<4;j++){
      var nx=c[0]+dirs[j][0],nz=c[1]+dirs[j][1];
      if(solid(nx,nz)||prev[key(nx,nz)]!==undefined)continue;
      prev[key(nx,nz)]=key(c[0],c[1]);
      q.push([nx,nz]);
    }
  }
  if(prev[key(tx,tz)]===undefined)return [];
  var path=[],cur=key(tx,tz),start=key(sx,sz);
  while(cur!==start&&cur!==-1){path.push([cur%GW,Math.floor(cur/GW)]);cur=prev[cur];}
  path.reverse();
  return path;
}
function randFloor(){var cx,cz;do{cx=Math.floor(rnd(1,GW-1));cz=Math.floor(rnd(1,GH-1));}while(solid(cx,cz));return cellCenter(cx,cz);}

/* ---------- Three.js 場景 ---------- */
var canvas=$('game');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
var scene=new THREE.Scene();
var SKY=0xcfd9e6;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,70,230);
var camera=new THREE.PerspectiveCamera(75,1.5,.1,400);
camera.rotation.order='YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff,.78));
var sun=new THREE.DirectionalLight(0xffffff,.55);
sun.position.set(30,60,20);
scene.add(sun);
var muzzleLight=new THREE.PointLight(0xffaa44,0,10);
muzzleLight.position.set(0,0,-1);
camera.add(muzzleLight);

function resize(){
  var w=Math.max(160,Math.floor(window.innerWidth/PIX)),h=Math.max(120,Math.floor(window.innerHeight/PIX));
  renderer.setPixelRatio(1);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

function makeTex(size,fn,rx,ry){
  var c=document.createElement('canvas');c.width=c.height=size;
  var g=c.getContext('2d');fn(g,size);
  var t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(rx)t.repeat.set(rx,ry);
  return t;
}
function noise(g,size,amt){
  for(var y=0;y<size;y++)for(var x=0;x<size;x++){
    var v=rnd(-amt,amt);
    g.fillStyle=v>0?'rgba(255,255,255,'+(v/255)+')':'rgba(0,0,0,'+(-v/255)+')';
    g.fillRect(x,y,1,1);
  }
}
var wallTex=makeTex(32,function(g,s){
  g.fillStyle='#9ca2a9';g.fillRect(0,0,s,s);
  noise(g,s,14);
  g.fillStyle='#6f7882';
  g.fillRect(0,0,s,1);g.fillRect(0,s-1,s,1);g.fillRect(0,0,1,s);g.fillRect(s-1,0,1,s);
});
var floorTex=makeTex(16,function(g,s){
  g.fillStyle='#d7dde4';g.fillRect(0,0,s,s);
  noise(g,s,8);
  g.fillStyle='#c0c8d2';
  g.fillRect(0,0,s,1);g.fillRect(0,0,1,s);
},GW*2,GH*2);
var groundTex=makeTex(16,function(g,s){
  g.fillStyle='#e8eef4';g.fillRect(0,0,s,s);
  g.fillStyle='#d4dde7';g.fillRect(0,0,s,1);g.fillRect(0,0,1,s);
},160,160);

var floor=new THREE.Mesh(new THREE.PlaneGeometry(GW*CELL,GH*CELL),new THREE.MeshLambertMaterial({map:floorTex}));
floor.rotation.x=-Math.PI/2;floor.position.set(GW*CELL/2,0,GH*CELL/2);scene.add(floor);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshLambertMaterial({map:groundTex}));
ground.rotation.x=-Math.PI/2;ground.position.set(GW*CELL/2,-.05,GH*CELL/2);scene.add(ground);

var wallN=0,archN=0,zz,xx;
for(zz=0;zz<GH;zz++)for(xx=0;xx<GW;xx++){if(solid(xx,zz))wallN++;else if(archCell(xx,zz))archN++;}
var wallMat=new THREE.MeshLambertMaterial({map:wallTex});
var wallMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,WALLH,CELL),wallMat,wallN);
var lintelMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,WALLH-LINTEL,CELL),wallMat,Math.max(1,archN));
var mtx=new THREE.Matrix4(),wi=0,li=0;
for(zz=0;zz<GH;zz++)for(xx=0;xx<GW;xx++){
  if(solid(xx,zz)){mtx.setPosition((xx+.5)*CELL,WALLH/2,(zz+.5)*CELL);wallMesh.setMatrixAt(wi++,mtx);}
  else if(archCell(xx,zz)){mtx.setPosition((xx+.5)*CELL,LINTEL+(WALLH-LINTEL)/2,(zz+.5)*CELL);lintelMesh.setMatrixAt(li++,mtx);}
}
wallMesh.instanceMatrix.needsUpdate=true;lintelMesh.instanceMatrix.needsUpdate=true;
wallMesh.frustumCulled=false;lintelMesh.frustumCulled=false;
scene.add(wallMesh);scene.add(lintelMesh);

/* ---------- 武器外觀（第一人稱） ---------- */
function vmBox(g,w,h,d,color,x,y,z){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:color}));
  m.material.depthTest=false;m.renderOrder=10;m.position.set(x,y,z);g.add(m);return m;

  var a=audio();if(!a)return;
  var n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0),k;
  for(k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/n,2.5);
  var s=a.createBufferSource();s.buffer=buf;
  var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  var g=a.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}
function tone(f0,f1,dur,vol,type,delay){
  var a=audio();if(!a)return;
  var t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t0);

  g.gain.setValueAtTime(vol,t0);

  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.02);
}

function castRay(origin,dir,maxD,target){
  var hl=Math.sqrt(dir.x*dir.x+dir.z*dir.z),tWall=maxD;
  if(hl>1e-4){tWall=Math.min(maxD,wallDist(origin.x,origin.z,dir.x/hl,dir.z/hl,maxD*hl)/hl);}
  var tFloor=dir.y<-1e-4?origin.y/(-dir.y):Infinity;
  var tEnv=Math.min(tWall,tFloor);
  var res={t:tEnv,hit:false,head:false,env:tEnv<maxD};
  if(target&&target.alive){
    rc.set(origin,dir);rc.near=0;rc.far=tEnv;
    target.group.updateMatrixWorld(true);
    var hits=rc.intersectObjects(target.group.children,false);
    if(hits.length){res.t=hits[0].distance;res.hit=true;res.head=hits[0].object.name==='head';}
  }
  return res;
}

    var g=new THREE.Group();
    for(var i=0;i<9;i++){
      var m=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,2.4),new THREE.MeshBasicMaterial({color:0xd4d9de,transparent:true,opacity:.95,depthWrite:false}));
      m.position.set(rnd(-1.8,1.8),rnd(.6,2.8),rnd(-1.8,1.8));m.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
      g.add(m);
    }
    g.position.set(px,0,pz);g.scale.setScalar(.2);scene.add(g);
    smokes.push({x:px,z:pz,t:9,age:0,g:g});
  }
}
function updateSmokes(dt){
  for(var k=smokes.length-1;k>=0;k--){
    var s=smokes[k];s.t-=dt;s.age+=dt;
    s.g.scale.setScalar(Math.min(1,.2+s.age*1.6));
    s.g.rotation.y+=dt*.2;
    var op=s.t<1.5?Math.max(0,s.t/1.5)*.95:.95;
    s.g.children.forEach(function(m){m.material.opacity=op;});
    if(s.t<=0){
      scene.remove(s.g);
      s.g.children.forEach(function(m){m.geometry.dispose();m.material.dispose();});
      smokes.splice(k,1);
    }
  }
}
function smokeBlocks(ax,az,bx,bz){
  var dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
  for(var k=0;k<smokes.length;k++){
    var s=smokes[k];
    if(s.age<.4)continue;
    var u=l2>0?clamp(((s.x-ax)*dx+(s.z-az)*dz)/l2,0,1):0;
    if(Math.hypot(ax+dx*u-s.x,az+dz*u-s.z)<3.2)return true;
  }
  return false;
}

function damageBot(d,head,how){

function botShoot(dist){
  var D=DIFF[diffKey];
  var p=D.acc*clamp(1.15-dist/45,.3,1)*(player.moving?.75:1);
  var hit=Math.random()<p&&player.inv<=0;
  var from=new THREE.Vector3(bot.x-Math.sin(bot.yaw)*.6,1.3,bot.z-Math.cos(bot.yaw)*.6);
  var to=new THREE.Vector3(player.x,1.5,player.z);
  if(!hit){to.x+=rnd(-1.6,1.6);to.z+=rnd(-1.6,1.6);to.y+=rnd(-.8,.8);}
  var dir=to.clone().sub(from).normalize();
  var end=from.clone().add(dir.multiplyScalar(dist+(hit?0:6)));
  addTracer(from,end,0xff6644);
  sfx.shot(clamp(1-dist/40,.15,1)*.7);
  if(hit)hurtPlayer(D.dmg);
}

/* ---------- 對手 AI ---------- */
function botMove(b,dt,tx,tz,speed){
  b.pathT-=dt;
  if(!b.path||b.pathT<=0){
    var s=cellOf(b.x,b.z),t=cellOf(tx,tz);
    b.path=bfs(s[0],s[1],t[0],t[1]);b.pathT=.45;
  }
  while(b.path.length){
    var c=cellCenter(b.path[0][0],b.path[0][1]);
    if(Math.hypot(c.x-b.x,c.z-b.z)<.9)b.path.shift();else break;
  }
  if(!b.path.length)return false;
  var w=cellCenter(b.path[0][0],b.path[0][1]),dx=w.x-b.x,dz=w.z-b.z,d=Math.hypot(dx,dz);
  if(d<.001)return true;
  b.targetYaw=Math.atan2(-dx,-dz);
  moveEntity(b,dx/d*speed*dt,dz/d*speed*dt,.45);
  return true;
}
function updateBot(dt){
  var b=bot;
  if(!b.alive){
    b.deadT+=dt;
    b.group.rotation.x=Math.min(1,b.deadT/.5)*Math.PI/2;
    b.group.position.set(b.x,0,b.z);
    if(b.deadT>2.6&&state!=='over')spawnBot();
    return;
  }
  if(state==='over')return;
  var D=DIFF[diffKey];
  var dx=player.x-b.x,dz=player.z-b.z,dist=Math.sqrt(dx*dx+dz*dz);
  if(b.blind>0)b.blind-=dt;
  var see=state==='play'&&b.blind<=0&&dist<50&&los(b.x,b.z,player.x,player.z)&&!smokeBlocks(b.x,b.z,player.x,player.z);
  if(see){b.alert=7;b.aim+=dt;}else{b.aim=Math.max(0,b.aim-dt*2);b.alert-=dt;}
  b.cool-=dt;b.strafeT-=dt;
  if(b.strafeT<=0){b.strafeT=rnd(.8,2);b.strafeDir=Math.random()<.5?-1:1;}
  if(see){
    var nx=dx/Math.max(dist,.01),nz=dz/Math.max(dist,.01),mx=0,mz=0;
    if(dist>11){mx=nx;mz=nz;}else if(dist<5){mx=-nx;mz=-nz;}
    mx+=-nz*b.strafeDir*.9;mz+=nx*b.strafeDir*.9;
    var ml=Math.hypot(mx,mz);
    if(ml>.01){moveEntity(b,mx/ml*D.speed*.8*dt,mz/ml*D.speed*.8*dt,.45);}
    b.targetYaw=Math.atan2(-dx,-dz);
    b.path=null;
  }else if(b.alert>0&&state==='play'&&b.blind<=0){
    botMove(b,dt,player.x,player.z,D.speed);
  }else{
    if(!b.wt||Math.hypot(b.wt.x-b.x,b.wt.z-b.z)<1.5){b.wt=randFloor();b.path=null;}
    if(!botMove(b,dt,b.wt.x,b.wt.z,D.speed*(b.blind>0?.45:.7)))b.wt=null;
  }
  b.yaw+=angDiff(b.yaw,b.targetYaw)*Math.min(1,dt*9);
  if(see&&b.cool<=0&&b.aim>D.react&&Math.abs(angDiff(b.yaw,b.targetYaw))<.3){
    botShoot(dist);b.cool=D.interval*rnd(.9,1.3);
  }
  if(b.hurtT>0)b.hurtT-=dt;
  var fl=b.hurtT>0;
  if(fl!==b.flashOn){b.flashOn=fl;b.mats.forEach(function(m){m.emissive.setHex(fl?0x992211:0x000000);});}
  b.group.rotation.set(0,b.yaw,0);
  b.group.position.set(b.x,0,b.z);
}
function spawnBot(){
  var s=pickSpawn(player.x,player.z);
  bot.x=s.x;bot.z=s.z;bot.hp=100;bot.alive=true;bot.alert=0;bot.aim=0;bot.cool=1;bot.blind=0;
  bot.path=null;bot.pathT=0;bot.wt=null;bot.deadT=0;bot.hurtT=0;bot.yaw=rnd(0,6.28);bot.targetYaw=bot.yaw;
  bot.group.rotation.set(0,bot.yaw,0);bot.group.position.set(bot.x,0,bot.z);bot.group.visible=true;
}
function spawnPlayer(){
  var s=pickSpawn(bot.x,bot.z);
  player.x=s.x;player.z=s.z;player.hp=100;player.reload=0;player.cool=.2;player.inv=1.5;player.swap=.3;player.afterThrow=0;
  blindT=0;aiming=false;swing=0;prevFire=true;

}

/* ---------- 更新 ---------- */
function updatePlayer(dt){
  var s;
  if(state==='play'){
    if(keys.ArrowLeft)yaw+=2.4*dt;
    if(keys.ArrowRight)yaw-=2.4*dt;
    if(keys.ArrowUp)pitch+=1.8*dt;
    if(keys.ArrowDown)pitch-=1.8*dt;
    pitch=clamp(pitch,-1.4,1.4);
    var f=(keys.KeyW?1:0)-(keys.KeyS?1:0);
    s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
    f+=-joy.y;s+=joy.x;
    var l=Math.sqrt(f*f+s*s);
    if(l>1){f/=l;s/=l;l=1;}
    var sp=((keys.ShiftLeft||keys.ShiftRight)?9:6.5)*(aiming?.6:1);
    var dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp*dt;
    moveEntity(player,dx,dz,.45);
    player.moving=l>.1;
    if(player.moving)player.bob+=dt*sp*1.3;
    player.cool-=dt;
    if(player.swap>0)player.swap-=dt;
    if(player.reload>0){player.reload-=dt;if(player.reload<=0)finishReload();}
    if(player.inv>0)player.inv-=dt;
    var want=fireMouse||keys.Space||keys.KeyF||fireTouch;
    var w=curW();
    if(want&&(w.auto||w.type==='melee'||!prevFire))fireWeapon();
    prevFire=want;
    if(player.afterThrow>0){player.afterThrow-=dt;if(player.afterThrow<=0&&cur===3)selectSlot(prevSlot===3?0:prevSlot);}
  }else if(state==='dead'){
    player.moving=false;
    deadT+=dt;
    if(deadT>2.4)openLoadout();
  }
  if(bot.alive&&(state==='play'||state==='dead')){
    var ddx=player.x-bot.x,ddz=player.z-bot.z,d=Math.sqrt(ddx*ddx+ddz*ddz);
    if(d<.9&&d>.001){
      var push=(.9-d)*.5;
      moveEntity(player,ddx/d*push,ddz/d*push,.45);
      moveEntity(bot,-ddx/d*push,-ddz/d*push,.45);
    }
  }
}
function updatePacks(dt){
  packs.forEach(function(p){
    if(p.t>0){p.t-=dt;if(p.t<=0)p.g.visible=true;return;}
    p.g.rotation.y+=dt*2;
    p.g.position.y=.8+Math.sin(T*3+p.x)*.12;
    if(state==='play'&&Math.hypot(player.x-p.x,player.z-p.z)<1.3&&needsSupply()){
      giveSupply();p.g.visible=false;p.t=15;sfx.pick();showMsg('補給完成','#7CFC8A',.8);
    }else if(bot.alive&&bot.hp<100&&Math.hypot(bot.x-p.x,bot.z-p.z)<1.3){
      bot.hp=Math.min(100,bot.hp+40);p.g.visible=false;p.t=15;
    }
  });
}
function applyCamera(dt){
  var y=1.7+(player.moving?Math.sin(player.bob*1.4)*.06:0),roll=0,pit=pitch,yw=yaw;
  if(state==='dead'||(state==='over'&&player.hp<=0)){deadK=Math.min(1,deadK+dt*2);y=1.7-1.2*deadK;roll=.7*deadK;}
  if(shakeT>0){shakeT-=dt;var k=Math.max(0,shakeT)*.12;pit+=rnd(-k,k);yw+=rnd(-k,k);}
  camera.position.set(player.x,y,player.z);
  camera.rotation.set(pit,yw,roll);
  var w=inv.length?curW():null;
  var target=(aiming&&w&&w.type==='gun')?75/(w.zoom||1.35):75;
  if(Math.abs(camera.fov-target)>.05){
    camera.fov+=(target-camera.fov)*Math.min(1,dt*14);

  }
}
function updateGun(dt){
  kick=Math.max(0,kick-dt*9);
  swing=Math.max(0,swing-dt*4);
  if(!inv.length)return;
  var vm=vms[cur];if(!vm)return;
  var w=curW(),b=vm.userData.base;
  var scoped=aiming&&w.type==='gun'&&w.zoom&&camera.fov<45;
  vm.visible=!scoped&&state!=='dead'&&state!=='over';
  var swapO=Math.max(0,player.swap)/.28*.3;
  var bobY=player.moving?Math.abs(Math.sin(player.bob*1.4))*.015:0;
  var bobX=player.moving?Math.sin(player.bob*1.4)*.01:0;
  if(w.type==='gun'){
    var rl=player.reload>0?Math.sin((1-player.reload/w.reload)*Math.PI):0;
    var ax=aiming?-.2:0,ay=aiming?.07:0;
    vm.position.set(b[0]+ax+bobX*(aiming?.2:1),b[1]+ay-rl*.25-bobY*(aiming?.2:1)-swapO,b[2]+kick*.07);
    vm.rotation.set(kick*.12+rl*.6,0,0);
    var fl=vm.userData.flash;if(fl)fl.visible=flashT>0;
  }else if(w.type==='melee'){
    vm.position.set(b[0]-swing*.3+bobX,b[1]-bobY-swapO,b[2]-swing*.25);
    vm.rotation.set(-swing*.5,0,-swing*1.1);
  }else{
    vm.position.set(b[0]+bobX,b[1]+swing*.15-bobY-swapO,b[2]-swing*.2);
    vm.rotation.set(swing*1.0,0,0);
  }
  if(flashT>0)flashT-=dt;
  muzzleLight.intensity=(flashT>0&&w.type==='gun')?2:0;
}
var cache={hp:-1,sig:''};
function updateHud(dt){
  if(player.hp!==cache.hp){
    cache.hp=player.hp;
    $('hpfill').style.width=player.hp+'%';
    $('hpfill').style.background=player.hp>60?'#4cd964':(player.hp>30?'#ffcc00':'#ff3b30');
    $('hptxt').textContent=Math.ceil(player.hp);
  }
  if(inv.length){
    var w=curW(),it=inv[cur],rl=player.reload>0;
    var sig=cur+'|'+rl+'|'+inv.map(function(x){return x.id+(x.mag!==undefined?x.mag+'/'+x.res:(x.count!==undefined?x.count:''));}).join(',');
    if(sig!==cache.sig){
      cache.sig=sig;
      $('wName').textContent=w.name;
      if(w.type==='gun'){$('amMag').textContent=rl?'換彈':it.mag;$('amRes').textContent=rl?'':'/ '+it.res;}
      else if(w.type==='throw'){$('amMag').textContent=it.count;$('amRes').textContent='';}
      else{$('amMag').textContent='—';$('amRes').textContent='';}
      for(var s=0;s<4;s++){
        var x=inv[s],ww=W[x.id],el=slotEls[s];
        el.className='slot'+(s===cur?' on':'');
        el.children[1].textContent=ww.name;
        el.children[2].textContent=ww.type==='gun'?x.mag+' / '+x.res:(ww.type==='throw'?'×'+x.count:'');
      }
    }
    $('aimBtn').style.opacity=w.type==='gun'?(aiming?1:.7):.25;
    var scoped=aiming&&w.type==='gun'&&w.zoom&&camera.fov<45;
    $('scope').style.opacity=scoped?1:0;
    $('cross').style.opacity=scoped?0:1;
  }
  dmgA=Math.max(0,dmgA-dt*1.6);$('dmg').style.opacity=dmgA;
  if(blindT>0){blindT-=dt;$('fl').style.opacity=Math.min(1,blindT/1.5);}else{$('fl').style.opacity=0;}
  if(hitT>0){hitT-=dt;$('hitm').style.opacity=1;$('hitm').style.color=hitHead?'#ff3b30':'#fff';}
  else $('hitm').style.opacity=0;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
}
var radar=$('radar'),rg=radar.getContext('2d'),RS=radar.width/GW;
var radarBase=document.createElement('canvas');
radarBase.width=radar.width;radarBase.height=radar.height;
(function(){
  var bg=radarBase.getContext('2d');
  bg.fillStyle='rgba(10,14,30,.75)';bg.fillRect(0,0,radarBase.width,radarBase.height);
  for(var z=0;z<GH;z++)for(var x=0;x<GW;x++){
    if(solid(x,z)){bg.fillStyle='#6f7b8f';bg.fillRect(x*RS,z*RS,RS,RS);}
    else if(archCell(x,z)){bg.fillStyle='#3d4a60';bg.fillRect(x*RS,z*RS,RS,RS);}
  }
})();
function drawRadar(){
  rg.drawImage(radarBase,0,0);
  packs.forEach(function(p){if(p.t<=0){rg.fillStyle='#4cd964';rg.fillRect(p.x/CELL*RS-2,p.z/CELL*RS-2,4,4);}});
  if(bot.alive&&(Math.hypot(bot.x-player.x,bot.z-player.z)<16||los(bot.x,bot.z,player.x,player.z))){
    rg.fillStyle='#ff4d4d';rg.beginPath();rg.arc(bot.x/CELL*RS,bot.z/CELL*RS,3.5,0,Math.PI*2);rg.fill();
  }
  rg.save();
  rg.translate(player.x/CELL*RS,player.z/CELL*RS);
  rg.rotate(Math.atan2(-Math.cos(yaw),-Math.sin(yaw)));
  rg.fillStyle='#4fc3f7';rg.beginPath();rg.moveTo(5,0);rg.lineTo(-3.5,3.5);rg.lineTo(-3.5,-3.5);rg.closePath();rg.fill();
  rg.restore();
}
function orbitCamera(){
  var a=T*.15,cx=GW*CELL/2,cz=GH*CELL/2;
  camera.position.set(cx+Math.cos(a)*64,48,cz+Math.sin(a)*48);
  camera.lookAt(cx,0,cz);
  if(camera.fov!==75){camera.fov=75;camera.updateProjectionMatrix();}
}
function update(dt){
  T+=dt;
  if(state==='menu'||state==='loadout'){
    orbitCamera();
    packs.forEach(function(p){p.g.rotation.y+=dt*2;});
    updateFx(dt);
    return;
  }
  if(state==='paused')return;
  updatePlayer(dt);
  if(state==='loadout')return;
  updateBot(dt);
  updatePacks(dt);
  updateProjs(dt);
  updateSmokes(dt);
  updateFx(dt);
  applyCamera(dt);
  updateGun(dt);
  updateHud(dt);
  radarT+=1;if(radarT%3===0)drawRadar();
}

var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!(dt>0))return;
  update(dt);
  renderer.render(scene,camera);
}

resize();
showOverlay('menu');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
