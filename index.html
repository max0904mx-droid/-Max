<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yu Chen AI — Developer & Builder</title>
<meta name="description" content="Yu Chen AI 的個人作品集 — 展示程式專案、工具與創意開發成果">
<meta property="og:title" content="Yu Chen AI — Developer & Builder">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Dancing+Script:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ════ PAWSENSE STYLES (scoped) ════ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d0e8ff}
:root{
  --bg:#d0e8ff;--s1:#b8d8f8;--s2:#c8e0fc;--s3:#a8ccf0;--s4:#98bce8;
  --bd:rgba(30,80,160,.15);--bd2:rgba(30,80,160,.08);
  --t:#0a2040;--t2:#2a4a70;--t3:#6a8aaa;--mu:#c0d8f0;
  --ac:#5b8ff9;--acs:rgba(91,143,249,.12);--acb:#3d6fe0;
  --gr:#3ecf8e;--ye:#f5a623;--re:#f26d6d;--pu:#9b8fef;
}
#paws-app { display:block; width:100%; height:100%; overflow:hidden; font-family:'Noto Serif TC',serif; -webkit-font-smoothing:antialiased; }
#paws-app .app{width:100%;max-width:430px;height:100vh;height:100svh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ── SIDEBAR ── */
.sidebar{position:absolute;top:0;left:0;bottom:0;width:272px;background:var(--s1);border-right:1px solid var(--bd);z-index:100;transform:translateX(-100%);transition:transform .28s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:99;opacity:0;pointer-events:none;transition:opacity .28s}
.sb-overlay.show{opacity:1;pointer-events:all}
.sb-top{padding:54px 14px 10px;flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:8px;padding:0 4px;margin-bottom:14px}
.sb-logo-ic{width:30px;height:30px;background:linear-gradient(135deg,var(--ac),var(--pu));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-logo-tx{font-family:'Instrument Serif',serif;font-size:17px;font-style:italic}
.sb-logo-tx em{color:var(--ac);font-style:normal}
.sb-new{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .18s;text-align:left;user-select:none}
.sb-new:hover{background:var(--s2);color:var(--t);border-color:rgba(255,255,255,.13)}
.sb-sec{padding:14px 16px 5px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3)}
.sb-list{flex:1;overflow-y:auto;padding:0 6px}
.sb-list::-webkit-scrollbar{display:none}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .14s;font-size:13px;color:var(--t2);user-select:none}
.sb-item:hover{background:var(--s2);color:var(--t)}
.sb-item.act{background:var(--s3);color:var(--t)}
.sb-item-ic{font-size:14px;flex-shrink:0}
.sb-item-tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item-del{opacity:0;font-size:15px;padding:2px 5px;background:none;border:none;color:var(--t3);cursor:pointer;flex-shrink:0;transition:opacity .14s;line-height:1}
.sb-item:hover .sb-item-del{opacity:1}
.sb-bottom{padding:10px 6px;border-top:1px solid var(--bd);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .14s}
.sb-user:hover{background:var(--s2)}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--pu));display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sb-uname{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-logout{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;padding:4px;font-family:'DM Sans',sans-serif;transition:color .18s;flex-shrink:0}
.sb-logout:hover{color:var(--re)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chat-hd{flex-shrink:0;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--bd2);background:var(--bg);backdrop-filter:blur(14px);position:relative;z-index:10}
.menu-btn{width:34px;height:34px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:background .14s;flex-shrink:0}
.menu-btn:hover{background:var(--s2)}
.menu-ic{display:flex;flex-direction:column;gap:4px;pointer-events:none}
.menu-ic span{display:block;width:17px;height:1.5px;background:var(--t2);border-radius:1px}
.hd-title{flex:1;font-size:13px;font-weight:500;color:var(--t2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-chip{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px;flex-shrink:0;user-select:none}
.mode-chip:hover{background:var(--s3);color:var(--t)}

/* ── MESSAGES ── */
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 12px;min-height:0;height:0}
.msgs::-webkit-scrollbar{width:2px}
.msgs::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px 32px;text-align:center}
.wl-logo{width:52px;height:52px;background:linear-gradient(135deg,var(--ac),var(--pu));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;box-shadow:0 6px 28px rgba(91,143,249,.28)}
.wl-title{font-family:'Instrument Serif',serif;font-size:24px;font-style:italic;margin-bottom:7px}
.wl-title em{color:var(--ac);font-style:normal}
.wl-sub{font-size:13px;color:var(--t2);line-height:1.6;max-width:260px;margin-bottom:24px}
.sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:310px}
.sg-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:13px 12px;cursor:pointer;transition:all .18s;text-align:left;user-select:none}
.sg-card:hover{background:var(--s2);border-color:rgba(91,143,249,.22);transform:translateY(-1px)}
.sg-card:active{transform:scale(.97)}
.sg-ic{font-size:18px;margin-bottom:6px}
.sg-t{font-size:12px;font-weight:600;margin-bottom:2px}
.sg-d{font-size:11px;color:var(--t2);line-height:1.4}

/* Bubbles */
.mg{padding:16px 14px 0;display:flex}
.mg.user{justify-content:flex-end}
.mg.ai{align-items:flex-start;gap:9px}
.ai-av{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--ac),var(--pu));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:3px}
.bb{font-size:14px;line-height:1.72;animation:bup .22s ease both}
@keyframes bup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.bb.user{max-width:80%;padding:11px 15px;background:var(--s2);border:1px solid var(--bd);border-radius:17px 17px 4px 17px;color:var(--t)}
.bb.ai{max-width:calc(100% - 35px);color:var(--t);padding:2px 0 0}
.bb.ai p{margin-bottom:9px;color:var(--t2)}
.bb.ai p:last-child{margin-bottom:0}
.bb.ai h3{font-family:'Instrument Serif',serif;font-size:16px;font-style:italic;margin-bottom:7px;color:var(--t)}
.bb.ai strong{color:var(--t);font-weight:600}
.bb.ai ul{list-style:none;margin:5px 0;display:flex;flex-direction:column;gap:4px}
.bb.ai ul li{padding-left:13px;position:relative;font-size:13px;line-height:1.65;color:var(--t2)}
.bb.ai ul li::before{content:'·';position:absolute;left:0;color:var(--ac);font-weight:800;font-size:16px;line-height:1.2}
.qr-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qr{background:transparent;border:1px solid var(--bd);border-radius:18px;padding:6px 12px;font-size:12px;color:var(--t2);cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;user-select:none}
.qr:hover{border-color:var(--ac);color:var(--ac);background:var(--acs)}
.qr:active{transform:scale(.95)}

/* Result card */
.res-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:15px;margin-top:6px;max-width:min(82%,320px)}
.res-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.res-cat{font-size:11px;color:var(--t2)}
.res-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600}
.sb-wrap{margin-bottom:11px}
.sb-label{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:4px}
.sb-track{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.sb-fill{height:100%;border-radius:3px;transition:width .9s cubic-bezier(.16,1,.3,1)}
.res-txt{font-size:12px;color:var(--t2);line-height:1.72;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}
.res-txt::-webkit-scrollbar{width:2px}
.res-txt::-webkit-scrollbar-thumb{background:var(--s3)}
.rat-row{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--bd2)}
.rat-lbl{font-size:11px;color:var(--t3);flex:1}
.stars{display:flex;gap:2px}
.star{font-size:17px;cursor:pointer;opacity:.22;color:var(--ye);transition:all .14s;user-select:none}
.star.on{opacity:1}
.star:hover{transform:scale(1.18);opacity:.7}

/* Typing */
.ty-wrap{padding:16px 14px 0;display:flex;align-items:flex-start;gap:9px}
.ty-dots{display:inline-flex;gap:4px;padding:10px 13px;background:var(--s1);border:1px solid var(--bd);border-radius:4px 13px 13px 13px}
.ty-d{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:td 1.2s ease infinite}
.ty-d:nth-child(2){animation-delay:.16s}.ty-d:nth-child(3){animation-delay:.32s}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── INPUT ── */
.inp-area{flex-shrink:0;padding:8px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.inp-wrap{display:flex;align-items:flex-end;gap:7px;background:var(--s1);border:1px solid var(--bd);border-radius:15px;padding:7px 7px 7px 15px;transition:border-color .2s}
.inp-wrap:focus-within{border-color:rgba(91,143,249,.32)}
.inp-tx{flex:1;background:none;border:none;outline:none;color:var(--t);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;resize:none;max-height:110px;min-height:24px;caret-color:var(--ac);padding:2px 0}
.inp-tx::placeholder{color:var(--t3)}
.send-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--ac);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:all .18s;opacity:.35;pointer-events:none;flex-shrink:0;user-select:none}
.send-btn.on{opacity:1;pointer-events:all;transition:transform .1s}.send-btn.on:active{transform:scale(.92)}
.send-btn:hover{background:var(--acb)}
.send-btn:active{transform:scale(.9)}
.inp-hint{font-size:10px;color:var(--t3);text-align:center;margin-top:6px}


/* ── CAT SELECTOR BAR ── */
.cat-bar{display:none;align-items:center;gap:8px;padding:8px 12px 0;overflow-x:auto;flex-shrink:0}
.cat-bar::-webkit-scrollbar{display:none}
.cat-bar.show{display:flex}
.cat-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:20px;cursor:pointer;transition:all .18s;font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap;user-select:none;flex-shrink:0}
.cat-chip:hover{border-color:var(--ac);color:var(--t)}
.cat-chip.sel{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.cat-chip-av{font-size:15px}

/* ── MODE SHEET ── */
.sh-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:149;opacity:0;pointer-events:none;transition:opacity .25s}
.sh-overlay.show{opacity:1;pointer-events:all}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;z-index:150;transform:translateY(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);padding-bottom:28px}
.sheet.open{transform:translateY(0)}
.sh-handle{width:32px;height:3px;background:var(--s4);border-radius:2px;margin:11px auto 14px}
.sh-title{font-size:12px;font-weight:600;color:var(--t3);padding:0 18px 11px;border-bottom:1px solid var(--bd2);letter-spacing:.5px;text-transform:uppercase}
.sh-item{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;transition:background .14s;user-select:none}
.sh-item:hover{background:var(--s2)}
.sh-item:active{background:var(--s3)}
.sh-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sh-.sh-nm{font-size:14px;font-weight:600;margin-bottom:2px}
.sh-ds{font-size:12px;color:var(--t2)}
.sh-item.act .sh-nm{color:var(--ac)}


/* ── RESPONSIVE & ACCESSIBILITY ── */
img{max-width:100%;height:auto;display:block;}
*:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}

/* ── TYPOGRAPHY SCALE ── */
.bb.ai h3{font-size:15px;font-weight:600;margin:10px 0 4px;color:var(--t)}
.bb.ai p{font-size:14px;line-height:1.65;margin:3px 0;color:var(--t)}
.bb.ai ul{padding-left:16px;margin:4px 0}
.bb.ai li{font-size:14px;line-height:1.65;color:var(--t);margin:2px 0}
.bb.ai strong{color:var(--t);font-weight:600}

/* ── PHOTO UPLOAD ── */
.plus-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--t2);flex-shrink:0;transition:all .18s;user-select:none}
.plus-btn:hover{background:var(--s3);border-color:rgba(255,255,255,.15);color:var(--t)}
.plus-btn:active{transform:scale(.92)}
.photo-bar{display:none;gap:8px;padding:8px 0 4px;overflow-x:auto;flex-shrink:0}
.photo-bar::-webkit-scrollbar{display:none}
.photo-bar.show{display:flex}
.photo-thumb{position:relative;width:60px;height:60px;flex-shrink:0;border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#photo-input{display:none}
/* image in chat bubble */
.msg-img{max-width:200px;max-height:180px;border-radius:10px;margin-top:6px;display:block;object-fit:cover}


/* ── LANGUAGE ── */
.lang-btn{width:34px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--t2);flex-shrink:0;transition:all .18s;font-family:'Noto Serif TC',serif;user-select:none}
.lang-btn:hover{background:var(--s3);color:var(--t);border-color:rgba(255,255,255,.15)}
.lang-btn:active{transform:scale(.92)}
.lang-check{font-size:14px;color:var(--ac);font-weight:700;flex-shrink:0;transition:opacity .18s}
/* English mode overrides */
#paws-app.lang-en{font-family:'Dancing Script',cursive}
#paws-app.lang-en .inp-tx{font-family:'Dancing Script',cursive;font-size:16px}
#paws-app.lang-en .bb.ai{font-family:'Dancing Script',cursive;font-size:15px;line-height:1.8}
#paws-app.lang-en .bb.user{font-family:'Dancing Script',cursive;font-size:15px}
#paws-app.lang-en .hd-title{font-family:'Dancing Script',cursive;font-size:18px}
#paws-app.lang-en .wl-title{font-family:'Dancing Script',cursive}
#paws-app.lang-en .sg-t{font-family:'Dancing Script',cursive;font-size:13px}
#paws-app.lang-en .sg-d{font-family:'Dancing Script',cursive}
#paws-app.lang-en .sh-nm{font-family:'Dancing Script',cursive}
#paws-app.lang-en .sh-ds{font-family:'Dancing Script',cursive}
#paws-app.lang-en .sb-item-tx{font-family:'Dancing Script',cursive}
#paws-app.lang-en .qr{font-family:'Dancing Script',cursive;font-size:12px}



/* ════ VIRTUAL CAT ════ */
#vcat-wrap{position:fixed;right:14px;top:70px;z-index:300;display:none;flex-direction:column;align-items:center;gap:4px;user-select:none}
.vcat-bubble{background:rgba(20,20,30,.95);border:1px solid rgba(255,255,255,.12);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:12px;color:#e0e0ff;max-width:180px;line-height:1.6;opacity:0;transform:translateY(8px) scale(.95);transition:all .4s cubic-bezier(.16,1,.3,1);pointer-events:none;font-family:'Noto Serif TC',serif;box-shadow:0 4px 20px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.vcat-bubble.show{opacity:1;transform:translateY(0) scale(1)}
#vcat{width:88px;height:88px;cursor:pointer;transition:transform .2s;filter:drop-shadow(0 3px 8px rgba(60,100,200,.3));overflow:visible}
#vcat:hover{transform:scale(1.1) translateY(-3px)}
#vcat:active{transform:scale(.92)}
#vcat canvas{width:88px;height:88px;display:block;border-radius:8px}
.vcat-name{font-size:10px;color:rgba(255,255,255,.4);font-family:'Space Mono',monospace;text-align:center;letter-spacing:.5px}
.vcat-mood-badge{font-size:9px;background:rgba(255,255,255,.07);border-radius:8px;padding:2px 7px;color:rgba(255,255,255,.4);margin-top:1px}

/* ── BACK TO HOME ── */
.back-home-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);font-size:16px;text-decoration:none;flex-shrink:0;transition:all .18s}
.back-home-btn:hover{background:var(--s3);color:var(--t);border-color:rgba(255,255,255,.15)}


/* ════ API KEY SETUP ════ */
.key-card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:32px 28px;max-width:360px;width:100%}
.key-logo{font-size:36px;text-align:center;margin-bottom:12px}
.key-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;text-align:center;margin-bottom:6px;color:var(--t)}
.key-sub{font-size:13px;color:var(--t2);text-align:center;line-height:1.7;margin-bottom:22px}
.key-sub a{color:var(--ac);text-decoration:underline}
.key-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:13px 15px;color:var(--t);font-size:14px;outline:none;margin-bottom:12px;transition:border-color .2s;font-family:'Noto Serif TC',serif}
.key-input:focus{border-color:rgba(124,106,247,.45)}
.key-input::placeholder{color:var(--t3)}
.key-btn{width:100%;padding:13px;border-radius:11px;border:none;background:linear-gradient(135deg,#4285f4,#34a853);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Noto Serif TC',serif}
.key-btn:hover{opacity:.9;transform:translateY(-1px)}
.key-note{font-size:11px;color:var(--t3);text-align:center;margin-top:12px;line-height:1.6}
.key-steps{background:var(--s2);border-radius:10px;padding:14px;margin-bottom:18px}
.key-steps p{font-size:12px;color:var(--t2);line-height:1.9;margin:0}
.key-steps strong{color:var(--t)}


/* ════ PHOTO CAT ════ */
#vcat-wrap{position:fixed;right:14px;top:70px;z-index:300;display:none;flex-direction:column;align-items:center;gap:4px;user-select:none}
#vcat{width:90px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1);position:relative;user-select:none}
#vcat:hover{transform:scale(1.1) translateY(-4px)}
#vcat:active{transform:scale(.92)}
.vcat-body{display:flex;flex-direction:column;align-items:center;position:relative}
#vcat-photo{width:88px;height:88px;object-fit:cover;border-radius:50%;border:3px solid rgba(255,200,80,.6);box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);transition:all .3s}
.vcat-body.mood-happy #vcat-photo,.vcat-body.mood-excited #vcat-photo{border-color:rgba(80,220,140,.7);box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 14px rgba(80,220,140,.3)}
.vcat-body.mood-worried #vcat-photo{border-color:rgba(240,100,100,.7);box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 14px rgba(240,100,100,.3)}
.vcat-body.mood-thinking #vcat-photo{border-color:rgba(155,143,239,.7);box-shadow:0 4px 18px rgba(0,0,0,.45),0 0 14px rgba(155,143,239,.3);animation:thinkSpin 3s linear infinite}
.vcat-body.mood-sleeping #vcat-photo{opacity:.7;filter:saturate(.5)}
.vcat-body.mood-happy{animation:catBounce .55s ease-in-out infinite alternate}
.vcat-body.mood-excited{animation:catBounce .35s ease-in-out infinite alternate}
@keyframes catBounce{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes thinkSpin{0%,100%{border-radius:50%}50%{border-radius:46% 54% 52% 48%}}
.vcat-zzz{position:absolute;top:-5px;right:-5px;font-size:13px;color:#aac;opacity:0;font-weight:bold;pointer-events:none}
.vcat-body.mood-sleeping .vcat-zzz{animation:floatZzz 2.2s ease-in-out infinite}
@keyframes floatZzz{0%{opacity:0;transform:translateY(0) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1.1)}}
.vcat-heart{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:16px;opacity:0;transition:all .5s;pointer-events:none}
.vcat-heart.show{opacity:1;top:-24px}
.vcat-bubble{background:rgba(255,255,255,.92);border:1px solid rgba(30,80,160,.2);border-radius:16px 16px 16px 5px;padding:10px 14px;font-size:12px;color:#0a2040;max-width:180px;line-height:1.6;opacity:0;transform:translateY(8px) scale(.95);transition:all .4s cubic-bezier(.16,1,.3,1);pointer-events:none;font-family:'Noto Serif TC',serif;box-shadow:0 6px 22px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.vcat-bubble.show{opacity:1;transform:translateY(0) scale(1)}
.vcat-name{font-size:10px;color:rgba(10,32,64,.5);font-family:'Space Mono',monospace;text-align:center;letter-spacing:.5px;margin-top:2px}
.vcat-mood-badge{font-size:9px;background:rgba(30,80,160,.1);border-radius:8px;padding:2px 8px;color:rgba(10,32,64,.5);margin-top:1px}


/* ════ VCAT UPLOAD ════ */
#vcat-upload-input{display:none}

#vcat-upload-btn{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);font-size:9px;border-radius:8px;padding:3px 8px;cursor:pointer;font-family:'Space Mono',monospace;margin-top:2px;transition:all .2s;-webkit-user-select:none;user-select:none}
#vcat-upload-btn:hover{background:rgba(255,255,255,.18);color:rgba(255,255,255,.8)}

/* ── Feature intro cards ── */
.feat-wrap{width:100%;display:flex;flex-direction:column;gap:8px;margin:16px 0 4px}
.feat-card{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;transition:all .18s;user-select:none}
.feat-card:hover{background:var(--s2);border-color:rgba(91,143,249,.3);transform:translateY(-1px)}
.feat-card:active{transform:scale(.97)}
.feat-ic{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.feat-info{flex:1}
.feat-t{font-size:13px;font-weight:700;color:var(--t);margin-bottom:2px}
.feat-d{font-size:11px;color:var(--t2);line-height:1.5}
.feat-divider{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3);text-align:center;margin:14px 0 6px;position:relative}
.feat-divider::before,.feat-divider::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--bd)}
.feat-divider::before{left:0}.feat-divider::after{right:0}

/* ════ TUTORIAL ════ */
.tut-overlay{position:fixed;inset:0;background:transparent;z-index:9000;opacity:0;pointer-events:none;transition:opacity .3s}
.tut-overlay.show{opacity:1;pointer-events:all}
.tut-highlight{position:relative;z-index:9001!important;box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 0 4px rgba(91,143,249,.7),0 0 20px 6px rgba(91,143,249,.3)!important;border-radius:10px;pointer-events:auto;transition:box-shadow .3s}
.tut-bar{position:fixed;left:0;right:0;bottom:0;z-index:9002;display:none;align-items:center;justify-content:space-between;padding:14px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(30,80,160,.12);gap:10px}
.tut-bar.show{display:flex}
.tut-skip{background:none;border:none;color:#6a8aaa;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:6px 10px;border-radius:8px;transition:all .18s}
.tut-skip:hover{background:rgba(0,0,0,.06);color:#2a4a70}
.tut-dots{display:flex;gap:6px;align-items:center}
.tut-dot{width:8px;height:8px;border-radius:50%;background:rgba(30,80,160,.15);transition:all .25s}
.tut-dot.active{background:#5b8ff9;transform:scale(1.3)}
.tut-dot.done{background:#3ecf8e}
.tut-next{background:#5b8ff9;color:#fff;border:none;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.tut-next:hover{background:#3d6fe0;transform:translateY(-1px)}
.tut-next:active{transform:scale(.96)}


/* ════ VCAT WALK & PAWPRINT ════ */
@keyframes vcatWalkOut{
  0%{transform:translateY(0);opacity:1}
  60%{transform:translateY(60px);opacity:.8}
  100%{transform:translateY(160px);opacity:0}
}
@keyframes vcatWalkIn{
  0%{transform:translateY(160px);opacity:0}
  40%{transform:translateY(-12px);opacity:1}
  70%{transform:translateY(6px)}
  100%{transform:translateY(0);opacity:1}
}
@keyframes pawAppear{
  0%{opacity:0;transform:scale(.5)}
  60%{opacity:1;transform:scale(1.2)}
  100%{opacity:1;transform:scale(1)}
}
#vcat-wrap.walking-out{animation:vcatWalkOut .7s cubic-bezier(.4,0,.6,1) forwards}
#vcat-wrap.walking-in{animation:vcatWalkIn .6s cubic-bezier(.16,1,.3,1) forwards}



/* ════ HEALTH MODE ════ */
.health-wrap{padding:16px 14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;height:100%}
.health-wrap::-webkit-scrollbar{width:2px}
.health-wrap::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}

/* 選貓畫面 */
.cat-select-grid{display:flex;flex-direction:column;gap:10px}
.cat-select-card{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .18s;user-select:none}
.cat-select-card:hover{background:var(--s2);border-color:rgba(91,143,249,.3);transform:translateY(-1px)}
.cat-select-card:active{transform:scale(.98)}
.cat-sel-av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);flex-shrink:0;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:22px}
.cat-sel-info{flex:1}
.cat-sel-name{font-size:15px;font-weight:700;color:var(--t);margin-bottom:3px}
.cat-sel-sub{font-size:12px;color:var(--t2)}
.cat-sel-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot-green{background:#3ecf8e}
.dot-yellow{background:#f5a623}
.dot-red{background:#f26d6d}
.dot-grey{background:#aaa}
.cat-add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:2px dashed var(--bd);border-radius:14px;padding:16px;cursor:pointer;font-size:14px;color:var(--t2);transition:all .18s;user-select:none}
.cat-add-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--acs)}

/* 儀表板 */
.health-hd{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.health-hd-back{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t2);padding:0 4px;flex-shrink:0}
.health-hd-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);flex-shrink:0;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:24px}
.health-hd-info{flex:1}
.health-hd-name{font-size:16px;font-weight:700;color:var(--t)}
.health-hd-sub{font-size:12px;color:var(--t2);margin-top:2px}
.health-hd-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}

/* 統計卡 */
.health-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 10px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--t);margin-bottom:2px}
.stat-lbl{font-size:10px;color:var(--t2)}

/* 折線圖 */
.chart-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px}
.chart-title{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-canvas{width:100%;height:120px;display:block}
.chart-empty{text-align:center;font-size:13px;color:var(--t3);padding:20px 0}

/* 風險分佈 */
.risk-bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.risk-row{display:flex;align-items:center;gap:10px}
.risk-lbl{font-size:12px;color:var(--t2);width:24px;flex-shrink:0}
.risk-track{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden}
.risk-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.risk-count{font-size:11px;color:var(--t3);width:20px;text-align:right;flex-shrink:0}

/* 紀錄時間軸 */
.record-list{display:flex;flex-direction:column;gap:8px}
.record-item{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .18s}
.record-item:hover{border-color:rgba(91,143,249,.3)}
.record-hd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.record-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.record-info{flex:1}
.record-date{font-size:11px;color:var(--t3);margin-bottom:2px}
.record-desc{font-size:13px;color:var(--t);line-height:1.4}
.record-sl{font-size:12px;font-weight:600;flex-shrink:0}
.record-body{display:none;padding:0 14px 12px;font-size:12px;color:var(--t2);line-height:1.7;border-top:1px solid var(--bd2);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}
.record-body.open{display:block}
.record-del{background:none;border:none;color:var(--t3);font-size:13px;cursor:pointer;padding:4px 6px;transition:color .14s}
.record-del:hover{color:var(--re)}

/* 底部按鈕 */
.health-actions{display:flex;gap:8px;margin-top:4px}

/* ── DASHBOARD TABS ── */
.health-tabs{display:flex;gap:6px;background:var(--s2);border-radius:12px;padding:4px;margin-top:4px}
.health-tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .18s;user-select:none;border:none;background:transparent;font-family:'Noto Serif TC',serif}
.health-tab.active{background:var(--s1);color:var(--ac);box-shadow:0 1px 4px rgba(91,143,249,.15)}

/* ── DAILY LOG ── */
.daily-log-hint{font-size:11px;color:var(--t3);text-align:center;padding:4px 0 8px}
.daily-item{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px;cursor:pointer;transition:all .18s}
.daily-item:hover{border-color:rgba(91,143,249,.3)}
.daily-hd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.daily-date{font-size:11px;color:var(--t3);font-family:'Space Mono',monospace;flex-shrink:0;width:78px}
.daily-icon{font-size:18px;flex-shrink:0}
.daily-desc{flex:1;font-size:13px;color:var(--t);line-height:1.4}
.daily-risk{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;flex-shrink:0}
.daily-risk.r-low{background:rgba(62,207,142,.13);color:var(--gr)}
.daily-risk.r-mid{background:rgba(245,166,35,.13);color:var(--ye)}
.daily-risk.r-high{background:rgba(242,109,109,.13);color:var(--re)}
.daily-body{display:none;padding:0 14px 12px;font-size:12px;color:var(--t2);line-height:1.7;border-top:1px solid var(--bd2);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow-y:auto}
.daily-body.open{display:block}
.daily-empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:13px;line-height:1.8}
.health-action-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;font-family:'Noto Serif TC',serif}
.health-action-primary{background:var(--ac);color:#fff}
.health-action-primary:hover{background:var(--acb)}
.health-action-secondary{background:var(--s2);color:var(--t2);border:1px solid var(--bd)}
.health-action-secondary:hover{background:var(--s3);color:var(--t)}
.health-action-danger{background:rgba(242,109,109,.1);color:var(--re);border:1px solid rgba(242,109,109,.2)}
.health-action-danger:hover{background:rgba(242,109,109,.2)}


/* ── SIDEBAR CAT PHOTO ── */
.sb-cat{display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.sb-cat-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);cursor:pointer;transition:all .2s}
.sb-cat-photo:hover{border-color:var(--ac);transform:scale(1.04)}
.sb-cat-name{font-size:11px;color:var(--t2);margin-top:7px;font-family:'Space Mono',monospace;letter-spacing:.5px}
.sb-cat-upload-btn{font-size:10px;color:var(--t3);background:none;border:1px solid var(--bd);border-radius:8px;padding:3px 10px;cursor:pointer;margin-top:5px;transition:all .18s;font-family:'DM Sans',sans-serif}
.sb-cat-upload-btn:hover{color:var(--ac);border-color:var(--ac)}

<script>
// ══ STORAGE ══
var DB_KEY='pawsense_v5';
function loadDB(){try{var r=localStorage.getItem(DB_KEY);return r?JSON.parse(r):{users:[],cur:null};}catch(e){return{users:[],cur:null};}}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
var DB=loadDB();
function curU(){
  if(!DB.cur)return null;
  var u=DB.users.find(function(u){return u.email===DB.cur;})||null;
  if(!u)return null;
  if(!u.cats)u.cats=[];if(!u.records)u.records=[];if(!u.sessions)u.sessions=[];if(!u.favs)u.favs=[];
  return u;
}
function clearData(){
  if(!confirm('確定要清除所有資料嗎？'))return;
  localStorage.removeItem(DB_KEY);
  DB={users:[{name:'我',email:'local',pw:'',cats:[],records:[],sessions:[],favs:[]}],cur:'local'};
  saveDB();curSessId=null;sessMsgs=[];chatHist=[];selCatId=null;
  closeSB();renderSB();renderMsgs([]);refreshCatBar();
}
// ══ SIDEBAR / SHEET ══
function toggleSB(){var s=document.getElementById('sidebar'),o=document.getElementById('sb-ov');var op=s.classList.toggle('open');o.classList.toggle('show',op);}
function closeSB(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-ov').classList.remove('show');}
function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('sh-ov').classList.add('show');}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sh-ov').classList.remove('show');}
function renderSB(){
  var u=curU();if(!u)return;
  var list=document.getElementById('sb-list');list.innerHTML='';
  if(!u.sessions||!u.sessions.length){
    var empty=document.createElement('div');
    empty.style.cssText='padding:10px 12px;font-size:12px;color:var(--t3)';
    empty.textContent='還沒有對話紀錄';
    list.appendChild(empty);return;
  }
  u.sessions.slice().reverse().forEach(function(s){
    var el=document.createElement('div');
    el.className='sb-item'+(s.id===curSessId?' act':'');
    var ic={general:'🐱',analyze:'🔍',report:'📋',cat:'🐈'}[s.mode]||'🐱';
    var icS=document.createElement('span');icS.className='sb-item-ic';icS.textContent=ic;
    var txS=document.createElement('span');txS.className='sb-item-tx';txS.textContent=s.title||'新對話';
    var del=document.createElement('button');del.className='sb-item-del';del.textContent='×';
    del.onclick=function(e){e.stopPropagation();delSess(s.id);};
    el.appendChild(icS);el.appendChild(txS);el.appendChild(del);
    el.onclick=function(e){if(e.target===del)return;loadSess(s.id);closeSB();};
    list.appendChild(el);
  });
}
function delSess(id){var u=curU();if(!u)return;u.sessions=u.sessions.filter(function(s){return s.id!==id;});saveDB();if(curSessId===id)newChat();else renderSB();}
// ══ SESSIONS ══
var curSessId=null,sessMsgs=[];
function newChat(){
  curSessId=null;chatHist=[];sessMsgs=[];
  document.getElementById('hd-title').textContent='PawSense AI';
  renderMsgs([]);renderSB();closeSB();
}
function loadSess(id){
  var u=curU();if(!u)return;
  var s=u.sessions.find(function(s){return s.id===id;});if(!s)return;
  curSessId=id;sessMsgs=s.messages||[];chatHist=s.history||[];
  setModeSilent(s.mode||'general');
  document.getElementById('hd-title').textContent=s.title||'對話';
  renderMsgs(sessMsgs);
}
function saveSess(title){
  var u=curU();if(!u)return;
  if(!u.sessions)u.sessions=[];
  if(curSessId){
    var s=u.sessions.find(function(s){return s.id===curSessId;});
    if(s){s.messages=sessMsgs;s.history=chatHist;if(title)s.title=title;saveDB();renderSB();return;}
  }
  var id='s'+Date.now();curSessId=id;
  u.sessions.push({id:id,title:title||'新對話',mode:chatMode,messages:sessMsgs,history:chatHist});
  saveDB();renderSB();
  if(title)document.getElementById('hd-title').textContent=title;
}
// ══ RENDER MESSAGES ══
function renderMsgs(msgs){
  sessMsgs=msgs;
  var el=document.getElementById('msgs');el.innerHTML='';
  if(!msgs||!msgs.length){el.appendChild(buildWelcome());return;}
  msgs.forEach(function(m){appendMsgEl(m,false);});
  scrollBot();
}
function buildWelcome(){
  var div=document.createElement('div');div.className='welcome';

  // ── Logo & Title ──
  var logo=document.createElement('div');logo.className='wl-logo';logo.textContent='🐾';
  var title=document.createElement('div');title.className='wl-title';title.innerHTML='Paw<em>Sense</em> AI';
  var sub=document.createElement('div');sub.className='wl-sub';sub.textContent=(T[curLang]&&T[curLang].welcomeSub)||'你的 AI 貓咪健康助理';

  // ── Feature intro cards ──
  var featWrap=document.createElement('div');featWrap.className='feat-wrap';
  var featData=(T[curLang]&&T[curLang].features)||[
    {ic:'🔍',t:'行為分析',d:'描述貓咪行為，AI 即時分析壓力指數與風險等級'},
    {ic:'💊',t:'健康問題',d:'輸入症狀，獲得建議與就醫時機評估'},
    {ic:'📋',t:'分析紀錄',d:'所有分析結果自動儲存，隨時查閱歷史報告'},
    {ic:'🐈',t:'貓咪管理',d:'建立多隻貓咪檔案，追蹤每隻貓的健康狀況'},
  ];
  var featQmap={'行為分析':'我想分析貓咪的行為','健康問題':'我的貓咪最近食慾不振','分析紀錄':'幫我看最近的分析結果','貓咪管理':'幫我新增一隻貓咪','Behavior Analysis':"I want to analyze my cat's behavior",'Health Issues':'My cat has been eating less lately','Analysis Records':'Show me recent analysis results','Cat Management':'Help me add a cat'};
  var features=featData.map(function(f){return Object.assign({},f,{q:featQmap[f.t]||''});});
  features.forEach(function(f){
    var card=document.createElement('div');card.className='feat-card';
    var ic=document.createElement('div');ic.className='feat-ic';ic.textContent=f.ic;
    var info=document.createElement('div');info.className='feat-info';

function fmtAI(text){
  if(!text)return'';
  var o=esc(text)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^#{1,3} (.+)$/gm,'<h3>$1</h3>')
    .replace(/^[•\-] (.+)$/gm,'<li>$1</li>');
  var lines=o.split('\n');var out=[];var ul=false;
  lines.forEach(function(l){
    if(l.startsWith('<li>')){if(!ul){out.push('<ul>');ul=true;}out.push(l);}
    else{if(ul){out.push('</ul>');ul=false;}if(l.trim())out.push(l.startsWith('<h3>')?l:'<p>'+l+'</p>');}
  });
  if(ul)out.push('</ul>');
  return out.join('');
}
function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ══ AUTO RECORD (Step 3) ══
function autoRecord(userTxt, replyTxt){
  var u=curU();
  if(!u) return;

  // 偵測壓力指數和風險等級
  var sm=replyTxt.match(/壓力指數[^\d]*(\d+)/)||replyTxt.match(/(\d+)\s*[\/／]\s*100/);
  var rm=replyTxt.match(/風險等級[^低中高]*(低|中|高)/)||replyTxt.match(/(低|中|高)風險/);
  if(!sm||!rm) return; // 沒有分析結果就不記錄

  var sl=Math.min(100,Math.max(0,parseInt(sm[1])));
  var risk=rm[1];

  // 從對話中偵測貓咪名字
  var combined=userTxt+' '+replyTxt;
  var matchedCat=null;

  // 先比對現有貓咪
  if(u.cats&&u.cats.length){
    u.cats.forEach(function(c){
      if(combined.toLowerCase().indexOf(c.name.toLowerCase())!==-1){
        matchedCat=c;
      }
    });
  }

  // 找不到已知貓咪 → 嘗試從對話中提取名字並自動建立
  if(!matchedCat){
    var nameMatch=combined.match(/(?:我的貓|貓咪|我家的貓)[叫是名字叫]?\s*([^\s，。！？、,\.]{1,6})/);
    if(!nameMatch) nameMatch=combined.match(/([^\s，。！？、,\.]{1,6})(?:最近|今天|昨天|一直|突然)/);
    if(nameMatch&&nameMatch[1]){
      var newName=nameMatch[1].replace(/[的牠她他它]/g,'').trim();
      if(newName.length>=1&&newName.length<=6){
        // 自動建立新貓咪
        if(!u.cats) u.cats=[];
        var newCat={
          id:Date.now(),
          name:newName,
          emoji:'🐱',
          breed:'未填',
          age:'未填',
          gender:'未填',
          createdAt:new Date().toLocaleDateString('zh-TW')
        };
        u.cats.push(newCat);
        saveDB();
        matchedCat=newCat;
      }
    }
  }

  // 還是找不到 → 用第一隻，或不記錄
  if(!matchedCat){
    if(u.cats&&u.cats.length) matchedCat=u.cats[0];
    else return;
  }

  // 避免重複記錄（5秒內）
  var now=Date.now();
  if(!u.records) u.records=[];
  var recent=u.records.filter(function(r){return r.catId===matchedCat.id&&now-r.id<5000;});
  if(recent.length) return;

  var rec={
    id:now,
    catId:matchedCat.id,
    catName:matchedCat.name,
    catEmoji:matchedCat.emoji||'🐱',
    date:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    inputText:userTxt,
    fullReport:replyTxt,
    sl:sl,
    risk:risk,
    rating:0
  };
  u.records.push(rec);
  saveDB();
}

var KB={
  // 行為類
  morning_cry:{keys:['早上','叫','一直叫','哭','吵','清晨','凌晨'],
    ans:'🐱 **早上一直叫的常見原因**\n\n貓咪在清晨或早上叫個不停，通常有以下幾種原因：\n\n**1. 肚子餓了**\n這是最常見的原因！貓咪的生理時鐘很準，如果你通常早上餵食，牠會提前「提醒」你。\n\n**2. 想要陪伴**\n貓咪可能睡了一夜，醒來發現你還在睡，想引起你的注意。\n\n**3. 發情期**\n未絕育的貓咪，尤其是母貓，發情時會在清晨發出持續的叫聲。\n\n**4. 老年認知障礙**\n老年貓（10歲以上）有時會因為認知功能下降，對時間感到混亂而叫個不停。\n\n**💡 改善建議**\n- 嘗試定時自動餵食器，讓牠習慣固定時間進食\n- 睡前多陪玩，消耗精力\n- 如果未絕育，考慮結紮\n\n💬 想讓我分析得更準確，可以告訴我：貓咪幾歲？有沒有結紮？'},
  hide:{keys:['躲','躲起來','躲藏','不出來','藏'],
    ans:'🐱 **貓咪躲藏的原因分析**\n\n**【行為解析】**\n貓咪躲藏是一種本能的自我保護行為，常見於壓力、恐懼或身體不適時。\n\n**【情緒評估】**\n目前情緒：焦慮或不安全感較高\n\n**【壓力指數】**：60/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 環境有變化（搬家、新成員、新寵物）\n- 聽到巨大聲音（鞭炮、雷聲）\n- 身體不舒服\n- 剛帶回家的新貓\n\n**【改善建議】**\n- 給牠安靜的空間，不要強迫牠出來\n- 確保有足夠的躲藏處（紙箱、貓窩）\n- 觀察是否有其他異常（不吃飯、異常排泄）\n\n**【何時就醫】**\n若躲藏超過 24 小時且不吃不喝，請立即就醫。'},
  scratch:{keys:['抓','抓人','咬','咬人','攻擊','兇'],
    ans:'🐱 **貓咪抓人/咬人的行為分析**\n\n**【行為解析】**\n貓咪抓咬行為通常是溝通方式，表示「我不想被碰」或「我在玩」。\n\n**【情緒評估】**\n可能感到受威脅、過度興奮或疼痛\n\n**【壓力指數】**：55/100\n\n**【風險等級】**：低至中\n\n**原因分類**\n- **玩耍型**：小貓常見，手被當成玩具\n- **防禦型**：被過度撫摸或觸碰敏感部位\n- **疼痛型**：觸碰到受傷部位時反應\n- **恐懼型**：感到被威脅時的自我保護\n\n**【改善建議】**\n- 學習貓咪的「不要碰我」訊號（尾巴搖動、耳朵後壓）\n- 用玩具代替手來玩耍\n- 避免突然伸手\n\n**【何時就醫】**\n若抓咬行為突然改變，可能是疼痛引起，建議就醫檢查。'},
  not_eat:{keys:['不吃','不喝','食慾','沒胃口','拒食','少吃'],
    ans:'🐱 **貓咪不吃東西的分析**\n\n**【行為解析】**\n食慾不振是貓咪健康的重要警訊，需要特別注意。\n\n**【情緒評估】**\n可能感到不適、壓力或對食物產生抗拒\n\n**【壓力指數】**：70/100\n\n**【風險等級】**：中至高\n\n**常見原因**\n- 換了新的貓糧品牌或口味\n- 壓力（環境改變）\n- 牙齦疾病或口腔疼痛\n- 消化問題、腸胃炎\n- 其他疾病（肝病、腎病等）\n\n**【改善建議】**\n- 確認上次正常進食的時間\n- 嘗試換回原本的食物\n- 提供新鮮的食物和乾淨的水\n- 檢查嘴巴有無異常\n\n**【何時就醫】**\n⚠️ 貓咪超過 **24-48 小時** 不吃東西，務必就醫！貓咪空腹太久容易引發脂肪肝。'},
  vomit:{keys:['吐','嘔吐','反胃','吐毛','嘔'],
    ans:'🐱 **貓咪嘔吐的分析**\n\n**【行為解析】**\n偶爾嘔吐在貓咪中相對常見，但頻繁嘔吐需要注意。\n\n**【情緒評估】**\n身體可能感到不適\n\n**【壓力指數】**：50/100\n\n**【風險等級】**：低至中\n\n**原因分類**\n- **毛球**：長毛貓常見，吐出毛球屬正常\n- **吃太快**：進食速度過快導致反胃\n- **食物不耐**：對某種食材過敏\n- **異物**：吞入玩具零件、植物等\n- **疾病**：腸胃炎、胰臟炎等\n\n**【改善建議】**\n- 定期梳毛減少毛球\n- 使用慢食碗\n- 少量多餐\n- 觀察嘔吐物（是否含血）\n\n**【何時就醫】**\n嘔吐超過 3 次/天、含血絲、伴隨精神不振，請立即就醫。'},
  diarrhea:{keys:['拉肚子','軟便','腹瀉','血便','血尿','尿血'],
    ans:'🐱 **排泄異常的分析**\n\n**【行為解析】**\n排泄異常通常反映消化系統或泌尿系統的問題。\n\n**【情緒評估】**\n身體不適，可能感到疼痛或不安\n\n**【壓力指數】**：75/100\n\n**【風險等級】**：中至高\n\n**【改善建議】**\n- 確保飲水充足\n- 暫時改為清淡飲食（水煮雞胸肉）\n- 記錄排泄頻率和狀態\n\n**【何時就醫】**\n⚠️ 若出現**血便或血尿**，請**立即**就醫，這是緊急狀況！'},
  night_run:{keys:['半夜','跑','狂奔','到處跑','夜間','夜跑','抖動'],
    ans:'🐱 **半夜狂奔（Zoomies）的分析**\n\n**【行為解析】**\n這個行為俗稱「貓咪瘋跑」（Zoomies），是完全正常的行為！\n\n**【情緒評估】**\n精力充沛、情緒亢奮，屬於正向狀態\n\n**【壓力指數】**：15/100\n\n**【風險等級】**：低（正常行為）\n\n**原因**\n- 貓咪天生是夜行性動物，黃昏和清晨是牠們的「活躍時段」\n- 白天睡太多，精力需要釋放\n- 排便後的「慶祝儀式」（便後狂奔很常見！）\n\n**【改善建議】**\n- 睡前與牠玩 15-20 分鐘消耗精力\n- 提供爬架、玩具讓牠自己玩\n- 餵食時間改到睡前，吃飽容易想睡\n\n**【何時就醫】**\n若同時伴隨異常叫聲或身體抖動，建議就醫排除神經問題。'},
  box:{keys:['紙箱','箱子','袋子','喜歡待','鑽'],
    ans:'🐱 **為什麼貓咪喜歡紙箱？**\n\n這是貓咪最可愛的特質之一！\n\n**原因分析**\n- **安全感**：封閉空間讓貓咪感到被保護，符合牠們躲藏獵物的本能\n- **體溫**：紙箱能保暖，貓咪喜歡溫暖的地方\n- **好奇心**：新事物對貓咪充滿吸引力\n- **領域標記**：待在裡面是在「佔領地盤」\n\n**💡 小知識**\n研究發現，有紙箱可以躲的貓咪，壓力荷爾蒙（皮質醇）明顯較低！所以給貓咪留幾個紙箱是很好的環境豐富化方式。\n\n不需要擔心，這是健康又快樂的行為 😊'},
  knead:{keys:['踩奶','踩','揉','按摩','捏'],
    ans:'🐱 **踩奶行為分析**\n\n**【行為解析】**\n踩奶（Making Biscuits）是貓咪最溫馨的行為之一！\n\n**原因**\n- **幼年記憶**：小貓踩媽媽肚子刺激奶水，長大後保留這個動作\n- **表達滿足**：感到非常安心和快樂時才會踩\n- **標記氣味**：肉墊有氣腺，踩你就是在說「你是我的」\n\n**【情緒評估】**\n極度放鬆、幸福、有安全感 ❤️\n\n**【壓力指數】**：5/100（非常低）\n\n**【風險等級】**：無（正向行為）\n\n**💡 小知識**\n貓咪踩奶時通常會發出呼嚕聲，這是牠對你表達最高級別的信任和愛意！'},
  purr:{keys:['呼嚕','呼嚕聲','打呼','咕嚕'],
    ans:'🐱 **呼嚕聲的含義**\n\n**呼嚕聲不只代表快樂！**\n\n**快樂/放鬆時**\n- 被撫摸時\n- 進食時\n- 躺在你身邊時\n\n**需要安慰時**\n- 生病或受傷的貓咪也會發出呼嚕聲\n- 這是一種自我安慰機制\n- 研究顯示呼嚕聲的頻率（25-50Hz）有助於骨骼修復！\n\n**壓力時**\n- 去獸醫時的呼嚕聲可能代表緊張\n\n**💡 判斷方式**\n結合肢體語言：耳朵向前 + 尾巴豎直 + 呼嚕 = 快樂；耳朵後壓 + 身體縮小 + 呼嚕 = 不安。'},
  tail:{keys:['尾巴','搖尾巴','尾'],
    ans:'🐱 **尾巴語言解讀**\n\n**尾巴豎直** → 快樂、自信、打招呼\n**尾巴豎直+尾端微彎** → 非常開心\n**尾巴膨脹** → 受到驚嚇或極度憤怒\n**尾巴低垂** → 不安、生病或沮喪\n**尾巴快速搖動** → 注意！這是警告，不是開心（狗狗才是）\n**尾巴慢慢搖動** → 專注觀察中\n**尾巴夾在兩腿間** → 極度恐懼或服從\n\n💡 貓咪搖尾巴 ≠ 開心，這是和狗狗最大的不同點！'},
  eye:{keys:['眼神','眼睛','瞇眼','慢眨眼','閉眼'],
    ans:'🐱 **眼睛語言解讀**\n\n**慢慢眨眼** → 這是貓咪的「愛你」！回應牠同樣的慢眨眼\n**瞳孔放大（圓形）** → 興奮、恐懼、或光線昏暗\n**瞳孔縮小（細縫）** → 放鬆、或感到威脅\n**直視不眨眼** → 挑戰或威脅\n**半閉眼** → 非常放鬆、信任你\n\n**💡 互動技巧**\n當貓咪對你慢慢眨眼時，你也慢慢眨眼回去，牠會感受到你的愛意，通常會靠近你！'},
  fee:{keys:['費用','多少錢','獸醫費','看診','花費'],
    ans:'🐱 **寵物醫療費用參考**\n\n**基本費用**\n- 一般看診：$300-600\n- 疫苗（每年）：$800-1500\n- 結紮手術：$3000-8000\n- 晶片植入：$500-1000\n\n**常見檢查**\n- 血液檢查：$800-2000\n- X光：$600-1500\n- 超音波：$1000-3000\n\n💡 **建議**\n考慮辦理寵物保險，每月約 $500-1500，可以大幅降低意外醫療費用。'},
  food:{keys:['吃什麼','飼料','罐頭','生食','飲食','不能吃','禁忌'],
    ans:'🐱 **貓咪飲食指南**\n\n**✅ 可以吃**\n- 高品質貓糧（乾糧/濕食）\n- 水煮雞胸肉（無鹽無調味）\n- 水煮鮭魚（去骨）\n- 少量起司\n\n**❌ 絕對不能吃**\n- 洋蔥、大蒜（會破壞紅血球）\n- 巧克力（含可可鹼，中毒）\n- 葡萄、葡萄乾\n- 生雞蛋白（含抗生物素蛋白）\n- 牛奶（多數貓咪乳糖不耐）\n- 咖啡、茶\n- 人類零食（含鹽過高）\n\n💡 **建議**\n濕食（罐頭）能補充水分，對泌尿系統很好。建議乾濕食混合搭配。'},
  sleep:{keys:['睡覺','睡眠','睡太多','幾個小時','嗜睡'],
    ans:'🐱 **貓咪睡眠分析**\n\n**正常睡眠時間**\n- 成貓：每天 **12-16 小時**\n- 幼貓/老貓：可達 **18-20 小時**\n\n這是完全正常的！貓咪是掠食者，需要保存大量精力應對狩獵。\n\n**何時需要擔心？**\n- 睡眠時間突然**增加很多**\n- 睡覺時**呼吸異常**（喘息、鼾聲很大）\n- 叫牠沒反應或**反應遲鈍**\n- 同時伴隨不吃不喝\n\n💡 **小知識**\n貓咪有「淺眠」和「深眠」兩種，70% 是淺眠，牠的耳朵即使在睡覺也會轉動偵測聲音！'},
  litter:{keys:['砂盆','貓砂','廁所','不用砂盆','尿在外面','排泄'],
    ans:'🐱 **砂盆問題分析**\n\n**貓咪不用砂盆可能的原因**\n\n1. **砂盆不夠乾淨** → 每天清理，每週全換\n2. **位置不對** → 避免放在嘈雜或角落位置\n3. **砂盆太小** → 應該是貓咪身長的 1.5 倍\n4. **貓砂類型不喜歡** → 嘗試換不同材質\n5. **泌尿道問題** → 若頻繁跑砂盆卻少量，可能是結石或感染\n\n**多貓家庭**\n砂盆數量 = 貓的數量 + 1\n\n**【何時就醫】**\n⚠️ 若發現**血尿、尿量極少或完全無尿**，這是緊急狀況，立即就醫！'},
  weight:{keys:['體重','太胖','太瘦','肥胖','減重'],
    ans:'🐱 **貓咪體重管理**\n\n**理想體重**\n- 一般成貓：3.5-5 公斤\n- 大型品種（緬因貓等）：可達 7-9 公斤\n\n**判斷方式（觸感法）**\n- ✅ 正常：摸得到肋骨但看不到\n- ⚠️ 過重：摸不太到肋骨\n- ⚠️ 過輕：肋骨清晰可見\n\n**減重建議**\n- 計算每日熱量需求（依體重和活動量）\n- 少量多餐，不要放任自助\n- 增加玩耍時間\n- 用益智餵食玩具\n\n💡 貓咪減重不能太快！每週減少不超過 1-2% 體重，否則容易引發脂肪肝。'},
  vaccine:{keys:['疫苗','打針','預防針','驅蟲','寄生蟲','跳蚤'],
    ans:'🐱 **疫苗與預防醫療指南**\n\n**核心疫苗（每年/每三年）**\n- 三合一疫苗（貓瘟、貓鼻氣管炎、貓卡里西病毒）\n- 狂犬病疫苗（法律規定）\n\n**首次接種時程**\n- 8 週：第一劑三合一\n- 12 週：第二劑三合一\n- 16 週：第三劑 + 狂犬病\n\n**體內驅蟲**：每 3 個月一次\n**體外驅蟲**（跳蚤/蜱）：每月一次\n\n💡 **室內貓也需要疫苗**，因為病毒可能從鞋底帶入家中。'},
  shedding:{keys:['掉毛','脫毛','大量掉毛','毛掉很多','禿'],
    ans:'🐱 **掉毛狀況分析**\n\n**【行為解析】**\n貓咪正常會換毛，但異常大量掉毛、出現禿斑或皮膚問題就需要留意。\n\n**【壓力指數】**：35/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 季節性換毛（春秋季正常現象）\n- 壓力或焦慮引發過度舔毛、自我拔毛\n- 跳蚤、疥癬等寄生蟲\n- 過敏（食物、環境、清潔用品）\n- 皮膚或黴菌感染\n- 甲狀腺、腎臟、肝臟等內分泌疾病\n\n**【改善建議】**\n- 每天梳毛減少脫落毛髮堆積\n- 確保飲食均衡，補充Omega-3\n- 檢查皮膚是否有紅疹、結痂或寄生蟲\n\n**【何時就醫】**\n⚠️ 若出現明顯禿斑、皮膚紅腫破皮、或掉毛伴隨食慾不振，請就醫檢查。\n\n參考來源：VCA Animal Hospitals, Chewy, Zoetis Petcare'},
  sneeze:{keys:['打噴嚏','噴嚏','流鼻水','鼻塞','鼻涕'],
    ans:'🐱 **打噴嚏／流鼻水分析**\n\n**【行為解析】**\n偶爾打噴嚏是正常的清潔反射，但持續性的噴嚏和鼻水通常代表上呼吸道感染。\n\n**【壓力指數】**：40/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 病毒性上呼吸道感染（貓鼻氣管炎、卡里西病毒），約80-90%的貓帶有皰疹病毒，壓力時容易復發\n- 環境刺激物（灰塵、香水、清潔劑、煙味）\n- 細菌感染（常為病毒感染後的次發感染）\n- 牙齒或牙齦問題影響鼻竇\n- 鼻腔異物或黴菌感染\n\n**【改善建議】**\n- 觀察鼻涕顏色：清澈通常較輕微，黃綠色或濃稠需注意\n- 保持環境清潔，減少粉塵與刺激性氣味\n- 使用蒸氣（如浴室開熱水）幫助鼻腔暢通\n\n**【何時就醫】**\n⚠️ 若症狀持續超過2-3天、鼻水變黃綠色或帶血、合併食慾下降或呼吸急促，請就醫。\n\n參考來源：Bond Vet, Disney Pet Hospital, Bulger Veterinary Hospital'},
  eye_discharge:{keys:['眼屎','流眼淚','眼睛分泌物','結膜炎','眼睛紅'],
    ans:'🐱 **眼睛分泌物分析**\n\n**【行為解析】**\n貓咪眼睛有自我清潔機制，少量清澈分泌物正常，但異常分泌物可能是感染徵兆。\n\n**【壓力指數】**：35/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 結膜炎（細菌、病毒感染或刺激物引起，會有紅腫、瞇眼）\n- 貓皰疹病毒（常合併打噴嚏、流鼻水）\n- 淚管阻塞（白色貓較常見，分泌物會沿著臉部流下）\n- 過敏反應\n\n**【改善建議】**\n- 用乾淨棉花沾溫水或生理食鹽水輕輕擦拭\n- 觀察分泌物顏色：清澈通常較輕微，黃綠色需注意\n- 保持環境清潔減少刺激\n\n**【何時就醫】**\n⚠️ 分泌物變成黃色、綠色或帶血，伴隨瞇眼、紅腫、畏光，或眼睛表面出現白霧，請立即就醫，眼睛問題延誤可能影響視力。\n\n參考來源：Berthoud Animal Hospital, VCA Animal Hospitals'},
  bad_breath:{keys:['口臭','嘴巴臭','牙齒','牙齦','牙結石'],
    ans:'🐱 **口臭分析**\n\n**【行為解析】**\n輕微口腔氣味正常，但明顯惡臭通常代表口腔或全身性問題。\n\n**【壓力指數】**：30/100\n\n**【風險等級】**：低至中\n\n**常見原因**\n- 牙結石堆積（幾乎都是細菌造成，最常見原因）\n- 牙齦炎、牙周病\n- 口腔潰瘍或腫瘤\n- 嚴重情況：腎臟疾病會讓口氣有氨味、糖尿病可能有特殊酮味\n\n**【改善建議】**\n- 定期幫貓咪刷牙或使用潔牙產品\n- 提供潔牙零食或專用乾糧減少牙結石\n- 觀察是否伴隨流口水、不願進食硬食\n\n**【何時就醫】**\n⚠️ 若口臭非常嚴重（如腐肉味）、合併嗜睡、食慾不振、體重下降，可能是腎臟或其他系統性疾病，請盡快就醫檢查。\n\n參考來源：VCA Animal Hospitals, JustAnswer Vet'},
  overgrooming:{keys:['過度舔毛','一直舔','舔到禿','拔毛','過度理毛'],
    ans:'🐱 **過度舔毛行為分析**\n\n**【行為解析】**\n適度理毛是正常行為，但過度舔到禿毛、皮膚發紅，通常代表壓力或皮膚問題。\n\n**【壓力指數】**：55/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 壓力與焦慮（環境改變、新成員、噪音）導致自我安慰性舔毛\n- 跳蚤、疥癬等寄生蟲引起搔癢\n- 食物或環境過敏\n- 疼痛（舔特定部位可能是該處不適，如關節或腹部）\n\n**【改善建議】**\n- 觀察舔毛集中的部位，可能反映該處不適\n- 增加環境豐富化（玩具、貓抓板、躲藏空間）減少壓力\n- 檢查皮膚是否有寄生蟲或皮屑\n\n**【何時就醫】**\n⚠️ 若出現明顯禿斑、皮膚破損出血、或合併其他行為改變，請就醫排除疼痛或皮膚疾病。\n\n參考來源：Zoetis Petcare, TotalVet'},
  fever:{keys:['發燒','體溫高','發熱','體溫'],
    ans:'🐱 **發燒症狀分析**\n\n**【行為解析】**\n貓咪正常體溫約38-39.2°C，超過39.5°C可能為發燒，常合併食慾不振、嗜睡。\n\n**【壓力指數】**：70/100\n\n**【風險等級】**：高\n\n**常見原因**\n- 病毒或細菌感染\n- 預防針注射後的短暫免疫反應\n- 發炎反應（傷口、膿瘡）\n- 中暑（高溫環境下）\n\n**【改善建議】**\n- 觸摸耳朵、腳掌是否異常溫熱（僅供初步參考，無法取代體溫計）\n- 確保飲水充足，環境涼爽通風\n- 觀察是否合併嗜睡、食慾不振、呼吸急促\n\n**【何時就醫】**\n⚠️ 貓咪發燒合併精神萎靡、不吃不喝超過24小時，或體溫持續偏高，請立即就醫，發燒本身是症狀，需找出根本原因。\n\n參考來源：VCA Animal Hospitals'},
  inappropriate_urination:{keys:['亂尿尿','尿在床上','尿在沙發','到處尿尿','噴尿'],
    ans:'🐱 **亂尿尿行為分析**\n\n**【行為解析】**\n貓咪在砂盆外排尿（不論是大量排尿還是噴尿標記）背後可能是醫療或行為問題，約60%因不當排尿就診的貓被發現有下泌尿道疾病(FLUTD)。\n\n**【壓力指數】**：65/100\n\n**【風險等級】**：中至高\n\n**常見原因**\n- 醫療因素：膀胱炎、尿路感染、結石、糖尿病、腎臟病、關節炎導致行動不便\n- 環境壓力：新成員、搬家、噪音、改變家具擺放\n- 砂盆問題：不夠乾淨、位置不佳、數量不足（建議貓數+1個）\n- 多貓相處：貓咪間的緊張關係造成砂盆迴避\n- 噴尿標記：常見於未絕育公貓，會對著垂直表面噴尿\n\n**【改善建議】**\n- 先排除醫療問題：觀察排尿量、頻率、是否用力\n- 增加砂盆數量與清潔頻率\n- 找出環境壓力來源並改善\n\n**【何時就醫】**\n⚠️ 若發現貓咪頻繁進出砂盆卻排尿極少、用力哀叫、或完全無尿，這是泌尿道阻塞的緊急狀況，請立即就醫！\n\n參考來源：VCA Animal Hospitals, ARM & HAMMER, Royal Canin'},
  cat_aggression:{keys:['貓咪打架','互相攻擊','貓咪不合','貓咪欺負','貓咪兇對方'],
    ans:'🐱 **多貓攻擊行為分析**\n\n**【行為解析】**\n貓與貓之間的攻擊行為可能是玩耍、地位競爭，或真正的敵意衝突，需觀察整體情境判斷。\n\n**【壓力指數】**：60/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 領地競爭：資源（食物、砂盆、休息空間）不足引發衝突\n- 引入新貓時適應期沒有循序漸進\n- 其中一隻貓有疼痛或疾病，變得易怒（健康問題可能表現為攻擊性增加）\n- redirected aggression：因外部刺激（如看到窗外的貓）情緒轉移到同伴身上\n\n**【改善建議】**\n- 增加資源數量並分散位置：食物碗、水碗、砂盆（每貓+1個）、休息區\n- 提供充足的垂直空間（貓跳台）讓每隻貓有自己的領域\n- 若有貓咪突然變得易怒，先排除疼痛或疾病\n\n**【何時就醫】**\n⚠️ 若攻擊造成傷口、或某隻貓持續被孤立不敢吃飯喝水，請就醫並諮詢行為專家。\n\n參考來源：VCA Animal Hospitals, ASPCA'},
  excessive_meow:{keys:['一直叫','整天叫','過度叫','吵鬧','大叫'],
    ans:'🐱 **過度叫聲行為分析**\n\n**【行為解析】**\n貓咪叫聲是溝通方式，但頻率突然增加或音量改變，通常代表需求未被滿足或身體不適。\n\n**【壓力指數】**：45/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 需求型：肚子餓、想要陪伴、想出門\n- 發情期：未絕育貓咪會發出特殊的長叫聲\n- 老年認知功能下降：老貓對環境感到困惑而叫\n- 疼痛或不適：甲狀腺問題等疾病會讓貓咪叫聲變化\n- 分離焦慮：主人不在時持續叫\n\n**【改善建議】**\n- 記錄叫聲發生的時間點和情境\n- 確保基本需求被滿足（食物、水、清潔砂盆、陪伴）\n- 睡前充分玩耍消耗精力\n\n**【何時就醫】**\n⚠️ 若叫聲突然改變音調、伴隨其他行為改變（如食慾、活動力下降），尤其是老年貓，建議就醫排除甲狀腺或認知功能問題。\n\n參考來源：VCA Animal Hospitals'},
  hiding_food:{keys:['藏食物','把食物叼走','藏玩具','把東西藏起來'],
    ans:'🐱 **藏食物/物品行為分析**\n\n**【行為解析】**\n這是貓咪的本能行為，源自野外祖先「儲存食物」與「保護獵物」的習慣。\n\n**【壓力指數】**：15/100\n\n**【風險等級】**：低（多為正常行為）\n\n**常見原因**\n- 野性本能：野外貓咪會把多餘食物藏起來避免被其他動物搶走\n- 玩具當作「獵物」：把玩具叼到隱密處是模擬狩獵儲藏行為\n- 多貓家庭：擔心食物被其他貓搶走而藏起來\n- 焦慮：在感到不安全時，把重要物品（食物、玩具）移到「安全基地」\n\n**【改善建議】**\n- 通常不需要特別處理，這是正常天性\n- 若食物被藏在隱密處導致腐壞，建議固定餵食時間並及時收走\n- 多貓家庭可分開餵食減少競爭感\n\n**【何時就醫】**\n這通常是正常行為，但若同時出現過度防衛、不讓人靠近食物且伴隨攻擊性，建議觀察是否有資源焦慮問題。'},
  tail_chasing:{keys:['追尾巴','咬自己尾巴','轉圈圈','原地打轉'],
    ans:'🐱 **追尾巴/原地打轉行為分析**\n\n**【行為解析】**\n小貓偶爾追自己的尾巴是玩耍探索行為，但成貓頻繁或強迫性地追咬尾巴需要留意。\n\n**【壓力指數】**：40/100\n\n**【風險等級】**：低至中\n\n**常見原因**\n- 幼貓玩耍：發現尾巴會動，當作玩具追逐，隨年紀增長會減少\n- 過度興奮或精力過剩：缺乏足夠的活動量和刺激\n- 強迫行為（壓力相關）：在環境壓力大時，貓咪可能發展出重複性的自我刺激行為\n- 尾巴或脊椎疼痛：若貓咪對尾巴特定部位特別敏感或攻擊性地咬，可能是該處不適\n\n**【改善建議】**\n- 增加互動玩耍時間，提供足夠的精力釋放管道\n- 觀察行為發生的頻率與情境，是否與特定壓力源相關\n- 檢查尾巴是否有外傷、腫脹或異常反應\n\n**【何時就醫】**\n⚠️ 若貓咪對尾巴出現攻擊性咬咬到受傷、或行為變成強迫性重複且無法被打斷，建議就醫排除神經或皮膚問題，並諮詢行為專家。'},
  excessive_thirst:{keys:['喝很多水','一直喝水','口渴','喝水量增加','多喝水'],
    ans:'🐱 **喝水量增加分析**\n\n**【行為解析】**\n貓咪喝水量明顯增加（醫學上稱「多渴症」）常是身體在代償水分流失，是健康狀況的重要指標。\n\n**【壓力指數】**：65/100\n\n**【風險等級】**：中至高\n\n**常見原因**\n- 慢性腎臟病：老年貓最常見原因，10歲以上貓約40%、15歲以上約80%有腎臟問題，腎臟過濾功能下降使尿液變多，連帶喝水量增加\n- 糖尿病：常見於過重的中年公貓，血糖過高會把水分帶入尿液，造成又喝又尿的循環，常伴隨體重下降但食慾旺盛\n- 甲狀腺機能亢進：代謝加快，常伴隨食慾大增但體重減輕、活動量變大\n- 泌尿道感染或結石：排尿不適會讓貓咪想喝更多水\n- 環境因素：天氣炎熱、活動量大、或從濕食改為乾糧也會增加飲水量\n\n**【改善建議】**\n- 記錄24小時內的飲水量變化做比較\n- 觀察是否合併其他症狀：體重變化、食慾改變、活動力、毛髮光澤\n- 若剛換成乾糧飲食，這可能是正常生理反應\n\n**【何時就醫】**\n⚠️ 喝水量持續明顯增加超過幾天，尤其是中老年貓，或合併體重下降、食慾改變，請盡快安排血液和尿液檢查，許多重要疾病（腎臟病、糖尿病、甲狀腺）的早期徵兆就是喝水變多。\n\n參考來源：International Cat Care, PetMD, MetLife Pet Insurance'},
  limping:{keys:['跛腳','走路一拐一拐','腳受傷','瘸腿','腳痛','不敢踩地'],
    ans:'🐱 **跛腳分析**\n\n**【行為解析】**\n跛腳對貓咪來說從來不是「正常」現象，一定代表某處感到疼痛或不適，貓咪天性會隱藏疼痛，所以一旦表現出跛腳，通常問題已存在一段時間。\n\n**【壓力指數】**：60/100\n\n**【風險等級】**：中至高\n\n**常見原因**\n- 外傷：扭傷、拉傷、骨折，常因跳躍、墜落造成\n- 異物刺入：腳掌或趾間卡入玻璃碎片、刺、小石子等\n- 退化性關節炎：老年貓常見，超過22%成貓有影像學證據，但表現不明顯，可能只是不願跳上家具或減少使用某些休息點\n- 感染：被咬傷（打架傷口）引發的細菌感染、腫脹\n- 神經性問題：若合併無力、拖行、失去協調感，可能涉及神經系統\n- 緊急狀況：後肢突然完全無法行動、劇烈疼痛，可能是血栓堵塞（saddle thrombus），須立即就醫\n\n**【改善建議】**\n- 檢查腳掌、趾間是否有異物、傷口、腫脹或發熱\n- 觀察跛腳是間歇性還是持續性，與活動量的關係\n- 暫時限制貓咪活動範圍，避免跳躍\n\n**【何時就醫】**\n⚠️ 若跛腳持續超過24小時、找不到明顯原因、合併腫脹發熱，或後肢突然完全無力且劇烈疼痛（緊急狀況），請立即就醫。\n\n參考來源：Vetster, PetMD, Styllacare'},
  coughing:{keys:['咳嗽','乾咳','咳個不停','喘氣','呼吸困難','氣喘'],
    ans:'🐱 **咳嗽分析**\n\n**【行為解析】**\n貓咪咳嗽和吐毛球常被混淆，但兩者來自不同部位：吐毛球是腹部用力的「嗯嗯嗯-嗝」聲，來自消化道；咳嗽是胸腔短促的「咳！咳！」聲，來自呼吸道。貓咪很少無故咳嗽，幾乎都有潛在原因。\n\n**【壓力指數】**：55/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 貓氣喘：影響1-5%的貓，慢性發炎導致呼吸道腫脹收縮，每週咳嗽超過幾次且沒有吐出毛球，需特別注意\n- 過敏：對灰塵、花粉、霉菌或清潔劑等環境刺激物過敏\n- 上呼吸道感染：常合併打噴嚏、流鼻水、流眼淚\n- 心臟疾病：較少見，但中老年貓的慢性咳嗽需列入考慮\n- 異物或寄生蟲：誤吸入異物或心絲蟲感染\n\n**【改善建議】**\n- 區分「吐毛球」與「咳嗽」：吐毛球通常會帶出毛髮，咳嗽則多為乾咳不產生東西\n- 記錄咳嗽頻率：偶爾的吐毛球正常，但每週多次的乾咳需注意\n- 觀察是否合併呼吸急促、張口呼吸、牙齦發藍\n\n**【何時就醫】**\n⚠️ 若出現呼吸困難、牙齦發藍、頻繁乾咳卻沒有毛球、或合併噴嚏與喘鳴聲，請盡快就醫，氣喘和心臟問題延誤治療可能危及生命。\n\n參考來源：VCA Animal Hospitals, Trudell Animal Health, Catster'},
  ear_scratching:{keys:['抓耳朵','耳朵癢','甩頭','耳屎','耳朵臭','搖頭'],
    ans:'🐱 **抓耳朵/甩頭分析**\n\n**【行為解析】**\n貓咪頻繁抓耳朵或甩頭，是耳道不適最常見的表現，通常代表耳朵內有發炎、寄生蟲或感染。\n\n**【壓力指數】**：45/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 耳疥蟲（耳蟎）：高度傳染性的微小寄生蟲，會造成深色、像咖啡渣一樣的耳垢，幼貓和戶外貓特別常見\n- 細菌或酵母菌感染：耳道潮濕或耳垢堆積容易孳生，常有異味\n- 過敏：環境或食物過敏的貓咪常合併耳朵問題\n- 異物：草籽、小蟲等卡入耳道（貓咪較少見，狗較常見）\n- 耳血腫：因劇烈甩頭或抓耳造成耳翼內血管破裂腫脹\n\n**【改善建議】**\n- 檢查耳道是否有深色顆粒狀耳垢（疑似耳疥蟲）或異味分泌物\n- 不要自行用棉花棒深入耳道清潔，可能將髒污推得更深\n- 若懷疑耳疥蟲，需要就醫確診並治療所有同住貓咪（高度傳染）\n\n**【何時就醫】**\n⚠️ 若耳朵有異味分泌物、紅腫、耳翼腫脹（血腫），或甩頭抓耳造成自傷，請就醫診斷。耳蟎和感染外觀類似但治療方式不同，需專業診斷。\n\n參考來源：PetMD, Blue Cross, FirstVet, Vetster'},
  weight_loss_appetite:{keys:['變瘦','體重下降','瘦了','吃很多卻瘦','食慾大增'],
    ans:'🐱 **體重下降但食慾正常/增加分析**\n\n**【行為解析】**\n貓咪「吃很多卻持續變瘦」是一個重要警訊，看似矛盾的現象通常指向代謝性疾病。\n\n**【壓力指數】**：70/100\n\n**【風險等級】**：高\n\n**常見原因**\n- 甲狀腺機能亢進：8歲以上老年貓最常見的內分泌疾病之一，約95%是良性腫瘤造成甲狀腺素過量分泌，代謝過快導致體重下降，常合併食慾旺盛、活動量增加、易躁動、心跳加快、毛髮粗糙無光澤\n- 糖尿病：身體無法有效利用血糖，即使食慾正常或增加仍會消瘦，常合併喝水量和尿量增加\n- 腸胃道寄生蟲：營養被蟲體吸收導致消瘦\n- 腸胃道疾病（如發炎性腸病）：影響營養吸收\n\n**【改善建議】**\n- 記錄體重變化趨勢（建議每月固定量一次）\n- 觀察是否合併：喝水量、活動量、毛髮狀況、心跳速度的改變\n- 老年貓（8歲以上）建議定期健康檢查含甲狀腺檢測\n\n**【何時就醫】**\n⚠️ 體重持續下降合併食慾正常或增加，是需要盡快就醫做血液檢查的重要警訊，甲狀腺機能亢進和糖尿病都需要專業診斷與長期管理，早期發現預後較好。\n\n參考來源：VCA Animal Hospitals, PetMD, Texas A&M Veterinary Medicine'},
  drooling:{keys:['流口水','口水','流涎','嘴巴濕','滴口水'],
    ans:'🐱 **流口水分析**\n\n**【行為解析】**\n貓咪的口腔通常比狗乾燥，正常不會大量流口水。極度放鬆（呼嚕、踩奶）時偶爾少量流口水正常，但持續或大量流口水通常代表口腔不適或全身性問題。\n\n**【壓力指數】**：45/100\n\n**【風險等級】**：中\n\n**常見原因**\n- 牙齒疾病：最常見原因，牙結石、牙齦炎、牙周病、牙齒吸收病灶造成疼痛，常合併口臭、進食困難、用單側咀嚼\n- 噁心反胃：腸胃不適、毛球、暈車、吃到變質食物時的身體反應，常伴隨舔嘴唇、嘔吐\n- 口腔異物或外傷：線狀異物纏繞舌頭、被咬傷、燙傷\n- 中毒：誤食有毒植物、清潔劑、人類藥物，流口水可能是身體試圖排出毒物的反應\n- 情緒性流口水：極度放鬆（呼嚕時）或極度緊張（看獸醫、坐車）時都可能出現\n\n**【改善建議】**\n- 觀察情境：是進食時、緊張時，還是無故發生\n- 檢查口腔是否有異物纏繞、紅腫、潰瘍\n- 留意口水顏色，若帶血絲需特別注意\n\n**【何時就醫】**\n⚠️ 若流口水合併嘔吐、食慾下降、口臭、口水帶血，或懷疑誤食有毒物質，請立即就醫。情緒性流口水通常會隨情境結束而停止，若持續不停則需檢查。\n\n參考來源：PetMD, Vetster, Groveway Pet Hospital'},
  lethargy:{keys:['沒精神','活力下降','不愛動','懶懶的','突然變懶','提不起勁'],
    ans:'🐱 **精神不振/活力下降分析**\n\n**【行為解析】**\n貓咪天生愛睡覺，但「懶惰」和「精神不振」不同：懶惰的貓在清醒時仍對食物、玩具有反應；精神不振的貓即使醒著也對周圍事物缺乏興趣、反應遲緩。突然的精神改變是身體發出的重要警訊。\n\n**【壓力指數】**：65/100\n\n**【風險等級】**：中至高\n\n**常見原因**\n- 感染或發炎：發燒、上呼吸道感染等急性疾病常先表現為精神不振\n- 貧血：紅血球不足導致帶氧能力下降，造成持續疲倦\n- 代謝性疾病：腎臟病、肝臟疾病、糖尿病等慢性病常伴隨漸進性活力下降\n- 心臟疾病：心臟無法有效打血，全身供氧不足\n- 疼痛：關節炎、外傷等疼痛會讓貓咪減少活動以避免不適\n- 疫苗反應：接種後1-2天內輕微疲倦屬正常\n\n**【改善建議】**\n- 區分程度：輕度（不太想玩）、中度（完全不互動）、重度（不願移動、抬不起頭）\n- 觀察是否合併：食慾、飲水、排泄、呼吸的變化\n- 記錄是突然發生還是漸進式的改變\n\n**【何時就醫】**\n⚠️ 若精神不振是突然發生、合併食慾廢絕或無法站立行走，請立即就醫，這可能是低血糖、貧血或嚴重感染的緊急徵兆。漸進式的活力下降在中老年貓也應安排健康檢查排除慢性疾病。\n\n參考來源：Cats.com, PetMD, VEG ER for Pets'},
  constipation:{keys:['便秘','沒有大便','大便很硬','大不出來','蹲廁所很久','用力大便'],
    ans:'🐱 **便秘分析**\n\n**【行為解析】**\n正常貓咪每24-36小時排便一次。若貓咪頻繁進出砂盆卻只排出少量硬便，或超過48-72小時未排便，就需要留意。\n\n**【壓力指數】**：50/100\n\n**【風險等級】**：中\n\n**重要提醒：先確認是便秘還是排尿困難**\n貓咪在砂盆蹲著用力，可能是便秘，也可能是無法排尿（泌尿道阻塞）。若是無法排尿，24-48小時內可能致命。請先確認砂盆是否有尿液結塊。\n\n**常見原因**\n- 水分不足：乾糧為主飲食容易導致糞便乾硬\n- 毛球堆積：大量毛髮在腸道積累影響排便\n- 缺乏運動：活動量不足影響腸道蠕動\n- 潛在疾病：腎臟病、糖尿病都可能導致便秘\n- 嚴重情況：巨結腸症（megacolon）是長期便秘未治療後的嚴重併發症\n\n**【改善建議】**\n- 增加飲水：提供流動水源、增加濕食比例\n- 一小茶匙純南瓜泥加入食物可幫助排便\n- 每天至少10-15分鐘互動玩耍增加運動量\n\n**【何時就醫】**\n⚠️ 超過48-72小時未排便、用力哀叫、腹部腫脹，請立即就醫。\n\n參考來源：PetMD, Vetster, SpectrumCare, WebVet'},
  skin_allergy:{keys:['皮膚癢','一直抓癢','皮膚紅','皮屑','皮膚病','過敏','皮膚結痂'],
    ans:'🐱 **皮膚過敏/搔癢分析**\n\n**【行為解析】**\n持續搔抓、過度舔毛、或毛髮對稱性脫落，是皮膚出問題的常見訊號。\n\n**【壓力指數】**：45/100\n\n**【風險等級】**：中\n\n**三大類型**\n- 跳蚤過敏性皮膚炎（最常見）：對跳蚤唾液過敏，即使一隻跳蚤也會引發強烈反應，常見於尾根部、背部搔癢脫毛\n- 環境過敏（異位性皮膚炎）：對灰塵、花粉、黴菌過敏，症狀隨季節變化，是終身疾病\n- 食物過敏：對特定蛋白質（雞肉、牛肉、魚）過敏，全年不分季節，常合併消化問題\n\n**常見症狀**\n- 搔抓頭頸部、臉部或全身\n- 對稱性毛髮稀疏脫落（腹部、背部）\n- 皮膚小結痂（粟粒性皮膚炎）\n\n**【改善建議】**\n- 定期使用跳蚤預防藥物（室內貓也需要）\n- 觀察症狀是否有季節性規律\n- 避免香氛清潔劑、芳香劑等刺激物\n\n**【何時就醫】**\n⚠️ 皮膚過敏是慢性病，無法根治只能控制。搔抓造成皮膚破損感染、或症狀持續惡化，請就醫。\n\n參考來源：VCA Animal Hospitals, PetMD, Dutch, Petfolk'},
  // 通用回答
  general:{keys:[],
    ans:''}
};

function staticAI(txt, sys, mode){
  var q=(txt||'').toLowerCase();
  var matched=null;
  var maxScore=0;

  // Find best matching topic
  for(var topic in KB){
    if(topic==='general') continue;
    var keys=KB[topic].keys;
    var score=0;
    for(var i=0;i<keys.length;i++){
      if(q.indexOf(keys[i])!==-1) score++;
    }
    if(score>maxScore){maxScore=score;matched=topic;}
  }

  // If analyze mode and we have a match, return structured analysis
  if(matched&&maxScore>0){
    var ans=KB[matched].ans;
    // Add follow-up question
    ans+='\n\n💬 還有其他想了解的嗎？例如：貓咪的年齡、品種，或是這個情況持續多久了？';
    return ans;
  }

  // General cat/pet questions - pattern matching
  if(q.match(/幾歲|年齡|壽命|多久/)){
    return '🐱 **貓咪的壽命與年齡**\n\n室內貓平均壽命：**12-18 年**\n室外貓平均壽命：5-7 年（危險較多）\n\n**貓咪年齡換算人類年齡**\n- 1歲 = 人類約 15 歲\n- 2歲 = 人類約 24 歲\n- 每增加 1 歲 ≈ 人類 4 歲\n- 10歲 = 人類約 56 歲\n\n💡 提供良好的飲食、定期健康檢查和充足的愛，可以讓貓咪活得更長更健康！';
  }
  if(q.match(/品種|哪種|推薦|選|養什麼/)){
    return '🐱 **熱門貓咪品種推薦**\n\n**適合新手**\n- 🐈 **美國短毛貓**：個性溫和、好照顧\n- 🐈 **英國短毛貓**：安靜獨立、不黏人\n- 🐈 **混種貓（米克斯）**：體質佳、個性多元\n\n**愛撒嬌**\n- 🐱 **布偶貓**：超溫馴，像布偶一樣任人抱\n- 🐱 **波斯貓**：安靜優雅\n- 🐱 **暹羅貓**：話很多，超黏主人\n\n**活潑好動**\n- 🐈 **阿比西尼亞貓**\n- 🐈 **孟加拉貓**\n\n💡 建議先考慮領養米克斯，既省費用又救了一條命！';
  }
  if(q.match(/新貓|第一次|剛養|剛帶回|帶回家/)){
    return '🐱 **新貓到家指南**\n\n**第一天最重要：給空間！**\n\n1. **準備「安全小房間」** — 先讓牠在一個小空間適應\n2. **不要強迫互動** — 讓牠自己決定何時出來\n3. **食水砂盆放齊** — 都放在房間內\n4. **保持安靜** — 第一週避免大聲音或陌生人\n\n**適應時間**\n- 膽大的貓：1-3 天\n- 一般貓：1-2 週\n- 膽小的貓：1-2 個月\n\n**注意事項**\n✅ 讓牠聞你的手背（不要伸手指）\n✅ 說話聲音輕柔\n❌ 不要盯著牠的眼睛\n❌ 不要追著牠跑\n\n💡 耐心是關鍵，信任需要時間建立！';
  }
  if(q.match(/多貓|兩隻|第二隻|新貓|介紹|認識/)){
    return '🐱 **多貓家庭相處指南**\n\n**引入新貓的步驟（重要！）**\n\n1. **氣味交換**（第1-3天）\n   - 用毛巾擦新貓，放在原住貓旁邊\n2. **聲音接觸**（第4-7天）\n   - 隔著門讓牠們聽到彼此\n3. **視覺接觸**（第2週）\n   - 用門縫或貓門讓牠們看到對方\n4. **正式見面**（第3週）\n   - 在中性空間短暫接觸\n\n**多貓資源配置**\n- 砂盆：每貓 + 1個\n- 碗：分開放，避免競爭\n- 高處空間：讓貓咪有自己的領域\n\n💡 急著讓牠們見面是最常犯的錯誤，慢慢來成功率高很多！';
  }

  // Fallback - general helpful response
  var fallbacks=[
    '🐱 這是個好問題！\n\n關於這個主題，我建議：\n- **觀察貓咪的整體狀態**：食慾、精神、活動力是否正常\n- **記錄行為發生的頻率和時間**\n- **如果有任何異常，及早諮詢獸醫**\n\n你可以問我更具體的問題，例如貓咪的特定行為、飲食、健康症狀等，我會給你更詳細的分析！',

function vcatHandleUpload(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var tmpImg=new Image();
    tmpImg.onload=function(){
      var canvas=document.createElement('canvas');
      canvas.width=300; canvas.height=300;
      var ctx=canvas.getContext('2d');
      var sw=tmpImg.width, sh=tmpImg.height;
      var cropH=sh*0.65;
      var cropW=Math.min(sw,cropH);
      var cropX=(sw-cropW)/2;
      ctx.drawImage(tmpImg,cropX,0,cropW,cropH,0,0,300,300);
      var src=canvas.toDataURL('image/jpeg',0.85);
      try{localStorage.setItem('vcat_custom_photo',src);}catch(e){}
      var photo=document.getElementById('vcat-photo');
      if(photo)photo.src=src;
      var sbPhoto=document.getElementById('sb-cat-photo');
      if(sbPhoto)sbPhoto.src=src;
      var sbName=document.getElementById('sb-cat-name');
      if(sbName)sbName.textContent='我的貓咪';
      setVcatMood('excited');vcatWave();vcatSay('好可愛！換成你的貓咪了！🐱',5000);
      setTimeout(function(){input.value='';},200);
    };
    tmpImg.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function initVCat(){
  var wrap=document.getElementById('vcat-wrap');
  if(!wrap)return;
  // add click to vcat div
  var vcatDiv=document.getElementById('vcat');
  if(vcatDiv) vcatDiv.addEventListener('click',vcatClick);
  wrap.style.display='none';

  // ── 長按拖曳移動 ──
  var isDragging=false;
  var dragStartX=0,dragStartY=0;
  var wrapStartX=0,wrapStartY=0;
  var longPressTimer=null;
  var dragMoved=false;

  // 載入儲存的位置
  try{
    var savedPos=localStorage.getItem('vcat_position');
    if(savedPos){
      var pos=JSON.parse(savedPos);
      wrap.style.right='auto';
      wrap.style.left=pos.x+'px';
      wrap.style.top=pos.y+'px';
    }
  }catch(e){}

  function onDragStart(clientX,clientY){
    isDragging=true;dragMoved=false;
    var rect=wrap.getBoundingClientRect();
    wrapStartX=rect.left;
    wrapStartY=rect.top;
    dragStartX=clientX;
    dragStartY=clientY;
    wrap.style.right='auto';
    wrap.style.bottom='auto';
    wrap.style.left=wrapStartX+'px';
    wrap.style.top=wrapStartY+'px';
    wrap.style.transition='none';
    wrap.style.opacity='0.8';
    wrap.style.transform='scale(1.08)';
  }
  function onDragMove(clientX,clientY){
    if(!isDragging)return;
    var dx=clientX-dragStartX;
    var dy=clientY-dragStartY;
    if(Math.abs(dx)>4||Math.abs(dy)>4) dragMoved=true;
    var vw=window.innerWidth,vh=window.innerHeight;
    var newX=Math.max(0,Math.min(wrapStartX+dx,vw-100));
    var newY=Math.max(0,Math.min(wrapStartY+dy,vh-120));
    wrap.style.left=newX+'px';
    wrap.style.top=newY+'px';
  }
  function onDragEnd(){
    if(!isDragging)return;
    isDragging=false;
    wrap.style.transition='';
    wrap.style.opacity='1';
    wrap.style.transform='';
    if(dragMoved){
      try{
        localStorage.setItem('vcat_position',JSON.stringify({
          x:parseInt(wrap.style.left),
          y:parseInt(wrap.style.top)
        }));
      }catch(e){}
    }
  }

  // Touch events（長按 600ms 觸發）
  wrap.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    longPressTimer=setTimeout(function(){
      onDragStart(t.clientX,t.clientY);
      if(navigator.vibrate) navigator.vibrate(30);
    },600);
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    if(isDragging){
      e.preventDefault();
      onDragMove(e.touches[0].clientX,e.touches[0].clientY);
    } else {
      clearTimeout(longPressTimer);
    }
  },{passive:false});
  wrap.addEventListener('touchend',function(){
    clearTimeout(longPressTimer);
    onDragEnd();
  });
  wrap.addEventListener('touchcancel',function(){
    clearTimeout(longPressTimer);
    onDragEnd();
  });

  // Mouse events（桌面測試用，長按 600ms）
  wrap.addEventListener('mousedown',function(e){
    longPressTimer=setTimeout(function(){
      onDragStart(e.clientX,e.clientY);
    },600);
  });
  window.addEventListener('mousemove',function(e){
    onDragMove(e.clientX,e.clientY);
  });
  window.addEventListener('mouseup',function(){
    clearTimeout(longPressTimer);
    onDragEnd();
  });

  // random blink every 3-5s
  setInterval(function(){
    if(vcatMood!=='sleeping') vcatBlink();
  },3500+Math.random()*1500);
  // idle chatter
  setInterval(function(){
    if(wrap.style.display!=='none'&&(vcatMood==='idle'||vcatMood==='happy')){
      var p=MOODS[vcatMood].bubble;
      vcatSay(p[Math.floor(Math.random()*p.length)],3500);
      if(Math.random()<0.4) vcatWave();
    }
  },11000);

  // Load saved photo on boot
  try{
    var saved=localStorage.getItem('vcat_custom_photo');
    if(saved){
      var photo=document.getElementById('vcat-photo');
      if(photo) photo.src=saved;
      var sbPhoto=document.getElementById('sb-cat-photo');
      if(sbPhoto) sbPhoto.src=saved;
      var sbName=document.getElementById('sb-cat-name');
      if(sbName) sbName.textContent='我的貓咪';
    }
  }catch(err){}
}

function lowC_midC_hiC_avgSl(recs){
  var lowC=recs.filter(function(r){return r.risk==='低';}).length;
  var midC=recs.filter(function(r){return r.risk==='中';}).length;
  var hiC=recs.filter(function(r){return r.risk==='高';}).length;
  var avgSl=recs.length?Math.round(recs.reduce(function(s,r){return s+r.sl;},0)/recs.length):0;
  return {lowC:lowC,midC:midC,hiC:hiC,avgSl:avgSl};
}

function drawLineChart(canvas,recs){
  var dpr=window.devicePixelRatio||1;
  var w=canvas.offsetWidth||280;
  var h=120;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  var pad={t:10,r:10,b:20,l:28};
  var cw=w-pad.l-pad.r;var ch=h-pad.t-pad.b;
  var pts=recs.map(function(r,i){return {x:pad.l+i*(cw/(recs.length-1)),y:pad.t+ch-(r.sl/100)*ch,sl:r.sl};});

  // Grid lines
  ctx.strokeStyle='rgba(30,80,160,.08)';ctx.lineWidth=1;
  [0,25,50,75,100].forEach(function(v){
    var y=pad.t+ch-(v/100)*ch;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='rgba(30,80,160,.4)';ctx.font='9px sans-serif';
    ctx.fillText(v,0,y+3);
  });

  // Line
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  pts.slice(1).forEach(function(p){ctx.lineTo(p.x,p.y);});
  ctx.strokeStyle='#5b8ff9';ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();

  // Fill
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+ch);
  pts.forEach(function(p){ctx.lineTo(p.x,p.y);});
  ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.closePath();
  ctx.fillStyle='rgba(91,143,249,.1)';ctx.fill();

  // Dots
  pts.forEach(function(p){
    var c=p.sl>=60?'#f26d6d':p.sl>=35?'#f5a623':'#3ecf8e';
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=c;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });
}

  if(!el||el.offsetParent===null){tutNext();return;}
  el.classList.add('tut-highlight');
