<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隔板競速</title>
<style>
:root{
  --bg:#050505; --cell:#1b1b1f; --cell-hi:#2a2a31; --wall:#ececec;
  --red:#a52a2a; --blue:#2a56b0; --yellow:#e0a82e; --green:#3fa34d;
  --ink:#f2f2f2; --dim:#8a8a93; --g:clamp(10px,2.2vmin,16px);
  --bs:min(96vw, calc(100vh - 300px));
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@supports (height:100dvh){:root{--bs:min(96vw, calc(100dvh - 300px))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 10px}
.panel{width:var(--bs);min-width:300px;display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid #222;border-radius:12px;opacity:.4;transition:opacity .15s}
.panel.top{transform:rotate(180deg)}
.panel.on{opacity:1;border-color:var(--pc)}
.who{display:flex;align-items:center;gap:8px;flex:1;font-size:16px;white-space:nowrap}
.who i{width:18px;height:18px;border-radius:50%;background:var(--pc);display:block}
.who b{font-size:18px;color:var(--pc)}
.panel button{flex:0 0 auto;font:inherit;font-size:16px;padding:10px 14px;border-radius:10px;border:2px solid #333;background:#111;color:var(--ink)}
.panel button.sel{border-color:var(--pc);background:#1f1f24}
.panel button:disabled{opacity:.35}
.row{width:var(--bs);min-width:300px;display:flex;align-items:center;gap:8px}
#msg{flex:1;font-size:15px;text-align:center}
#br{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:2px solid #333;background:#111;color:var(--ink)}
.wrap{width:var(--bs);min-width:300px;border-top:8px solid var(--red);border-bottom:8px solid var(--blue);padding:10px 0}
#board{display:grid;grid-template-columns:repeat(8,1fr var(--g)) 1fr;grid-template-rows:repeat(8,1fr var(--g)) 1fr;aspect-ratio:1;touch-action:manipulation}
.c{background:var(--cell);border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center}
.c.ok{background:var(--cell-hi)}
.c.ok::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--ink);opacity:.55}
.pawn{width:66%;height:66%;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.s{position:relative;border-radius:3px}
.s.ok::before{content:"";position:absolute;inset:-7px;z-index:2}
.wall .s.ok{background:#3b3b44}
.s.w{background:var(--wall)}
</style>
</head>
<body>
<div class="panel top" id="pn0" style="--pc:var(--yellow)">
  <span class="who"><i></i>黃（往下）隔板 <b id="w0"></b></span>
  <button data-p="0" data-m="move">走一步</button><button data-p="0" data-m="wall">放隔板</button>
</div>
<div class="row"><div id="msg"></div><button id="br">重新開始</button></div>
<div class="wrap"><div id="board"></div></div>
<div class="panel" id="pn1" style="--pc:var(--green)">
  <span class="who"><i></i>綠（往上）隔板 <b id="w1"></b></span>
  <button data-p="1" data-m="move">走一步</button><button data-p="1" data-m="wall">放隔板</button>
</div>
<script>
const N=9, NAME=['黃','綠'], COL=['var(--yellow)','var(--green)'];
let st;
function init(){
  st={p:[{r:0,c:4,w:10,goal:8},{r:8,c:4,w:10,goal:0}],turn:0,mode:'move',H:new Set(),V:new Set(),over:false,note:''};
  render();
}
function canStep(r,c,dr,dc,H,V){
  const nr=r+dr,nc=c+dc;
  if(nr<0||nr>=N||nc<0||nc>=N)return false;
  if(dr===1)return !H.has(r+','+c);
  if(dr===-1)return !H.has((r-1)+','+c);
  if(dc===1)return !V.has(r+','+c);
  return !V.has(r+','+(c-1));
}
const D=[[1,0],[-1,0],[0,1],[0,-1]];
function hasPath(p,H,V){
  const seen=new Set([p.r+','+p.c]),q=[[p.r,p.c]];
  while(q.length){
    const [r,c]=q.shift();
    if(r===p.goal)return true;
    for(const [dr,dc] of D){
      if(!canStep(r,c,dr,dc,H,V))continue;
      const k=(r+dr)+','+(c+dc);
      if(!seen.has(k)){seen.add(k);q.push([r+dr,c+dc]);}
    }
  }
  return false;
}
function wallOK(type,r,c){
  const own=type==='H'?st.H:st.V;
  if(own.has(r+','+c))return false;
  const H=new Set(st.H),V=new Set(st.V);
  (type==='H'?H:V).add(r+','+c);
  return st.p.every(p=>hasPath(p,H,V));
}
function moves(){
  const me=st.p[st.turn],op=st.p[1-st.turn],out=[];
  for(const [dr,dc] of D){
    if(canStep(me.r,me.c,dr,dc,st.H,st.V)&&!(op.r===me.r+dr&&op.c===me.c+dc))out.push([me.r+dr,me.c+dc]);
  }
  return out;
}
// 每次行動（走一步或放隔板）結束後都呼叫：檢查勝負，否則換人
function endTurn(action){
  const me=st.p[st.turn];
  if(me.r===me.goal){st.over=true;st.note=NAME[st.turn]+'方獲勝！';return;}
  const prev=st.turn;
  st.turn=1-st.turn;
  st.mode='move';
  st.note=NAME[prev]+'方'+action+'，輪到'+NAME[st.turn]+'方';
}
function render(){
  const b=document.getElementById('board');
  const wallMode=!st.over&&st.mode==='wall'&&st.p[st.turn].w>0;
  b.className=wallMode?'wall':'';
  b.innerHTML='';
  const mv=(!st.over&&st.mode==='move')?moves():[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');
    d.className='c';d.style.gridRow=2*r+1;d.style.gridColumn=2*c+1;
    if(mv.some(m=>m[0]===r&&m[1]===c)){
      d.classList.add('ok');
      d.onclick=()=>{st.p[st.turn].r=r;st.p[st.turn].c=c;endTurn('走了一步');render();};
    }
    st.p.forEach((p,i)=>{if(p.r===r&&p.c===c){const x=document.createElement('div');x.className='pawn';x.style.background=COL[i];d.appendChild(x);}});
    b.appendChild(d);
  }
  const addSlot=(type,r,c)=>{
    const s=document.createElement('div');
    s.className='s';
    if(type==='H'){s.style.gridRow=2*r+2;s.style.gridColumn=2*c+1;}
    else{s.style.gridRow=2*r+1;s.style.gridColumn=2*c+2;}
    if((type==='H'?st.H:st.V).has(r+','+c))s.classList.add('w');
    else if(wallMode&&wallOK(type,r,c)){
      s.classList.add('ok');
      s.onclick=()=>{
        (type==='H'?st.H:st.V).add(r+','+c);
        st.p[st.turn].w--;
        endTurn('放了隔板');
        render();
      };
    }
    b.appendChild(s);
  };
  for(let r=0;r<N-1;r++)for(let c=0;c<N;c++)addSlot('H',r,c);
  for(let r=0;r<N;r++)for(let c=0;c<N-1;c++)addSlot('V',r,c);
  for(let i=0;i<2;i++){
    document.getElementById('w'+i).textContent=st.p[i].w;
    const active=st.turn===i&&!st.over;
    document.getElementById('pn'+i).className='panel'+(i===0?' top':'')+(active?' on':'');
    document.querySelectorAll('button[data-p="'+i+'"]').forEach(btn=>{
      const m=btn.dataset.m;
      btn.disabled=!active||(m==='wall'&&st.p[i].w===0);
      btn.className=(active&&st.mode===m)?'sel':'';
    });
  }
  let t=st.note;
  if(!st.over){
    const hint=st.mode==='move'?'點亮點移動':'點格子之間的縫隙放隔板';
    t=(t?t+'：':'輪到'+NAME[st.turn]+'方：')+hint;
  }
  document.getElementById('msg').textContent=t;
}
document.querySelectorAll('.panel button').forEach(btn=>{
  btn.onclick=()=>{
    const p=+btn.dataset.p;
    if(st.over||st.turn!==p)return;
    st.mode=btn.dataset.m;render();
  };
});
document.getElementById('br').onclick=init;
init();
</script>
</body>
</html>
