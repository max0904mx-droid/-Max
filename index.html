<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>西洋棋</title>
<style>
  :root {
    --bg: #1f2430;
    --panel: #2a3040;
    --text: #eef1f6;
    --muted: #9aa4b8;
    --light: #f0d9b5;
    --dark: #b58863;
    --sel: #f6e05e;
    --move: rgba(40, 120, 60, 0.55);
    --cap: rgba(200, 50, 50, 0.55);
    --last: rgba(255, 220, 80, 0.45);
    --check: rgba(230, 40, 40, 0.75);
    --accent: #4f8cff;
    --bs: 360px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  body { min-height: 100vh; padding: 10px; user-select: none; -webkit-user-select: none; }

  #app { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 auto; }
  #app.land { flex-direction: row; align-items: flex-start; justify-content: center; gap: 20px; }
  #main { width: var(--bs); }
  #side { display: flex; flex-direction: column; align-items: center; width: var(--bs); }
  #app.land #side { width: 300px; align-items: stretch; }
  h1 { font-size: 20px; margin: 4px 0 8px; text-align: center; }
  #status { font-size: 17px; font-weight: 600; padding: 8px 16px; border-radius: 20px; background: var(--panel); margin-bottom: 8px; min-height: 38px; text-align: center; transition: background .3s; align-self: center; max-width: 100%; }
  #status.alert { background: #8a2b2b; }
  #status.end { background: #2f6b3a; }
  #status.think { background: #3a4a78; }

  .cap { width: 100%; min-height: 30px; font-size: 22px; line-height: 30px; letter-spacing: 1px; }
  .cap .lbl { font-size: 12px; color: var(--muted); margin-right: 6px; letter-spacing: 0; }

  #boardWrap { position: relative; width: var(--bs); height: var(--bs); }
  #boardWrap.shake { animation: shake .55s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-9px); } 30% { transform: translateX(9px); }
    45% { transform: translateX(-7px); } 60% { transform: translateX(7px); }
    75% { transform: translateX(-3px); } 90% { transform: translateX(3px); }
  }
  #board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); border: 3px solid #3b2f22; border-radius: 4px; overflow: hidden; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--sel); opacity: .75; }
  .sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--check) 20%, transparent 75%); animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .sq.hint::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--move); }
  .sq.hintcap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid var(--cap); background: transparent; }
  .pc { position: relative; z-index: 2; font-size: calc(var(--bs) * 0.092); line-height: 1; pointer-events: none; }
  .pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 0 1px 3px rgba(0,0,0,.6); }
  .pc.b { color: #111; text-shadow: 0 0 1px rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.4); }
  .pc.drop { animation: drop .22s ease-out; }
  @keyframes drop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .coord { position: absolute; font-size: 10px; font-weight: 700; z-index: 1; pointer-events: none; opacity: .75; }
  .coord.f { right: 3px; bottom: 1px; }
  .coord.r { left: 3px; top: 1px; }
  .sq.l .coord { color: var(--dark); }
  .sq.d .coord { color: var(--light); }

  /* ----- 橫幅動畫 ----- */
  #banner { position: absolute; left: 0; right: 0; top: 50%; height: calc(var(--bs) * 0.27); margin-top: calc(var(--bs) * -0.135); z-index: 20; pointer-events: none; overflow: hidden; }
  #banner .bn { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; font-weight: 800; letter-spacing: .12em; }
  #banner .bn .t { font-size: calc(var(--bs) * 0.075); line-height: 1.15; }
  #banner .bn .s { font-size: calc(var(--bs) * 0.036); font-weight: 600; letter-spacing: .05em; margin-top: 2px; max-width: 86%; text-align: center; line-height: 1.3; }
  #banner .bn.w { background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.96) 14%, rgba(255,255,255,.96) 86%, rgba(255,255,255,0)); color: #1b1b1b; }
  #banner .bn.b { background: linear-gradient(90deg, rgba(10,10,14,0), rgba(10,10,14,.94) 14%, rgba(10,10,14,.94) 86%, rgba(10,10,14,0)); color: #fff; }
  #banner .bn.start { background: linear-gradient(90deg, rgba(212,160,23,0), rgba(212,160,23,.96) 14%, rgba(212,160,23,.96) 86%, rgba(212,160,23,0)); color: #2b1d00; }
  #banner .bn.check { background: linear-gradient(90deg, rgba(200,30,30,0), rgba(200,30,30,.96) 14%, rgba(200,30,30,.96) 86%, rgba(200,30,30,0)); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  #banner .bn.run { animation: sweep 1.4s ease both; }
  #banner .bn.run.long { animation-duration: 2.1s; }
  #banner .bn.check.run .t { animation: zoom .5s ease-out; }
  @keyframes zoom { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes sweep {
    0%   { opacity: 0; transform: translateX(-70%) scaleY(.5); }
    16%  { opacity: 1; transform: translateX(0) scaleY(1); }
    78%  { opacity: 1; transform: translateX(0) scaleY(1); }
    100% { opacity: 0; transform: translateX(70%) scaleY(.7); }
  }

  .btns { display: flex; gap: 8px; margin: 10px 0 6px; flex-wrap: wrap; justify-content: center; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px; font-size: 15px; font-weight: 600; cursor: pointer; touch-action: manipulation; font-family: inherit; }
  button:active { filter: brightness(.9); }
  button.sec { background: var(--panel); border: 1px solid #44506a; }
  button:disabled { opacity: .4; }
  #log { width: 100%; background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 14px; max-height: 120px; overflow-y: auto; color: var(--muted); margin-top: 6px; line-height: 1.9; }
  #app.land #log { max-height: calc(var(--bs) * 0.45); }
  #log b { color: var(--text); font-weight: 600; }
  #log .mv { padding: 1px 5px; border-radius: 5px; }
  #log .mv.cur { background: var(--accent); color: #fff; }
  #log.click .mv { cursor: pointer; }

  /* ----- 彈窗 ----- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .modal .box { background: var(--panel); border-radius: 14px; padding: 20px; text-align: center; max-width: 88vw; }
  .modal .row { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
  .modal .opt { background: var(--light); border-radius: 10px; padding: 6px 10px; font-size: 44px; line-height: 1.1; cursor: pointer; }
  .modal .opt.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; background: var(--dark); }
  .modal .opt.b { color: #111; }

  /* ----- 主選單 ----- */
  #menu { position: fixed; inset: 0; background: var(--bg); z-index: 40; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 16px; }
  .mwrap { width: 100%; max-width: 420px; text-align: center; margin: auto; }
  .mwrap .logo { font-size: 72px; line-height: 1; color: #fff; text-shadow: 0 0 4px #000, 0 4px 14px rgba(0,0,0,.5); }
  .mwrap h2 { font-size: 30px; letter-spacing: .2em; margin: 6px 0 22px; }
  .big { display: block; width: 100%; font-size: 19px; padding: 16px; margin-bottom: 12px; border-radius: 14px; }
  .lab { text-align: left; font-size: 14px; color: var(--muted); margin: 14px 2px 6px; }
  .segs { display: flex; gap: 8px; }
  .segs button { flex: 1; background: var(--panel); border: 2px solid #44506a; }
  .segs button.on { background: var(--accent); border-color: #9bbcff; }
  .hint-t { font-size: 12.5px; color: var(--muted); text-align: left; margin: 6px 2px 14px; min-height: 18px; }
  .rec { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; text-align: left; cursor: pointer; }
  .rec:active { filter: brightness(1.15); }
  .rec .l1 { font-size: 13px; color: var(--muted); }
  .rec .l2 { font-size: 16px; font-weight: 700; margin-top: 3px; }
  .rec .go { font-size: 14px; color: #9bbcff; white-space: nowrap; }
  .empty { color: var(--muted); padding: 26px 0; }

  /* ----- VIP ----- */
  .inp { width: 100%; font-size: 20px; padding: 14px; border-radius: 12px; border: 2px solid #44506a; background: #171b26; color: #fff; text-align: center; letter-spacing: .1em; font-family: inherit; -webkit-user-select: text; user-select: text; outline: none; }
  .inp:focus { border-color: #d4a017; }
  .err { color: #ff7b7b; min-height: 22px; margin: 8px 0 4px; font-size: 14px; }
  .vipTitle { font-size: 22px; font-weight: 800; color: #ffd75e; margin: 4px 0 14px; letter-spacing: .1em; }
  button.vipOn { background: linear-gradient(135deg, #d4a017, #f6d365) !important; color: #2b1d00 !important; border: 0 !important; }
  #status .vq { font-size: 13px; font-weight: 600; color: #ffe9a8; margin-top: 3px; line-height: 1.4; }
  .shk { animation: shake .45s ease; }

  /* ----- 結束動畫 ----- */
  #endOv { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; z-index: 60; overflow: hidden; }
  #endOv.show { display: flex; animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #endOv .card { position: relative; z-index: 2; background: linear-gradient(160deg, #343c52, #232938); border: 2px solid #d4a017; border-radius: 20px; padding: 26px 34px; text-align: center; min-width: 260px; max-width: 88vw; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; }

    n.last = [m.fr, m.fc, m.tr, m.tc];

  function legal(s, r, c) {

    return pseudo(s, r, c).filter(function (m) {

      return !inCheck(n, p[0]);

  }

  function allLegal(s, color) {

    }
    return res;
  }

  function insufficient(s) {
    var minors = [], r, c, p;
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = s.board[r][c];
      if (!p || p[1] === "K") continue;
      if (p[1] === "P" || p[1] === "R" || p[1] === "Q") return false;
      minors.push({ t: p[1], col: p[0], sq: (r + c) % 2 });
    }
    if (minors.length <= 1) return true;
    var allB = minors.every(function (m) { return m.t === "B"; });
    if (allB) {
      var sq = minors[0].sq;

    }
    return false;
  }

  function sqName(r, c) { return "abcdefgh"[c] + (8 - r); }

    if (m.castle) txt = m.castle === "K" ? "O-O" : "O-O-O";
    else {
      var cap = prev.board[m.tr][m.tc] || m.enpassant;
      txt = (t === "P" ? "" : t) + (t === "P" && cap ? "abcdefgh"[m.fc] : "") + (cap ? "x" : "") + sqName(m.tr, m.tc);
      if (m.promo) txt += "=" + (promoteTo || "Q");
    }
    if (next.result === "checkmate") txt += "#";
    else if (inCheck(next, next.turn)) txt += "+";

  }

  function evaluate(s) {

    else if (insufficient(s)) s.result = "insufficient";
    else s.result = null;
  }

  /* ================= 電腦 AI ================= */
  var VAL = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 0 };
  var MATE = 100000;

  function pst(t, col, r, c, endgame) {
    var adv = col === "w" ? 7 - r : r;
    var cd = Math.abs(3.5 - r) + Math.abs(3.5 - c);
    if (t === "P") return adv * 6 + ((c === 3 || c === 4) ? adv * 2 : 0);
    if (t === "N") return (7 - cd) * 5;
    if (t === "B") return (7 - cd) * 3;
    if (t === "R") return adv === 6 ? 15 : 0;
    if (t === "Q") return (7 - cd);
    if (endgame) return (7 - cd) * 6;
    return adv === 0 ? 12 : -adv * 8;
  }

  function evalBoard(s) {
    var b = s.board, r, c, p, heavy = 0;
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = b[r][c];
      if (p && p[1] !== "P" && p[1] !== "K") heavy++;
    }
    var endgame = heavy <= 3, sc = 0, v;
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = b[r][c];
      if (!p) continue;
      v = VAL[p[1]] + pst(p[1], p[0], r, c, endgame);
      sc += p[0] === "w" ? v : -v;
    }
    return sc;
  }

  function children(s) {
    var col = s.turn, res = [], r, c, p, ms, i, m, n, vic, o;
    for (r = 0; r < 8; r++) for (c = 0; c < 8; c++) {
      p = s.board[r][c];
      if (!p || p[0] !== col) continue;
      ms = pseudo(s, r, c);
      for (i = 0; i < ms.length; i++) {
        m = ms[i];
        n = apply(s, m, "Q");
        if (inCheck(n, col)) continue;
        vic = s.board[m.tr][m.tc];
        o = vic ? VAL[vic[1]] * 10 - VAL[p[1]] / 10 : 0;
        if (m.promo) o += 800;
        res.push({ m: m, n: n, o: o + Math.random() });
      }
    }
    res.sort(function (a, b) { return b.o - a.o; });
    return res;
  }

  function search(s, depth, alpha, beta, ply, ctx) {
    if ((++ctx.nodes & 255) === 0 && ctx.deadline && Date.now() > ctx.deadline) ctx.abort = true;
    if (ctx.abort) return 0;
    if (depth === 0) return (s.turn === "w" ? 1 : -1) * evalBoard(s);
    var kids = children(s);
    if (!kids.length) return inCheck(s, s.turn) ? -(MATE - ply) : 0;
    var best = -1e9, i, v;
    for (i = 0; i < kids.length; i++) {
      v = -search(kids[i].n, depth - 1, -beta, -alpha, ply + 1, ctx);
      if (ctx.abort) return 0;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }

  function pickMove(s, lv) {
    var kids = children(s);
    if (!kids.length) return null;
    var sign = s.turn === "w" ? 1 : -1, best = null, bestV = -1e9, i, v, ctx;
    if (lv === "easy") {
      for (i = 0; i < kids.length; i++) {
        v = sign * evalBoard(kids[i].n) + Math.random() * 260;
        if (v > bestV) { bestV = v; best = kids[i]; }
      }
    } else if (lv === "medium") {
      ctx = { nodes: 0, deadline: Date.now() + 1800, abort: false };
      for (i = 0; i < kids.length; i++) {
        v = -search(kids[i].n, 2, -1e9, 1e9, 1, ctx);
        if (ctx.abort) break;
        v += Math.random() * 20;
        if (v > bestV) { bestV = v; best = kids[i]; }
      }
      if (!best) best = kids[0];
    } else {
      ctx = { nodes: 0, deadline: Date.now() + 2300, abort: false };
      best = kids[0];
      for (var d = 1; d <= 4; d++) {
        var alpha = -1e9, cur = null;
        for (i = 0; i < kids.length; i++) {

          if (ctx.abort) break;
          if (cur === null || v > alpha) { alpha = v; cur = kids[i]; }
        }
        if (ctx.abort || !cur) break;
        best = cur;
        kids.splice(kids.indexOf(cur), 1);
        kids.unshift(cur);
        if (alpha > MATE - 100) break;
      }
    }
    return { m: best.m, p: best.m.promo ? "Q" : null };
  }

    ["Q", "R", "B", "N"].forEach(function (t) {
      var b = document.createElement("div");
      b.className = "opt " + state.turn;
      b.textContent = GLYPH[t] + VS;
      b.addEventListener("click", function () {
        document.getElementById("modal").classList.remove("show");
        var mm = pendingPromo; pendingPromo = null;
        doMove(mm, t);
      });
      row.appendChild(b);
    });
    document.getElementById("modal").classList.add("show");
  }

  /* ================= 視圖切換 ================= */
  var menuEl = document.getElementById("menu");
  function setView(v) {
    view = v;
    menuEl.style.display = v === "menu" ? "flex" : "none";
    document.getElementById("gameBtns").hidden = v !== "game";
    document.getElementById("replayBar").hidden = v !== "replay";
  }
  function showMenuPanel(which) {
    document.getElementById("mMain").hidden = which !== "main";
    document.getElementById("mSetup").hidden = which !== "setup";
    document.getElementById("mRecList").hidden = which !== "rec";
    document.getElementById("mVipPw").hidden = which !== "vipPw";
    document.getElementById("mVipName").hidden = which !== "vipName";
  }
  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    document.getElementById("rPlay").textContent = "▶▶ 自動播放";
  }

  function startGame(cfg) {
    aiToken++; thinking = false; stopPlay();
    lastCfg = cfg;
    mode = cfg.mode;
    if (mode === "ai") {
      level = cfg.level;
      human = cfg.human === "r" ? (Math.random() < 0.5 ? "w" : "b") : cfg.human;
      aiColor = opp(human);
    }
    gameId = "g" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    gameTs = Date.now();
    gVip = vip; gName = vipName; gSide = mode === "ai" ? human : "w";
    if (gVip) newQuote();
    state = newState(); history = []; selected = null; legalCache = [];
    gameOver = false; pendingPromo = null; lastDrop = null; autoFlip = false;
    flipped = mode === "ai" && human === "b";
    document.getElementById("btnAuto").textContent = "自動翻轉：關";
    document.getElementById("modal").classList.remove("show");
    document.getElementById("cfm").classList.remove("show");
    hideEnd();
    setView("game");
    render();
    var sub = mode === "ai" ? ("你執" + (human === "w" ? "白 ○" : "黑 ●") + "・" + LV[level]) : "白方先行 ○";
    if (gVip) sub = "👑 " + gName + "　" + sub;
    showBanner("start", "對戰開始", sub, true);
    sfx.start();
    if (mode === "ai" && aiColor === "w") maybeAI(2300);
  }

  var cfmFn = null;
  function askConfirm(msg, yesLabel, fn) {
    document.getElementById("cfmMsg").textContent = msg;
    document.getElementById("cfmYes").textContent = yesLabel;
    cfmFn = fn;
    document.getElementById("cfm").classList.add("show");
  }
  document.getElementById("cfmYes").addEventListener("click", function () {
    document.getElementById("cfm").classList.remove("show");
    var f = cfmFn; cfmFn = null;
    if (f) f();
  });
  document.getElementById("cfmNo").addEventListener("click", function () {
    document.getElementById("cfm").classList.remove("show");
    cfmFn = null;
  });

  function goMenu() {
    aiToken++; thinking = false; stopPlay();
    if (view === "game" && !gameOver) saveGame();
    hideEnd(); clearBanner();
    document.getElementById("modal").classList.remove("show");
    pendingPromo = null;
    setView("menu");
    showMenuPanel("main");
  }

  /* ----- 遊戲中按鈕 ----- */
  document.getElementById("btnUndo").addEventListener("click", function () {
    if (view !== "game" || thinking) return;
    hideEnd();
    if (mode === "ai") {
      var found = -1;
      for (var i = history.length - 1; i >= 0; i--) { if (history[i].turn === human) { found = i; break; } }
      if (found < 0) return;
      aiToken++;
      state = history[found];
      history = history.slice(0, found);
    } else {
      if (!history.length) return;
      state = history.pop();
    }
    selected = null; legalCache = []; gameOver = !!state.result; pendingPromo = null;
    if (mode === "two" && autoFlip) flipped = state.turn === "b";
    if (gVip) newQuote();
    render();
    sfx.undo();
    showTurnBanner();
  });
  document.getElementById("btnFlip").addEventListener("click", function () { flipped = !flipped; render(); });
  document.getElementById("btnAuto").addEventListener("click", function () {
    autoFlip = !autoFlip;
    this.textContent = "自動翻轉：" + (autoFlip ? "開" : "關");
    if (autoFlip) flipped = state.turn === "b";
    render();
  });
  document.getElementById("btnNew").addEventListener("click", function () {
    if (state.mv.length && !gameOver) {
      askConfirm("確定要重新一局嗎？目前棋局會以「未完成」存入複盤。", "確定重來", function () { saveGame(); startGame(lastCfg); });
    } else startGame(lastCfg);
  });
  document.getElementById("btnMenu").addEventListener("click", function () {
    if (state.mv.length && !gameOver) {
      askConfirm("回到主選單？目前棋局會以「未完成」存入複盤。", "回主選單", goMenu);
    } else goMenu();
  });
  document.getElementById("endNew").addEventListener("click", function () { startGame(lastCfg); });
  document.getElementById("endView").addEventListener("click", hideEnd);
  document.getElementById("endMenu").addEventListener("click", goMenu);

  /* ----- 主選單 ----- */
  var HINTS = {
    easy: "偶爾會亂走，適合新手練習。",
    medium: "會預想約 3 步，有基本戰術。",
    hard: "會預想 4 步（思考約 1～2 秒），比較難贏。"
  };
  var selLevel = "medium", selColor = "w";
  function updateHint() { document.getElementById("levelHint").textContent = HINTS[selLevel]; }
  updateHint();

  function bindSeg(id, setter) {
    document.getElementById(id).addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var all = this.querySelectorAll("button");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
      b.classList.add("on");
      setter(b.getAttribute("data-v"));
    });
  }
  bindSeg("segLevel", function (v) { selLevel = v; updateHint(); });
  bindSeg("segColor", function (v) { selColor = v; });

  document.getElementById("mAI").addEventListener("click", function () { showMenuPanel("setup"); });
  document.getElementById("mTwo").addEventListener("click", function () { startGame({ mode: "two" }); });
  document.getElementById("mBack1").addEventListener("click", function () { showMenuPanel("main"); });
  document.getElementById("mStart").addEventListener("click", function () {
    startGame({ mode: "ai", level: selLevel, human: selColor });
  });
  /* ----- VIP 入口：密碼 → 名字 → 啟用 ----- */
  var pwIn = document.getElementById("pwIn"), nameIn = document.getElementById("nameIn");
  function updateVipBtn() {
    var b = document.getElementById("mVip");
    b.textContent = vip ? "👑 VIP：" + vipName + "（點此關閉）" : "👑 VIP";
    b.classList.toggle("vipOn", vip);
  }
  function wiggle(el) { el.classList.remove("shk"); void el.offsetWidth; el.classList.add("shk"); }
  document.getElementById("mVip").addEventListener("click", function () {
    if (vip) { vip = false; vipName = ""; updateVipBtn(); sfx.undo(); return; }
    pwIn.value = ""; document.getElementById("pwErr").textContent = "";
    showMenuPanel("vipPw");
    setTimeout(function () { try { pwIn.focus(); } catch (e) {} }, 80);
  });
  function submitPw() {
    if (pwIn.value.trim() === VIP_PW) {
      var saved = "";
      try { saved = window.localStorage.getItem("chess_vip_name") || ""; } catch (e) {}
      nameIn.value = saved; document.getElementById("nameErr").textContent = "";
      showMenuPanel("vipName");
      setTimeout(function () { try { nameIn.focus(); } catch (e) {} }, 80);
    } else {
      document.getElementById("pwErr").textContent = "密碼錯誤，請再試一次";
      pwIn.value = ""; wiggle(pwIn); sfx.lose();
    }
  }
  function submitName() {
    var n = nameIn.value.trim().slice(0, 8);
    if (!n) { document.getElementById("nameErr").textContent = "請輸入名字"; wiggle(nameIn); return; }
    vip = true; vipName = n;
    try { window.localStorage.setItem("chess_vip_name", n); } catch (e) {}
    updateVipBtn(); showMenuPanel("main"); sfx.promote();
  }
  document.getElementById("pwOk").addEventListener("click", submitPw);
  document.getElementById("nameOk").addEventListener("click", submitName);
  document.getElementById("pwBack").addEventListener("click", function () { showMenuPanel("main"); });
  document.getElementById("nameBack").addEventListener("click", function () { showMenuPanel("main"); });
  pwIn.addEventListener("keydown", function (e) { if (e.key === "Enter") submitPw(); });
  nameIn.addEventListener("keydown", function (e) { if (e.key === "Enter") submitName(); });
  updateVipBtn();

  document.getElementById("mRec").addEventListener("click", function () { renderRecList(); showMenuPanel("rec"); });
  document.getElementById("mBack2").addEventListener("click", function () { showMenuPanel("main"); });

  function renderRecList() {
    var el = document.getElementById("recs");
    if (!records.length) { el.innerHTML = '<div class="empty">還沒有對局紀錄，先去下一局吧！</div>'; return; }
    var h = "";
    records.forEach(function (r, i) {
      h += '<div class="rec" data-i="' + i + '"><div><div class="l1">' + fmtDate(r.ts) + "・" + modeText(r) + "</div>" +
           '<div class="l2">' + resultText(r) + "・" + r.moves.length + " 步</div></div><div class=\"go\">複盤 ▶</div></div>";
    });
    el.innerHTML = h;
  }
  document.getElementById("recs").addEventListener("click", function (e) {
    var el = e.target.closest(".rec");
    if (!el) return;
    openReplay(records[+el.getAttribute("data-i")]);
  });

  /* ================= 複盤 ================= */
  function openReplay(rec) {
    aiToken++; thinking = false; stopPlay(); hideEnd(); clearBanner();
    replayRec = rec;
    sts = [newState()];
    for (var i = 0; i < rec.moves.length; i++) {
      var mv = rec.moves[i], cur = sts[i];
      var m = legal(cur, mv.fr, mv.fc).filter(function (x) { return x.tr === mv.tr && x.tc === mv.tc; })[0];
      if (!m) break;
      sts.push(apply(cur, m, mv.p || "Q"));
    }
    mode = rec.mode;
    human = rec.human || "w";
    gVip = !!rec.vip; gName = rec.vip || ""; gSide = rec.mode === "ai" ? human : "w";
    flipped = rec.mode === "ai" && rec.human === "b";
    selected = null; legalCache = []; lastDrop = null;
    ridx = 0; state = sts[0];
    setView("replay");
    render();
  }
  function rgoto(i) {
    var prevIdx = ridx;
    ridx = Math.max(0, Math.min(sts.length - 1, i));
    state = sts[ridx];
    selected = null; legalCache = [];
    if (ridx === prevIdx + 1) {
      var sa = sts[prevIdx], sb = sts[ridx];
      var grew = sb.captured.w.length + sb.captured.b.length > sa.captured.w.length + sa.captured.b.length;
      var mvr = replayRec.moves[ridx - 1];
      var pawnPromo = mvr.p && sa.board[mvr.fr][mvr.fc] && sa.board[mvr.fr][mvr.fc][1] === "P";
      var castled = sa.board[mvr.fr][mvr.fc] && sa.board[mvr.fr][mvr.fc][1] === "K" && Math.abs(mvr.tc - mvr.fc) === 2;
      playMove({ castle: castled, promo: pawnPromo }, grew);
      if (inCheck(sb, sb.turn)) setTimeout(sfx.check, 220);
    }
    render();
  }
  document.getElementById("rFirst").addEventListener("click", function () { stopPlay(); rgoto(0); });
  document.getElementById("rPrev").addEventListener("click", function () { stopPlay(); rgoto(ridx - 1); });
  document.getElementById("rNext").addEventListener("click", function () { stopPlay(); rgoto(ridx + 1); });
  document.getElementById("rLast").addEventListener("click", function () { stopPlay(); rgoto(sts.length - 1); });
  document.getElementById("rFlip").addEventListener("click", function () { flipped = !flipped; render(); });
  document.getElementById("rPlay").addEventListener("click", function () {
    if (playTimer) { stopPlay(); return; }
    if (ridx >= sts.length - 1) rgoto(0);
    this.textContent = "⏸ 暫停";
    playTimer = setInterval(function () {
      if (ridx >= sts.length - 1) { stopPlay(); return; }
      rgoto(ridx + 1);
      if (ridx >= sts.length - 1) stopPlay();
    }, 900);
  });
  document.getElementById("rBack").addEventListener("click", function () {
    stopPlay();
    setView("menu");
    renderRecList();
    showMenuPanel("rec");
  });
  logEl.addEventListener("click", function (e) {
    if (view !== "replay") return;
    var el = e.target.closest(".mv");
    if (!el) return;
    stopPlay();
    rgoto(+el.getAttribute("data-i") + 1);
  });

  /* ----- 音效開關與解鎖 ----- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.classList.contains("sndBtn")) {
      soundOn = !soundOn;
      try { window.localStorage.setItem("chess_sound", soundOn ? "1" : "0"); } catch (err) {}
      updateSndBtns();
      if (soundOn) sfx.tick();
    } else sfx.tick();
  });
  ["pointerdown", "touchstart", "click"].forEach(function (ev) {
    document.addEventListener(ev, function () { if (soundOn) ac(); }, { passive: true });
  });
  updateSndBtns();

  window.addEventListener("pagehide", function () { if (view === "game" && !gameOver) saveGame(); });

  /* ================= 啟動 ================= */
  loadRecords();
  state = newState();
  setView("menu");
  showMenuPanel("main");
  render();
})();
</script>
</body>
</html>
