<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>遊戲大廳</title>
<style>
  :root { --bg: #171b26; --panel: #252c3d; --text: #eef1f6; --muted: #98a3b8; --gold: #f6d365; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  body { overflow-x: hidden; -webkit-user-select: none; user-select: none; }
  #hub { min-height: 100%; padding: 22px 16px 40px; background:
      radial-gradient(900px 500px at 15% -10%, rgba(79, 140, 255, .18), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(246, 211, 101, .12), transparent 55%), var(--bg); }
  .wrap { max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 30px; margin: 6px 0 4px; letter-spacing: .12em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  button.snd { background: var(--panel); color: var(--text); border: 1px solid #44506a; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; touch-action: manipulation; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .card { position: relative; border-radius: 18px; padding: 18px 16px 16px; background: var(--panel); border: 2px solid transparent;
    cursor: pointer; overflow: hidden; touch-action: manipulation; transition: transform .15s ease, border-color .2s; }
  .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(145deg, var(--c1), var(--c2)); opacity: .22; }
  .card:active { transform: scale(.97); }
  .card.ready:hover { border-color: var(--c1); }
  .card .ico { position: relative; font-size: 46px; line-height: 1.1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .card .nm { position: relative; font-size: 22px; font-weight: 800; margin: 8px 0 2px; letter-spacing: .06em; }
  .card .ds { position: relative; font-size: 13px; color: #c8d0e2; line-height: 1.5; min-height: 40px; }
  .card .tag { position: relative; display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,.14); }
  .card.ready .tag { background: linear-gradient(135deg, #d4a017, var(--gold)); color: #2b1d00; }
  .card.soon { cursor: default; filter: saturate(.35); opacity: .75; }
  .card.soon:active { transform: none; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
  #stage { position: fixed; inset: 0; z-index: 100; background: #1f2430; display: none; }
  #stage.show { display: block; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1f2430; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(20,24,36,.95); border: 1px solid #44506a; padding: 10px 18px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200; }
  #toast.show { opacity: 1; }
  .tbtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.vipb.on { background: linear-gradient(135deg, #d4a017, #f6d365); color: #2b1d00; border: 0; }
  #vipModal { position: fixed; inset: 0; z-index: 200; background: rgba(8,10,16,.85); display: none; align-items: center; justify-content: center; padding: 16px; }
  #vipModal.show { display: flex; }
  #vipModal .box { background: var(--panel); border-radius: 16px; padding: 22px 18px; width: 100%; max-width: 340px; text-align: center; }
  #vipModal h2 { margin: 0 0 12px; font-size: 22px; color: #ffd75e; letter-spacing: .1em; }
  #vipModal p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  #vipModal input { width: 100%; padding: 12px; font-size: 18px; text-align: center; border-radius: 10px; border: 1px solid #44506a; background: #1b2130; color: var(--text); font-family: inherit; -webkit-user-select: text; user-select: text; }
  #vipModal button { width: 100%; margin-top: 10px; padding: 13px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; background: linear-gradient(135deg, #d4a017, #f6d365); color: #2b1d00; touch-action: manipulation; }
  #vipModal button.sec { background: #39415a; color: var(--text); }
  #vipErr { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
<div id="hub">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>🎮 遊戲大廳</h1>
        <div class="sub">選一款遊戲開始玩</div>
      </div>
      <div class="tbtns">
        <button class="snd vipb" id="vipBtn" type="button">👑 VIP</button>
        <button class="snd" id="sndBtn" type="button">🔊 音效：開</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">進入遊戲後按「🏠 主選單」回到該遊戲的小選單，在小選單再按「回大主選單」就會回到這裡</div>
  </div>
</div>
<div id="vipModal">
  <div class="box" id="vipPwBox">
    <h2>👑 VIP 通行密碼</h2><p>輸入一次，所有遊戲的 VIP 功能都會開啟</p>
    <input id="vipPwIn" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼">
    <div id="vipErr"></div>
    <button id="vipPwOk" type="button">確認</button><button class="sec" id="vipPwCancel" type="button">取消</button>
  </div>
  <div class="box" id="vipNameBox" style="display:none">
    <h2>👑 歡迎，VIP</h2><p>請輸入你的名字（遊戲中會顯示）</p>
    <input id="vipNameIn" type="text" maxlength="12" autocomplete="off" placeholder="你的名字">
    <button id="vipNameOk" type="button">進入 VIP 模式</button>
  </div>
</div>
<div id="stage"></div>
<div id="toast"></div>

<script type="text/plain" data-game="chess">
<!DOCTYPE html>

<style>

.segs button.demonBtn{font-size:14px;padding:11px 4px}.segs button.demonBtn.on{background:linear-gradient(135deg,#b3122b,#6e0a1a);border-color:#ff6b6b;box-shadow:0

<body>

<div id="app">
  <div id="main">
    <div class="cap" id="capTop"></div>
    <div id="boardWrap">
      <div id="board"></div>
      <div id="banner"><div class="bn" id="bn"><div class="t"></div><div class="s"></div></div></div>
    </div>
    <div class="cap" id="capBot"></div>
  </div>
  <div id="side">
    <h1>♞ 西洋棋</h1>
    <div id="status"></div>
    <div class="btns" id="gameBtns">
      <button id="btnUndo" class="sec" type="button">↩ 悔棋</button>
      <button id="btnFlip" class="sec" type="button">🔄 翻轉棋盤</button>
      <button id="btnAuto" class="sec" type="button">自動翻轉：關</button>
      <button id="btnNew" type="button">🔁 重新一局</button>
      <button id="btnMenu" class="sec" type="button">🏠 主選單</button>
      <button class="sec sndBtn" type="button">🔊 音效：開</button>
    </div>
    <div class="btns" id="replayBar" hidden>
      <button id="rFirst" class="sec" type="button">⏮</button>
      <button id="rPrev" class="sec" type="button">◀ 上一步</button>
      <button id="rNext" type="button">下一步 ▶</button>
      <button id="rLast" class="sec" type="button">⏭</button>
      <button id="rPlay" class="sec" type="button">▶▶ 自動播放</button>
      <button id="rFlip" class="sec" type="button">🔄 翻轉</button>
      <button id="rBack" class="sec" type="button">📼 返回列表</button>
      <button class="sec sndBtn" type="button">🔊 音效：開</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<div id="menu">
  <div class="mwrap">
    <div class="logo">♞</div>
    <h2>西洋棋</h2>
    <div id="mKind" hidden>
      <button class="big" id="mK2" type="button">♞ 雙人西洋棋<br><small style="font-weight:400;opacity:.8">單機雙人・人機對決・複盤・VIP</small></button>
      <button class="big" id="mK3" type="button">🔺 三人西洋棋<br><small style="font-weight:400;opacity:.8">六角形棋盤・三人混戰・人機・複盤</small></button>
      <button class="big sec" id="mKHome" type="button">🌐 回大主選單</button>
    </div>
    <div id="mMain">
      <button class="big" id="mAI" type="button">🤖 人機對決</button>
      <button class="big" id="mTwo" type="button">👥 單機對決（雙人）</button>
      <button class="big sec" id="mRec" type="button">📼 複盤（最近 10 局）</button>
      <button class="big sec" id="mVip" type="button">👑 VIP</button>
      <button class="big sec sndBtn" type="button">🔊 音效：開</button>
      <button class="big sec" id="mHome" type="button" hidden>↩ 回西洋棋選單（雙人／三人）</button>
    </div>
    <div id="mSetup" hidden>
      <div class="lab">電腦難度</div>
      <div class="segs" id="segLevel">
        <button data-v="easy" type="button">簡單</button>
        <button data-v="medium" type="button" class="on">普通</button>
        <button data-v="hard" type="button">困難</button>
        <button data-v="demon" type="button" class="demonBtn">😈 惡魔</button>
      </div>
      <div class="hint-t" id="levelHint"></div>
      <div class="lab">你要執</div>
      <div class="segs" id="segColor">
        <button data-v="w" type="button" class="on">○ 白棋（先手）</button>
        <button data-v="b" type="button">● 黑棋</button>
        <button data-v="r" type="button">隨機</button>

        <b>走法</b>：棋子和一般西洋棋相同。直線（車、后）可以沿著檔一路穿過中間，走到別人的陣地；斜線（象、后）也能穿過棋盤正中心，到達對角的格子。<br>

        <b>輪流</b>：白 → 黑 → 紅。<br>
        <b>將軍</b>：被將軍的人必須解除；但輪到另一位玩家時，他也可以直接吃掉被將軍的國王。<br>

        <b>勝利</b>：只剩一位玩家就獲勝；連續 150 手沒有吃子或走兵則和棋。<br>
        <b>簡化</b>：沒有易位、沒有過路兵。

  </div>
</div>

    <button class="big" id="bBoard" style="background:#3a5546">🏆 排行榜</button>
    <button class="big" id="bRules" style="background:#3a5546">玩法說明</button>
    <button class="big" id="bSound" style="background:#3a5546">🔊 音效：開</button>
    <button class="big" id="bHome" style="display:none;background:#3a5546">🌐 回大主選單</button>

    <ul class="rules">
      <li>在畫面上<b>滑動手指</b>控制蛇的方向（電腦鍵盤可用方向鍵）。</li>
      <li>場上有很多電腦蛇。吃到食物會變長，分數越高排名越前面。</li>
      <li>🍎 紅蘋果 +10 分；電腦蛇死掉會掉出一串小點，每個 +5 分。</li>
      <li>⭐ 金蘋果 +50 分，只會出現一小段時間。</li>

<html lang="zh-Hant">

  <div class="panel" id="mMain">

      <li>憋氣有時間限制，氣快用完時準心會再次亂晃，記得適時放箭。</li>

      <li>第 6 支起靶會左右移動，第 9 支起還會上下移動。</li>
      <li>分數記在排行榜（前 10 名）。</li>
    </ul>

    <div class="lab">模式</div><div class="seg" id="segMode"><button data-v="2p">雙人同機</button><button data-v="ai" class="on">人機對決</button></div>
    <div id="aiOpts"><div class="lab">電腦難度</div><div class="seg" id="segLevel"><button data-v="easy">簡單</button><button data-v="medium" class="on">普通</button><button data-v="hard">困難</button><button data-v="demon">惡魔</button></div></div>
    <div class="lab">結束規則</div><div class="seg" id="segRule"><button data-v="straight" class="on">直接歸零</button><button data-v="double">雙倍結束</button></div>
    <div class="lab">你的名字（雙人時是玩家 1）</div><input type="text" id="nameIn" maxlength="8" placeholder="玩家 1">
    <div id="n2" style="display:none"><div class="lab">玩家 2 的名字</div><input type="text" id="nameIn2" maxlength="8" placeholder="玩家 2"></div>
    <button class="big" id="bGo" style="margin-top:16px">開始比賽</button>
    <button class="big g" id="bBack1">返回</button>
  </div>
  <div class="panel" id="mRules">
    <h2>玩法說明</h2>
    <ul class="rules">
      <li>每人從 301 分開始，每回合投 3 支飛鏢，擊中的分數會從剩餘分數扣掉，先歸零者勝。</li>
      <li>飛鏢盤：外圈細帶是<b>雙倍</b>，內圈細帶是<b>三倍</b>，中心紅心 50 分、綠圈 25 分。</li>
      <li><b>直接歸零</b>：只要剛好扣到 0 就贏。<b>雙倍結束</b>：最後一鏢必須投進雙倍區（或紅心）才算贏，且不能留下 1 分。</li>
      <li>扣到小於 0（或違反結束規則）就「爆分」，這一回合作廢，分數回到回合開始時。</li>
      <li>瞄準：按住畫面拖動，準心會顯示在手指上方並微微晃動；靜止越久越穩，放開就投出。</li>
    </ul>
    <button class="big g" id="bBack2">返回</button>
  </div>
  <div class="panel" id="mRecs"><h2>複盤</h2><p class="sub">最近 10 局，點一局開始回看</p><div id="recList"></div><button class="big g" id="bBack3">返回</button></div>
  <div class="panel" id="mOver">
    <h2 id="ovT"></h2><div id="ovW"></div><p class="sub" id="ovS"></p>
    <button class="big" id="bAgain">再來一局</button>
    <button class="big g" id="bOvReplay">複盤本局</button>
    <button class="big g" id="bOvMenu">主選單</button>
  </div>
</div>

    <button class="big" id="bStart">開始遊戲</button>

<script type="text/plain" id="commonCss">
:root{--bg:#1d2a3a;--panel:#2a3a50;--text:#eef3fa;--muted:#9db0c8;--accent:#2f8cff;--bs:360px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;
user-select:none}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
overflow:hidden}body{min-height:100vh;min-height:100dvh}#app{display:flex;flex-direction:column;align-items:center;padding:6px 8px 10px;gap:4px}h1{font-size:19px;
margin:2px 0 2px;letter-spacing:.2em}#wrap{position:relative;width:var(--cw);height:var(--ch)}canvas{width:100%;height:100%;display:block;border-radius:14px;touch-action:none}
#banner{position:absolute;left:0;right:0;top:36%;height:22%;z-index:20;pointer-events:none;overflow:hidden}#banner .bn{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;opacity:0;font-weight:800;letter-spacing:.1em;color:#fff;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72)
14%,rgba(0,0,0,.72) 86%,rgba(0,0,0,0));text-align:center}#banner .bn .t{font-size:calc(var(--cw) * .075);line-height:1.15;padding:0 10px}#banner .bn .s{font-size:calc(var(--cw)
* .036);font-weight:600;margin-top:2px;color:#ffe9a8;padding:0 14px}#banner .bn.gold{background:linear-gradient(90deg,rgba(212,160,23,0),rgba(212,160,23,.95) 14%,rgba(212,160,23,.95)
86%,rgba(212,160,23,0));color:#2b1d00}#banner .bn.gold .s{color:#4a3200}#banner .bn.red{background:linear-gradient(90deg,rgba(200,40,40,0),rgba(200,40,40,.95) 14%,rgba(200,40,40,.95)
86%,rgba(200,40,40,0))}#banner .bn.red .s{color:#fff}#banner .bn.blue{background:linear-gradient(90deg,rgba(30,90,200,0),rgba(30,90,200,.95) 14%,rgba(30,90,200,.95)
86%,rgba(30,90,200,0))}#banner .bn.blue .s{color:#fff}#banner .bn.run{animation:sweep 1.1s ease both}#banner .bn.run.long{animation-duration:2.1s}@keyframes sweep{0%{
opacity:0;transform:translateX(-70%) scaleY(.5)}16%{opacity:1;transform:translateX(0) scaleY(1)}78%{opacity:1;transform:translateX(0) scaleY(1)}100%{opacity:0;transform:translateX(70%)
scaleY(.5)}}#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(30,40,60,.95);color:#fff;font-weight:700;padding:8px 14px;border-radius:18px;
font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}#toast.on{opacity:1}.btns{display:flex;gap:8px;flex-wrap:wrap;
justify-content:center;margin:4px 0}button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-size:15px;font-weight:600;cursor:pointer;
touch-action:manipulation;font-family:inherit}button:active{filter:brightness(.9)}button.sec{background:var(--panel);border:1px solid #4a6080}button:disabled{opacity:.4}
#modal{position:fixed;inset:0;background:rgba(6,10,18,.84);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#modal.on{display:flex}
.panel{display:none;background:var(--panel);border-radius:16px;padding:20px 18px;width:100%;max-width:390px;max-height:92vh;overflow:auto;text-align:center}.panel.on{
display:block}.panel h2{margin:0 0 4px;font-size:22px;letter-spacing:.15em}.panel p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}.panel button.big{display:block;
width:100%;margin:9px 0;padding:14px;font-size:17px}.panel button.g{background:#3d5370}.panel input[type=text]{width:100%;padding:11px;font-size:17px;text-align:center;
border-radius:10px;border:1px solid #4a6080;background:#1a2535;color:var(--text);font-family:inherit;-webkit-user-select:text;user-select:text}.lab{text-align:left;
font-size:13px;color:var(--muted);margin:10px 0 6px}.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;background:#3d5370;font-size:14px}.seg button.on{
background:var(--accent)}.rules{text-align:left;font-size:14px;line-height:1.65;color:#d8e4f2;padding-left:20px}.rules li{margin:3px 0}.row{display:flex;justify-content:space-between;
align-items:center;background:#33475f;border-radius:10px;padding:9px 12px;margin:6px 0;font-size:15px;text-align:left}.row b{color:#ffd75e}.row small{color:var(--muted)}
.rec{cursor:pointer}#ovW{font-size:20px;font-weight:800;color:#ffd75e;letter-spacing:.2em;margin:0 0 8px}
</script>

    function blk(id) { var e = document.getElementById(id); return e ? e.textContent.replace(/^\n/, "").replace(/\n$/, "") : ""; }
    var spray = "data:image/jpeg;base64," + blk("sprayData").replace(/\s+/g, "");
    var cjs = blk("commonJs"), ccss = blk("commonCss");
    var bs = document.querySelectorAll('script[type="text/plain"][data-game]');
    for (var i = 0; i < bs.length; i++) {
      var s = bs[i].textContent.replace(/^\n/, "").replace(/\n$/, "");
      s = s.split("@@CJS@@").join(cjs).split("@@CCSS@@").join(ccss);
      GAMES[bs[i].getAttribute("data-game")] = s.split("<@@").join("<").split("@@SPRAYURI@@").join(spray);
    }
  })();

  var CATALOG = [
    { id: "quoridor", name: "隔板競速", icon: "🟡", desc: "一人一顆球，先走到對面就贏，還能放隔板擋對手", c1: "#f2c200", c2: "#35b864" },
    { id: "2048", name: "2048", icon: "🔢", desc: "合併方塊，用家人的照片解鎖獎勵", c1: "#ff9f43", c2: "#ee5a24" },
    { id: "chess", name: "西洋棋", icon: "♞", desc: "雙人、人機（簡單到惡魔）、複盤、VIP 模式", c1: "#4f8cff", c2: "#8b5cf6" },
    { id: "checkers", name: "跳棋", icon: "✦", desc: "星形跳棋，2～6 人，真人與電腦混合對戰", c1: "#14b8a6", c2: "#7c3aed" },
    { id: "xiangqi", name: "象棋", icon: "帥", desc: "楚河漢界，雙人與人機對戰", c1: "#e74c3c", c2: "#8e2a1e" },
    { id: "snake", name: "貪吃蛇", icon: "🐍", desc: "和一大群電腦蛇比長度，特殊食物與障礙，排行榜", c1: "#2fb36b", c2: "#0f6b3c" },
    { id: "gomoku", name: "五子棋", icon: "⚫", desc: "先連成五子者勝，雙人與人機對戰", c1: "#2ecc71", c2: "#16794a" },
    { id: "archery", name: "射箭", icon: "🏹", desc: "10 支箭衝高分，屏息瞄準、留意風向", c1: "#56b8e6", c2: "#2f7fb5" },
    { id: "gravity", name: "重力跑", icon: "🌀", desc: "點一下翻轉重力，閃躲尖刺跑更遠", c1: "#9b6bff", c2: "#5a37b8" },
    { id: "seabattle", name: "海戰", icon: "⚓", desc: "佈置艦隊、轟炸對手，人機或雙人", c1: "#2aa3b5", c2: "#17647a" },
    { id: "darts", name: "飛鏢", icon: "🎯", desc: "301 歸零大賽，人機或雙人", c1: "#e8624f", c2: "#a52f2f" },
    { id: "ttt", name: "圈圈叉叉", icon: "❌", desc: "3×3、4×4、5×5，人機或雙人，可複盤", c1: "#4db5ff", c2: "#2a6fb0" },
    { id: "tetris", name: "俄羅斯方塊", icon: "🧱", desc: "滑動手勢操作，單人排行榜或對戰電腦", c1: "#38b6a5", c2: "#1f7a82" },
    { id: "pict", name: "你畫我猜", icon: "🎨", desc: "2～6 人輪流畫、大家猜，另有自由畫板", c1: "#f08a3c", c2: "#b5521a" },
    { id: "sudoku", name: "數獨", icon: "🧩", desc: "四種難度、筆記與提示，自動存進度", c1: "#3d9be9", c2: "#2a5f9e" }
  ];

  var grid = document.getElementById("grid"), stage = document.getElementById("stage"), toastEl = document.getElementById("toast");
  var sndBtn = document.getElementById("sndBtn");
  var soundOn = true, frame = null, frameUrl = null, toastTimer = null;
  try {
    var hs = localStorage.getItem("hub_sound");
    if (hs === null) hs = localStorage.getItem("chess_sound");
    if (hs === "0") soundOn = false;
  } catch (e) {}


  /* 大廳音效（合成，不用音檔） */
  var AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
    if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(f, d, type, vol, when, f2) {
    if (!soundOn) return; var a = ac(); if (!a) return;
    var t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
  }
  var HSFX = {
    open: function () { tone(392, .12, "triangle", .16); tone(523, .12, "triangle", .16, .09); tone(784, .22, "triangle", .16, .18); },
    back: function () { tone(784, .1, "triangle", .14); tone(523, .1, "triangle", .14, .08); tone(392, .18, "triangle", .14, .16); },
    soon: function () { tone(220, .18, "square", .08, 0, 160); },
    on: function () { tone(523, .08, "sine", .14); tone(784, .14, "sine", .14, .07); }
  };

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }
  function updSnd() { sndBtn.textContent = soundOn ? "🔊 音效：開" : "🔇 音效：關"; }
  function setSound(on, fromGame) {
    soundOn = on; updSnd();
    try { localStorage.setItem("hub_sound", on ? "1" : "0"); } catch (e) {}
    if (!fromGame && frame && frame.contentWindow) { try { frame.contentWindow.postMessage({ hub: "sound", on: on }, "*"); } catch (e) {} }
  }
  sndBtn.addEventListener("click", function () { setSound(!soundOn, false); if (soundOn) HSFX.on(); });
  updSnd();

  CATALOG.forEach(function (g) {
    var ready = !!GAMES[g.id];
    var d = document.createElement("div");
    d.className = "card " + (ready ? "ready" : "soon");
    d.style.setProperty("--c1", g.c1); d.style.setProperty("--c2", g.c2);
    d.innerHTML = '<div class="ico"></div><div class="nm"></div><div class="ds"></div><span class="tag">' + (ready ? "▶ 開始遊玩" : "準備中") + "</span>";
    d.querySelector(".ico").textContent = g.icon;
    d.querySelector(".nm").textContent = g.name;
    d.querySelector(".ds").textContent = g.desc;
    d.addEventListener("click", function () {
      if (!ready) { HSFX.soon(); toast("「" + g.name + "」還在準備中，敬請期待"); return; }
      HSFX.open();
      openGame(g.id);
    });
    grid.appendChild(d);
  });

  /* ---------- VIP：在大廳解鎖一次，所有遊戲共用 ---------- */
  var VIP_PW = "455466", vipOn = false, vipName = "";
  try { vipOn = localStorage.getItem("hub_vip") === "1"; vipName = localStorage.getItem("hub_vip_name") || ""; } catch (e) {}
  if (vipOn && !vipName) vipName = "VIP";
  var vipBtn = document.getElementById("vipBtn"), vipModal = document.getElementById("vipModal");
  function updVip() { vipBtn.textContent = vipOn ? "👑 VIP：" + vipName : "👑 VIP"; vipBtn.classList.toggle("on", vipOn); }
  function pushVip() { if (frame && frame.contentWindow) { try { frame.contentWindow.postMessage({ hub: "vip", on: vipOn, name: vipName }, "*"); } catch (e) {} } }
  function saveVip() { try { localStorage.setItem("hub_vip", vipOn ? "1" : "0"); localStorage.setItem("hub_vip_name", vipName); } catch (e) {} }
  function showVipBox(w) { document.getElementById("vipPwBox").style.display = w === "pw" ? "" : "none"; document.getElementById("vipNameBox").style.display = w === "name" ? "" : "none"; vipModal.classList.add("show"); }
  vipBtn.addEventListener("click", function () {
    if (vipOn) {
      if (confirm("目前是 VIP：" + vipName + "\n要關閉 VIP 模式嗎？")) { vipOn = false; saveVip(); updVip(); toast("已關閉 VIP"); }
      return;
    }
    document.getElementById("vipPwIn").value = ""; document.getElementById("vipErr").textContent = ""; showVipBox("pw");
    setTimeout(function () { document.getElementById("vipPwIn").focus(); }, 50);
  });
  function tryPw() {
    if (document.getElementById("vipPwIn").value.trim() === VIP_PW) {
      var pre = ""; try { pre = localStorage.getItem("hub_vip_name") || localStorage.getItem("chess_vip_name") || ""; } catch (e) {}
      document.getElementById("vipNameIn").value = pre; showVipBox("name"); HSFX.on();
      setTimeout(function () { document.getElementById("vipNameIn").focus(); }, 50);
    } else { document.getElementById("vipErr").textContent = "密碼錯誤"; HSFX.soon(); }
  }
  document.getElementById("vipPwOk").addEventListener("click", tryPw);
  document.getElementById("vipPwIn").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPw(); });
  document.getElementById("vipPwCancel").addEventListener("click", function () { vipModal.classList.remove("show"); });
  function okName() {
    var n = document.getElementById("vipNameIn").value.trim();
    if (!n) { document.getElementById("vipNameIn").focus(); return; }
    vipOn = true; vipName = n; saveVip(); updVip(); vipModal.classList.remove("show"); HSFX.open(); toast("👑 VIP 已開啟：所有遊戲生效");
  }
  document.getElementById("vipNameOk").addEventListener("click", okName);
  document.getElementById("vipNameIn").addEventListener("keydown", function (e) { if (e.key === "Enter") okName(); });
  updVip();

  function openGame(id) {
    closeGame();
    frameUrl = URL.createObjectURL(new Blob([GAMES[id]], { type: "text/html" }));
    frame = document.createElement("iframe");
    frame.setAttribute("allow", "autoplay");
    frame.addEventListener("load", pushVip);
    frame.src = frameUrl;
    stage.appendChild(frame);
    stage.classList.add("show");
  }
  function closeGame() {
    if (frame) { try { frame.src = "about:blank"; } catch (e) {} if (frame.parentNode) frame.parentNode.removeChild(frame); frame = null; }
    if (frameUrl) { try { URL.revokeObjectURL(frameUrl); } catch (e) {} frameUrl = null; }
    stage.classList.remove("show");
  }

  window.addEventListener("message", function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data;
    if (!d) return;
    if (d.hub === "home") { HSFX.back(); closeGame(); }
    else if (d.hub === "open" && typeof d.game === "string" && GAMES[d.game]) openGame(d.game);
    else if (d.hub === "sound") setSound(!!d.on, true);
  });
})();
</script>
</body>
</html>
